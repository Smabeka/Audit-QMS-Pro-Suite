<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AQMS Pro Suite</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AQMS Pro Suite">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c2b4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f7f5ee; --paper:#ffffff; --line:#e2dbc9; --line2:#eee7d5; --ink:#2a2620;
    --muted:#8a8168; --navy:#1c2b4a; --navyBg:#e4e9f2; --rust:#9b3f28; --rustBg:#f6e4dd;
    --green:#3f6b2e; --greenBg:#e6ede0; --amber:#8a5a10; --amberBg:#faedd4;
  }
  body.dark{
    --bg:#121212; --paper:#1d1d1d; --line:#333029; --line2:#2b2822; --ink:#f0ede4;
    --muted:#a39a86; --navy:#5b7fc4; --navyBg:#26314a; --rust:#e08669; --rustBg:#3d251f;
    --green:#8fc46e; --greenBg:#213321; --amber:#e0b95f; --amberBg:#3a3020;
  }
  body.dark .logo{background:var(--navy);}
  body.dark header{background:rgba(18,18,18,.95);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',sans-serif;}
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px;}
  header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(247,245,238,.95);backdrop-filter:blur(6px);z-index:10;}
  .headrow{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:700;letter-spacing:.02em;flex-shrink:0;}
  .brand h1{font-size:21px;font-weight:600;margin:0;color:var(--navy);}
  .brand p{font-size:11px;color:var(--muted);margin:2px 0 0;text-transform:uppercase;letter-spacing:.12em;}
  nav{display:flex;gap:4px;}
  nav button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;font-size:14px;color:var(--muted);cursor:pointer;font-family:inherit;}
  nav button.active{color:var(--rust);border-color:var(--rust);}
  main{padding:24px 0 60px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(30,25,15,.04);}
  .p4{padding:16px;}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
  @media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr);}}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px;}
  .stat-value{font-size:24px;font-family:'Fraunces',serif;color:var(--navy);}
  input,select{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;color:var(--ink);font-family:inherit;width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--rust);box-shadow:0 0 0 3px rgba(155,63,40,.12);}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;font-size:14px;cursor:pointer;border:none;font-family:inherit;}
  .btn-primary{background:var(--navy);color:#fff;font-weight:500;}
  .btn-primary:hover{background:#16223b;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:#4a4535;}
  .btn-ghost:hover{background:#efe9dc;}
  .btn-danger{background:transparent;border:1px solid #e8c3b5;color:var(--rust);}
  .btn-danger:hover{background:var(--rustBg);}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;border:1px solid;font-size:11px;font-weight:500;}
  .tag-neutral{background:#efe9dc;color:#5c5540;border-color:#ddd4bc;}
  .tag-rust{background:var(--rustBg);color:var(--rust);border-color:#e8c3b5;}
  .tag-green{background:var(--greenBg);color:var(--green);border-color:#c7dab8;}
  .tag-navy{background:var(--navyBg);color:var(--navy);border-color:#c3cee2;}
  .tag-amber{background:var(--amberBg);color:var(--amber);border-color:#efd6a0;}
  .grid2{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.grid2{grid-template-columns:1fr 1fr;}}
  .grid3{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.grid3{grid-template-columns:1fr 1fr 1fr;}}
  .audit-row{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:none;border:none;cursor:pointer;text-align:left;font-family:inherit;}
  .audit-row:hover{background:#faf8f2;}
  .audit-title{font-size:14px;font-weight:500;color:var(--ink);}
  .audit-sub{font-size:11px;color:#a39a86;}
  .section-box{border:1px solid var(--line2);border-radius:10px;padding:12px;margin-bottom:10px;}
  .item-row{display:flex;align-items:flex-start;gap:8px;padding:4px 0;}
  .result-toggle{display:flex;gap:2px;flex-shrink:0;}
  .result-toggle button{background:none;border:none;cursor:pointer;padding:4px;border-radius:4px;font-size:16px;line-height:1;}
  .result-toggle button.active{background:#efe9dc;}
  .finding-box{border:1px solid var(--line2);border-radius:10px;padding:12px;margin-bottom:10px;}
  .muted-italic{color:#a39a86;font-style:italic;font-size:13px;}
  .flex-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .status-pill{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:none;cursor:pointer;font-family:inherit;}
  .status-pill.active{border-color:rgba(155,63,40,.5);color:var(--rust);background:var(--rustBg);}
  .top-border{border-top:1px solid var(--line2);padding-top:12px;margin-top:12px;}
  .x-btn{background:none;border:none;color:#c9c0a8;cursor:pointer;padding:2px;}
  .x-btn:hover{color:var(--rust);}
  .saved-flash{font-size:10px;color:var(--green);}
  .center{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .pro-tag{background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(30,25,15,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-card{background:var(--paper);border-radius:12px;padding:20px;max-width:360px;width:100%;}
  #print-report{display:none;}
  @media print{
    body{background:#fff;}
    header,.no-print{display:none !important;}
    #app > *:not(#print-report){display:none !important;}
    #print-report{display:block !important;}
    #print-report table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px;}
    #print-report th,#print-report td{border:1px solid #ccc;padding:6px 8px;text-align:left;}
    #print-report th{background:#eef1f6;}
    #print-report h1{font-size:20px;margin:0 0 2px;}
    #print-report .meta{font-size:12px;color:#555;margin-bottom:10px;}
    #print-report .section-title{font-size:13px;font-weight:700;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em;}
    #print-report .sig-row{display:flex;gap:40px;margin-top:40px;}
    #print-report .sig-line{flex:1;border-top:1px solid #333;padding-top:4px;font-size:11px;color:#555;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print-report"></div>

<script>
/* ---------- storage ---------- */
const STORE_KEY = "audit-qms-standalone-v1";
function loadStore(){ try{ const r = localStorage.getItem(STORE_KEY); return r? JSON.parse(r): null; }catch(e){ return null; } }
function saveStore(d){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }catch(e){ console.error(e); } }

/* Pro unlock — change PRO_CODE to whatever code you distribute to paying users.
   Note: this is a client-side check only (anyone could view-source to find it) —
   it's a soft gate suitable for now, not real license enforcement. */
const PRO_CODE = "AQMS-PRO-2026";
function isPro(){ return localStorage.getItem("aqms-pro-unlocked") === "true"; }
function unlockPro(code){ if(code.trim() === PRO_CODE){ localStorage.setItem("aqms-pro-unlocked","true"); return true; } return false; }

const APP_VERSION = "v2.0";
const uid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().slice(0,10);
const daysUntil = (d) => Math.ceil((new Date(d) - new Date(today())) / 86400000);
function formatAuditNumber(n, year){ return `AUD-${year}-${String(n).padStart(4,'0')}`; }

const STANDARDS = [
  "ISO 9001:2015","ISO 22000","FSSC 22000","BRCGS","HACCP","Internal GMP",
  "Pharma GMP","ISO 45001 (Steel/Mining OHS)","ISO 14001 (Petroleum/Environmental)",
  "ISO 50001 (Energy)","WIPHA (Wine)","TPN (Tobacco)","Cosmetics GMP",
  "SMETA/AQL (Clothing)","ISO/ESD (Tech)","IOSA (Airlines)","ISM Code (Maritime)",
  "Minerals Processing"
];
const TEMPLATES = {
  "ISO 9001:2015":[
    {name:"Document Control", items:["Controlled documents current, no obsolete versions in use","Document approval and revision history maintained","Records retained per defined retention schedule"]},
    {name:"Management Review & Internal Audit", items:["Management review inputs/outputs documented","Internal audit programme up to date and scheduled","Prior audit findings closed out with evidence"]},
    {name:"Nonconformity & Corrective Action", items:["Nonconformities logged with root cause analysis","Corrective actions verified for effectiveness"]}
  ],
  "ISO 22000":[
    {name:"Food Safety Management System", items:["Food safety policy communicated and understood","Hazard analysis reviewed and current","PRPs (prerequisite programmes) implemented and verified"]},
    {name:"Operational Controls", items:["CCP/OPRP monitoring records complete","Emergency preparedness and recall procedure tested"]}
  ],
  "FSSC 22000":[
    {name:"Food Defense & Fraud", items:["Food defense (TACCP) plan current and site-assessed","Food fraud (VACCP) vulnerability assessment on file"]},
    {name:"PRP Verification", items:["Pest control programme records up to date","Allergen management controls verified","Glass and hard plastic register current"]}
  ],
  "HACCP":[
    {name:"CCP Monitoring", items:["Critical limits defined and monitored for each CCP","Monitoring records complete for the review period","Deviation and corrective action log up to date"]},
    {name:"HACCP Plan Maintenance", items:["HACCP plan reviewed annually or after process change","Verification/validation activities documented"]}
  ],
  "Internal GMP":[
    {name:"Personnel Hygiene", items:["Hand-washing and sanitising practices observed","Protective clothing worn and changed as required"]},
    {name:"Premises & Equipment", items:["Cleaning schedules completed and signed off","Equipment calibration records current","Pest control stations checked and logged"]}
  ],
  "Pharma GMP":[
    {name:"Batch Records & Documentation", items:["Batch manufacturing records complete and signed","Deviations documented with impact assessment","Line clearance verified before batch start"]},
    {name:"Cleanroom & Environmental Monitoring", items:["Environmental monitoring within alert/action limits","Gowning procedure followed correctly","Equipment cleaning validation current"]}
  ],
  "ISO 45001 (Steel/Mining OHS)":[
    {name:"Hazard Identification & Risk", items:["Risk assessments current for high-risk tasks","PPE availability and correct usage confirmed","Permit-to-work system followed for hot/confined work"]},
    {name:"Incident Management", items:["Incidents and near-misses logged and investigated","Emergency response drills conducted per schedule"]}
  ],
  "ISO 14001 (Petroleum/Environmental)":[
    {name:"Environmental Controls", items:["Spill containment and secondary containment intact","Waste segregation and disposal records current","Emissions monitoring within permitted limits"]},
    {name:"Compliance & Emergency Preparedness", items:["Environmental legal register up to date","Spill/emergency response equipment accessible and tested"]}
  ],
  "ISO 50001 (Energy)":[
    {name:"Energy Performance", items:["Energy baseline and KPIs reviewed and current","Significant energy uses identified and monitored"]},
    {name:"Energy Management System", items:["Energy action plans tracked to completion","Metering/sub-metering data verified for accuracy"]}
  ],
  "WIPHA (Wine)":[
    {name:"Cellar & Production Hygiene", items:["Tank and equipment sanitation records complete","Additive and processing aid usage logged correctly"]},
    {name:"Traceability & Labelling", items:["Batch/vintage traceability from grape intake to bottling","Label claims (vintage, region, varietal) verified against records"]}
  ],
  "TPN (Tobacco)":[
    {name:"Product Quality Controls", items:["Moisture and physical parameter checks recorded","Foreign matter inspection records current"]},
    {name:"Traceability & Track-and-Trace", items:["Unique identifier/track-and-trace markings verified","Supply chain due diligence records on file"]}
  ],
  "Cosmetics GMP":[
    {name:"Formulation & Batch Control", items:["Batch records match approved formulation","Microbial and stability testing records current"]},
    {name:"Labelling & Claims", items:["INCI ingredient listing accurate on labels","Product claims substantiated and on file"]}
  ],
  "SMETA/AQL (Clothing)":[
    {name:"Labour & Ethical Standards", items:["Working hours and wage records reviewed","Health & safety conditions on the production floor observed"]},
    {name:"AQL Inspection", items:["Sample size and AQL level applied per inspection plan","Defects classified (critical/major/minor) and logged"]}
  ],
  "ISO/ESD (Tech)":[
    {name:"ESD Control Programme", items:["Wrist strap and grounding checks logged at workstations","ESD flooring/matting resistance tested per schedule"]},
    {name:"Product Quality", items:["Functional test records complete for finished units","Firmware/software version traceability maintained"]}
  ],
  "IOSA (Airlines)":[
    {name:"Flight Operations & Safety", items:["Crew training and currency records up to date","Safety management system (SMS) reports reviewed"]},
    {name:"Ground & Catering Operations", items:["Ground handling procedures followed per manual","Catering food safety and cold chain records verified"]}
  ],
  "ISM Code (Maritime)":[
    {name:"Safety Management System", items:["Shipboard SMS documentation current and accessible","Non-conformities from prior audit closed out"]},
    {name:"Crew & Emergency Preparedness", items:["Crew drills (fire, abandon ship, pollution) conducted per schedule","Certificates of competency current for all crew"]}
  ],
  "Minerals Processing":[
    {name:"Process Controls", items:["Process parameters within specification ranges","Sampling and assay records complete and traceable"]},
    {name:"Safety & Environmental", items:["Tailings/waste management controls verified","Dust and emissions monitoring records current"]}
  ]
};
const SEVERITIES = ["Minor","Major","Critical"];
const sevTone = {Minor:"amber",Major:"rust",Critical:"rust"};
const statusTone = {Open:"rust","In Progress":"amber",Closed:"green",Planned:"navy"};

const RISK_LEVELS = ["Low","Medium","High","Critical"];
const riskTone = {Low:"green",Medium:"amber",High:"rust",Critical:"rust"};

function logHistory(a, text){
  if(!a.history) a.history = [];
  a.history.push({ id: uid(), date: new Date().toISOString(), text });
}

function seedAudit(title, standard, area, sections, auditNumber){
  return {
    id: uid(), auditNumber: auditNumber || null, title, standard, area, auditor:"", date: today(), status:"Planned",
    riskLevel: "Medium", history: [{ id: uid(), date: new Date().toISOString(), text: "Audit created" }],
    sections: sections.map(s => ({ id: uid(), name: s.name, items: s.items.map(text => ({id:uid(), text, result:null, note:""})) })),
    findings: []
  };
}

function seedData(){
  const a = seedAudit("Q3 GMP Verification — Bakery Line 2","FSSC 22000","Production",[
    {name:"Personnel Hygiene", items:["Hairnets and beard snoods worn correctly","No jewellery or false nails observed","Hand-wash stations stocked and functional"]},
    {name:"CCP Monitoring", items:["Chiller temp logs complete and within range","Metal detector verification records up to date"]},
    {name:"Housekeeping", items:["Floors and drains clean, no standing water","Waste segregated and bins covered"]}
  ], formatAuditNumber(1, new Date().getFullYear()));
  a.sections[1].items[1].result = "Fail";
  a.findings = [{
    id: uid(), clause:"CCP Monitoring", desc:"Metal detector verification log missing entries for two shifts",
    severity:"Major", owner:"Line Supervisor", dueDate:"2026-07-18",
    actionText:"Reissue verification log, retrain shift leads, daily QA spot-check for 2 weeks", status:"Open"
  }];
  return { audits: [a], auditSeq: 1 };
}

function migrateAuditNumbers(){
  if(state.auditSeq === undefined){
    state.auditSeq = 0;
    [...state.audits].reverse().forEach(a=>{
      if(!a.auditNumber){
        state.auditSeq++;
        const year = (a.date && new Date(a.date).getFullYear()) || new Date().getFullYear();
        a.auditNumber = formatAuditNumber(state.auditSeq, year);
      }
    });
    saveStore(state);
  }
  let changed = false;
  state.audits.forEach(a=>{
    if(!a.riskLevel){ a.riskLevel = "Medium"; changed = true; }
    if(!a.history){ a.history = [{ id: uid(), date: new Date().toISOString(), text: "Audit created" }]; changed = true; }
  });
  if(changed) saveStore(state);
}

let state = loadStore() || seedData();
migrateAuditNumbers();
let tab = "dashboard";
let jumpTo = null;
let showNewAudit = false;
let openAuditId = null;
let capaFilter = "All";
let savedFlashTimer = null;
let auditSearch = "";
let auditStandardFilter = "All";
let auditStatusFilter = "All";
let auditRiskFilter = "All";
let showProModal = false;
let darkMode = localStorage.getItem("aqms-dark") === "true";
let pendingDeleteAuditId = null;
let showCompanyModal = false;
if(!state.companySettings){ state.companySettings = { name:"", address:"", footerText:"", logoDataUrl:"" }; }

function persist(){
  saveStore(state);
  const el = document.getElementById("saved-flash");
  if(el){ el.style.opacity = "1"; clearTimeout(savedFlashTimer); savedFlashTimer = setTimeout(()=>{ if(el) el.style.opacity="0"; }, 900); }
}

function esc(str){ const d=document.createElement("div"); d.textContent = str==null? "": str; return d.innerHTML; }

/* ---------- render ---------- */
function render(){
  scoreCache.clear();
  document.body.classList.toggle('dark', darkMode);
  const root = document.getElementById("app");
  root.innerHTML = `
    <header>
      <div class="wrap headrow">
        <div class="brand">
          <div class="logo">AQ</div>
          <div><h1>AuditQMS Pro Suite <span style="font-size:10px;color:var(--muted);font-weight:400;">${APP_VERSION}</span></h1><p>Food · Safety · Environment · Lab</p></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="btn btn-ghost no-print" data-action="toggle-dark" style="font-size:12px;padding:6px 10px;" title="Toggle dark mode">${darkMode?'☀️':'🌙'}</button>
          ${isPro() ? `<span class="pro-tag">PRO</span>` : `<button class="btn btn-ghost no-print" data-action="open-pro-modal" style="font-size:12px;padding:6px 10px;">Unlock Pro</button>`}
          <span class="saved-flash" id="saved-flash" style="opacity:0;transition:opacity .3s;">● saved</span>
        </div>
      </div>
      <div class="wrap" style="display:flex;gap:4px;">
        ${navBtn("dashboard","Dashboard")}
        ${navBtn("audits","Audit Register")}
        ${navBtn("capa","CAPA Tracker")}
        ${navBtn("analytics","Analytics")}
      </div>
    </header>
    <main class="wrap">
      ${tab==="dashboard" ? renderDashboard() : tab==="audits" ? renderAudits() : tab==="capa" ? renderCapa() : renderAnalytics()}
    </main>
    ${showProModal ? renderProModal() : ''}
    ${pendingDeleteAuditId ? renderDeleteConfirmModal() : ''}
    ${showCompanyModal ? renderCompanyModal() : ''}
  `;
  attachHandlers();
  if(tab==="analytics") renderCharts();
}

function renderCompanyModal(){
  const c = state.companySettings;
  return `
    <div class="modal-overlay" data-action="close-company-modal">
      <div class="modal-card" style="max-width:420px;" onclick="event.stopPropagation()">
        <h3 class="serif" style="margin:0 0 6px;font-size:18px;color:var(--navy);">Company Settings</h3>
        <p style="font-size:13px;color:var(--muted);margin:0 0 12px;">This branding appears on PDF audit reports.</p>
        <div class="grid2" style="margin-bottom:10px;">
          <label class="field" style="grid-column:1/-1;">Company Name<input id="cs-name" value="${esc(c.name)}" placeholder="e.g. Siyathemba Catering" /></label>
          <label class="field" style="grid-column:1/-1;">Company Address / Contact<input id="cs-address" value="${esc(c.address)}" placeholder="Address, phone, email…" /></label>
          <label class="field" style="grid-column:1/-1;">Report Footer Text<input id="cs-footer" value="${esc(c.footerText)}" placeholder="e.g. Confidential — Internal Use Only" /></label>
          <label class="field" style="grid-column:1/-1;">Company Logo<input type="file" id="cs-logo" accept="image/*" /></label>
          ${c.logoDataUrl ? `<div style="grid-column:1/-1;"><img src="${c.logoDataUrl}" style="max-height:50px;max-width:140px;border:1px solid var(--line);border-radius:6px;padding:4px;" /></div>` : ''}
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="btn btn-ghost" data-action="close-company-modal">Cancel</button>
          <button class="btn btn-primary" data-action="save-company-settings">Save</button>
        </div>
      </div>
    </div>
  `;
}

function renderDeleteConfirmModal(){
  const a = state.audits.find(x=>x.id===pendingDeleteAuditId);
  if(!a) return '';
  return `
    <div class="modal-overlay" data-action="cancel-delete-audit">
      <div class="modal-card" onclick="event.stopPropagation()">
        <h3 class="serif" style="margin:0 0 6px;font-size:18px;color:var(--rust);">Delete Audit?</h3>
        <p style="font-size:13px;color:var(--muted);margin:0 0 14px;">This will permanently delete "<strong>${esc(a.title)}</strong>"${a.auditNumber?` (${a.auditNumber})`:''} and cannot be undone.</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="btn btn-ghost" data-action="cancel-delete-audit">Cancel</button>
          <button class="btn btn-danger" style="background:var(--rust);color:#fff;border:none;" data-action="confirm-delete-audit">Delete</button>
        </div>
      </div>
    </div>
  `;
}

function renderProModal(){
  return `
    <div class="modal-overlay" data-action="close-pro-modal">
      <div class="modal-card" onclick="event.stopPropagation()">
        <h3 class="serif" style="margin:0 0 6px;font-size:18px;color:var(--navy);">Unlock Pro</h3>
        <p style="font-size:13px;color:var(--muted);margin:0 0 12px;">Pro unlocks Backup/Restore and PDF audit report exports.</p>
        <label class="field">Access Code<input id="pro-code-input" placeholder="Enter code" /></label>
        <div id="pro-error" style="color:var(--rust);font-size:12px;margin-top:6px;display:none;">Incorrect code — please try again.</div>

function navBtn(key,label){
  return `<button data-nav="${key}" class="${tab===key?'active':''}">${label}</button>`;

let scoreCache = new Map();
function scoreOf(audit){
  if(scoreCache.has(audit.id)) return scoreCache.get(audit.id);
  const items = audit.sections.flatMap(s=>s.items).filter(i=>i.result==="Pass"||i.result==="Fail");
  const score = items.length===0 ? null : Math.round((items.filter(i=>i.result==="Pass").length/items.length)*100);
  scoreCache.set(audit.id, score);
  return score;
}

function renderDashboard(){
  const audits = state.audits;
  const allFindings = audits.flatMap(a=>a.findings.map(f=>({...f, auditTitle:a.title, auditId:a.id})));
  const openFindings = allFindings.filter(f=>f.status!=="Closed");
  const overdue = openFindings.filter(f=>f.dueDate && daysUntil(f.dueDate)<0);
  const critical = openFindings.filter(f=>f.severity==="Critical"||f.severity==="Major");
  const scored = audits.map(scoreOf).filter(s=>s!==null);
  const avgScore = scored.length ? Math.round(scored.reduce((a,b)=>a+b,0)/scored.length) : null;

  return `
    <div class="stats">
      ${statCard("Total Audits", audits.length)}
      ${statCard("Open Findings", openFindings.length)}
      ${statCard("Overdue CAPAs", overdue.length)}
      ${statCard("Avg. Compliance", avgScore!==null?avgScore+"%":"—")}
    </div>
    <div class="card p4" style="margin-bottom:16px;">
      <h3 class="serif" style="font-size:16px;margin:0 0 10px;">Priority Findings</h3>
      ${critical.filter(f=>f.status!=="Closed").length===0 ? `<p class="muted-italic">No major or critical findings open right now.</p>` :
        critical.filter(f=>f.status!=="Closed").slice(0,6).map(f=>`
          <button data-jump-audit="${f.auditId}" class="audit-row" style="background:#faf8f2;border:1px solid #e8e1cd;border-radius:8px;margin-bottom:6px;">
            <div style="min-width:0;">
              <div style="font-size:14px;">${esc(f.desc)}</div>
              <div class="audit-sub">${esc(f.auditTitle)} · ${esc(f.clause)}</div>
            </div>
            <div class="flex-wrap">
              ${f.dueDate && daysUntil(f.dueDate)<0 ? `<span class="tag tag-rust">overdue</span>`:''}
              <span class="tag tag-${sevTone[f.severity]}">${f.severity}</span>
            </div>
          </button>`).join('')}
    </div>
    <div class="card p4">
      <h3 class="serif" style="font-size:16px;margin:0 0 10px;">Audit Overview</h3>
      ${audits.map(a=>{
        const s = scoreOf(a);
        return `<button data-jump-audit="${a.id}" class="audit-row" style="border-radius:8px;">
          <div style="display:flex;align-items:center;gap:8px;min-width:0;">
            <span style="color:#c9c0a8;">›</span><span style="font-size:14px;">${esc(a.title)}</span>

}
function statCard(label,value){
  return `<div class="card p4"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
}

function filteredAudits(){
  return state.audits.filter(a=>{
    const findingsText = a.findings.map(f=>f.desc+" "+f.clause).join(" ");
    const haystack = (a.title+" "+a.area+" "+a.auditor+" "+(a.auditNumber||"")+" "+findingsText).toLowerCase();
    const matchesSearch = !auditSearch || haystack.includes(auditSearch.toLowerCase());
    const matchesStandard = auditStandardFilter==="All" || a.standard===auditStandardFilter;
    const matchesStatus = auditStatusFilter==="All" || a.status===auditStatusFilter;
    const matchesRisk = auditRiskFilter==="All" || a.riskLevel===auditRiskFilter;
    return matchesSearch && matchesStandard && matchesStatus && matchesRisk;
  });
}

/* ---------- analytics ---------- */
let chartInstances = {};

function renderAnalytics(){
  return `
    <h2 class="serif" style="font-size:18px;margin:0 0 16px;">Analytics</h2>
    <div class="grid2" style="margin-bottom:16px;">
      <div class="card p4">

        <canvas id="chart-ageing" height="220"></canvas>

    </div>
    <div class="grid2">
      <div class="card p4">
        <h3 class="serif" style="font-size:15px;margin:0 0 10px;">Compliance Trend</h3>
        <canvas id="chart-trend" height="220"></canvas>
      </div>
      <div class="card p4">
        <h3 class="serif" style="font-size:15px;margin:0 0 10px;">Audits by Standard</h3>
        <canvas id="chart-standards" height="220"></canvas>
      </div>
    </div>
  `;
}

function destroyChart(key){
  if(chartInstances[key]){ chartInstances[key].destroy(); delete chartInstances[key]; }
}

function renderCharts(){
  if(typeof Chart === 'undefined'){ return; }
  const gridColor = darkMode ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
  const textColor = darkMode ? '#d8d3c6' : '#5c5540';
  Chart.defaults.color = textColor;
  Chart.defaults.borderColor = gridColor;

  /* Findings by severity (open only) */
  const openFindings = state.audits.flatMap(a=>a.findings).filter(f=>f.status!=="Closed");
  const sevCounts = ["Minor","Major","Critical"].map(s=>openFindings.filter(f=>f.severity===s).length);
  destroyChart('severity');
  const sevCtx = document.getElementById('chart-severity');
  if(sevCtx){
    chartInstances.severity = new Chart(sevCtx, {
      type: 'doughnut',
      data: { labels:["Minor","Major","Critical"], datasets:[{ data: sevCounts, backgroundColor:['#8a5a10','#9b3f28','#7a2c1a'] }] },
      options: { plugins:{ legend:{ position:'bottom' } }, maintainAspectRatio:true }
    });
  }

  /* CAPA ageing buckets (open findings with a due date) */
  const openWithDue = openFindings.filter(f=>f.dueDate);
  const buckets = { "Not overdue":0, "1–7 days":0, "8–30 days":0, "30+ days":0 };
  openWithDue.forEach(f=>{
    const overdueDays = -daysUntil(f.dueDate);
    if(overdueDays <= 0) buckets["Not overdue"]++;
    else if(overdueDays <= 7) buckets["1–7 days"]++;
    else if(overdueDays <= 30) buckets["8–30 days"]++;
    else buckets["30+ days"]++;
  });
  destroyChart('ageing');
  const ageingCtx = document.getElementById('chart-ageing');
  if(ageingCtx){
    chartInstances.ageing = new Chart(ageingCtx, {
      type: 'bar',
      data: { labels: Object.keys(buckets), datasets:[{ label:"Open CAPAs", data: Object.values(buckets), backgroundColor:'#9b3f28' }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 }, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Compliance trend across audits, ordered by date */
  const scoredAudits = state.audits
    .map(a=>({ label: a.auditNumber || a.title, date:a.date, score: scoreOf(a) }))
    .filter(a=>a.score!==null)
    .sort((x,y)=>x.date.localeCompare(y.date));
  destroyChart('trend');
  const trendCtx = document.getElementById('chart-trend');
  if(trendCtx){
    chartInstances.trend = new Chart(trendCtx, {
      type: 'line',
      data: { labels: scoredAudits.map(a=>a.label), datasets:[{ label:"Compliance %", data: scoredAudits.map(a=>a.score), borderColor:'#1c2b4a', backgroundColor:'rgba(28,43,74,.15)', fill:true, tension:.25 }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Audits by standard */
  const byStandard = {};
  state.audits.forEach(a=>{ byStandard[a.standard] = (byStandard[a.standard]||0)+1; });
  destroyChart('standards');
  const stdCtx = document.getElementById('chart-standards');
  if(stdCtx){
    chartInstances.standards = new Chart(stdCtx, {
      type: 'bar',
      data: { labels: Object.keys(byStandard), datasets:[{ label:"Audits", data: Object.values(byStandard), backgroundColor:'#3f6b2e' }] },
      options: { indexAxis:'y', plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, ticks:{ precision:0 }, grid:{color:gridColor} }, y:{ grid:{display:false} } } }
    });
  }
}

/* ---------- PDF audit report ---------- */
function buildAuditPrintReport(a){
  const items = a.sections.flatMap(s=>s.items).filter(i=>i.result==="Pass"||i.result==="Fail");
  const score = items.length ? Math.round((items.filter(i=>i.result==="Pass").length/items.length)*100) : null;
  const checklistRows = a.sections.map(sec => `
    <div class="section-title">${esc(sec.name)}</div>
    <table><thead><tr><th>Item</th><th>Result</th><th>Note</th></tr></thead>
    <tbody>
      ${sec.items.map(it=>`<tr><td>${esc(it.text)}</td><td>${it.result||'—'}</td><td>${esc(it.note)||''}</td></tr>`).join('')}
    </tbody></table>
  `).join('');

  const findingsRows = a.findings.length ? `
    <div class="section-title">Findings & CAPA</div>
    <table><thead><tr><th>Description</th><th>Clause</th><th>Severity</th><th>Owner</th><th>Due</th><th>CAPA</th><th>Status</th></tr></thead>
    <tbody>
      ${a.findings.map(f=>`<tr><td>${esc(f.desc)}</td><td>${esc(f.clause)}</td><td>${f.severity}</td><td>${esc(f.owner)||'—'}</td><td>${f.dueDate||'—'}</td><td>${esc(f.actionText)||'—'}</td><td>${f.status}</td></tr>`).join('')}
    </tbody></table>
  ` : `<div class="section-title">Findings & CAPA</div><p>No findings logged.</p>`;

  const c = state.companySettings || {};
  const logoHtml = c.logoDataUrl
    ? `<img src="${c.logoDataUrl}" style="max-height:44px;max-width:120px;" />`
    : `<div style="width:40px;height:40px;border-radius:9px;background:#1c2b4a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:sans-serif;">AQ</div>`;
  const brandName = c.name ? esc(c.name) : "AuditQMS Pro Suite";
  const brandAddress = c.address ? `<div class="meta">${esc(c.address)}</div>` : '';

  document.getElementById('print-report').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      ${logoHtml}
      <div>
        <h1>${brandName}</h1>
        ${brandAddress}
        <div class="meta">Audit Report — Generated ${new Date().toLocaleString()}</div>
      </div>
    </div>
    <table>
      <tbody>
        <tr><th>Audit Number</th><td>${esc(a.auditNumber)||'—'}</td><th>Standard</th><td>${esc(a.standard)}</td></tr>
        <tr><th>Audit Title</th><td colspan="3">${esc(a.title)}</td></tr>
        <tr><th>Area</th><td>${esc(a.area)||'—'}</td><th>Auditor</th><td>${esc(a.auditor)||'—'}</td></tr>
        <tr><th>Date</th><td>${a.date}</td><th>Status</th><td>${a.status}</td></tr>
        <tr><th>Compliance Score</th><td colspan="3">${score!==null? score+'%' : 'Not yet scored'}</td></tr>
      </tbody>
    </table>
    ${checklistRows}
    ${findingsRows}
    <div class="sig-row">
      <div class="sig-line">Auditor Signature &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Date: ______________</div>
      <div class="sig-line">Approval Signature &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Date: ______________</div>
    </div>
    <div style="margin-top:24px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#777;text-align:center;">
      ${c.footerText ? esc(c.footerText) + ' &nbsp;·&nbsp; ' : ''}${a.auditNumber?esc(a.auditNumber)+' &nbsp;·&nbsp; ':''}Generated by AQMS Pro Suite ${APP_VERSION}
    </div>
  `;
}

/* ---------- event handling ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{ tab = el.dataset.nav; if(tab!=="audits") openAuditId=null; render(); });
  document.querySelectorAll('[data-jump-audit]').forEach(el=>el.onclick=()=>{
    jumpTo = el.dataset.jumpAudit; openAuditId = jumpTo; tab="audits";
    auditSearch = ""; auditStandardFilter = "All"; auditStatusFilter = "All"; auditRiskFilter = "All";
    render();
  });
  const toggleNew = document.querySelector('[data-action="toggle-new-audit"]'); if(toggleNew) toggleNew.onclick=()=>{ showNewAudit=!showNewAudit; render(); };
  const cancelNew = document.querySelector('[data-action="cancel-new-audit"]'); if(cancelNew) cancelNew.onclick=()=>{ showNewAudit=false; render(); };
  const createAudit = document.querySelector('[data-action="create-audit"]');
  if(createAudit) createAudit.onclick=()=>{
    const title = document.getElementById('na-title').value.trim();
    if(!title) return;
    const standard = document.getElementById('na-standard').value;
    const area = document.getElementById('na-area').value;
    const tmpl = TEMPLATES[standard];
    const sections = tmpl ? tmpl.map(s=>({name:s.name, items:[...s.items]})) : [{name:"General", items:[]}];
    state.auditSeq = (state.auditSeq||0) + 1;
    const auditNumber = formatAuditNumber(state.auditSeq, new Date().getFullYear());
    const a = seedAudit(title, standard, area, sections, auditNumber);
    state.audits.unshift(a);
    openAuditId = a.id; showNewAudit=false; persist(); render();
  };

  document.querySelectorAll('[data-toggle-audit]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggleAudit; openAuditId = openAuditId===id ? null : id; render();
  });

  document.querySelectorAll('[data-audit-field]').forEach(el=>{
    el.onchange = () => {
      const [id, field] = el.dataset.auditField.split(':');
      const a = state.audits.find(x=>x.id===id);
      const oldValue = a[field];
      a[field] = el.value;
      if((field==="status" || field==="riskLevel") && oldValue !== el.value){
        logHistory(a, `${field==="status"?"Status":"Risk level"} changed: ${oldValue} → ${el.value}`);
      }
      persist(); render();
    };
  });

  document.querySelectorAll('[data-action="delete-audit"]').forEach(el=>el.onclick=()=>{
    pendingDeleteAuditId = el.dataset.audit; render();
  });
  document.querySelectorAll('[data-action="cancel-delete-audit"]').forEach(el=>el.onclick=()=>{
    pendingDeleteAuditId = null; render();
  });
  const confirmDeleteBtn = document.querySelector('[data-action="confirm-delete-audit"]');
  if(confirmDeleteBtn) confirmDeleteBtn.onclick=()=>{
    state.audits = state.audits.filter(a=>a.id!==pendingDeleteAuditId);
    openAuditId=null; pendingDeleteAuditId=null; persist(); render();
  };

  const darkToggle = document.querySelector('[data-action="toggle-dark"]');
  if(darkToggle) darkToggle.onclick=()=>{
    darkMode = !darkMode; localStorage.setItem("aqms-dark", darkMode ? "true" : "false"); render();
  };

  document.querySelectorAll('[data-toggle-result]').forEach(el=>el.onclick=()=>{
    const [auditId, secId, itemId, val] = el.dataset.toggleResult.split(':');
    const a = state.audits.find(x=>x.id===auditId);
    const sec = a.sections.find(s=>s.id===secId);
    const item = sec.items.find(i=>i.id===itemId);
    item.result = item.result===val ? null : val;
    persist(); render();
  });

  document.querySelectorAll('[data-item-note]').forEach(el=>el.onchange=()=>{
    const [auditId, secId, itemId] = el.dataset.itemNote.split(':');
    const a = state.audits.find(x=>x.id===auditId);
    const sec = a.sections.find(s=>s.id===secId);
    const item = sec.items.find(i=>i.id===itemId);
    item.note = el.value; persist();
  });

  document.querySelectorAll('[data-action="remove-item"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    const sec = a.sections.find(s=>s.id===el.dataset.section);
    sec.items = sec.items.filter(i=>i.id!==el.dataset.item);
    persist(); render();
  });

  document.querySelectorAll('[data-action="add-item"]').forEach(el=>el.onclick=()=>{
    const input = document.querySelector(`[data-new-item="${el.dataset.audit}:${el.dataset.section}"]`);
    const text = input.value.trim(); if(!text) return;
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    const sec = a.sections.find(s=>s.id===el.dataset.section);
    sec.items.push({id:uid(), text, result:null, note:""});
    persist(); render();
  });

  document.querySelectorAll('[data-action="remove-section"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    a.sections = a.sections.filter(s=>s.id!==el.dataset.section);
    persist(); render();
  });

  document.querySelectorAll('[data-action="add-section"]').forEach(el=>el.onclick=()=>{
    const input = document.getElementById(`new-section-${el.dataset.audit}`);
    const name = input.value.trim(); if(!name) return;
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    a.sections.push({id:uid(), name, items:[]});
    persist(); render();
  });

  document.querySelectorAll('[data-action="remove-finding"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    a.findings = a.findings.filter(f=>f.id!==el.dataset.finding);
    persist(); render();
  });

  document.querySelectorAll('[data-set-finding-status]').forEach(el=>el.onclick=()=>{
    const [auditId, findingId, status] = el.dataset.setFindingStatus.split(':');
    const a = state.audits.find(x=>x.id===auditId);
    const f = a.findings.find(x=>x.id===findingId);
    if(f.status !== status) logHistory(a, `Finding "${f.desc.slice(0,50)}${f.desc.length>50?'…':''}" status: ${f.status} → ${status}`);
    f.status = status; persist(); render();
  });

  document.querySelectorAll('[data-action="add-finding"]').forEach(el=>el.onclick=()=>{
    const auditId = el.dataset.audit;
    const desc = document.getElementById(`nf-desc-${auditId}`).value.trim();
    if(!desc) return;
    const a = state.audits.find(x=>x.id===auditId);
    a.findings.push({
      id: uid(),
      clause: document.getElementById(`nf-clause-${auditId}`).value,
      desc,
      severity: document.getElementById(`nf-severity-${auditId}`).value,
      owner: document.getElementById(`nf-owner-${auditId}`).value,
      dueDate: document.getElementById(`nf-due-${auditId}`).value,
      actionText: document.getElementById(`nf-action-${auditId}`).value,
      status: "Open"
    });
    logHistory(a, `Finding logged: "${desc.slice(0,50)}${desc.length>50?'…':''}"`);
    persist(); render();
  });

  document.querySelectorAll('[data-capa-filter]').forEach(el=>el.onclick=()=>{
    capaFilter = el.dataset.capaFilter; render();
  });

  /* search & filter */
  const searchInput = document.getElementById('audit-search');
  if(searchInput){
    searchInput.oninput = () => {
      auditSearch = searchInput.value;
      render();
      const newInput = document.getElementById('audit-search');
      if(newInput){ newInput.focus(); newInput.setSelectionRange(auditSearch.length, auditSearch.length); }
    };
  }
  const stdFilter = document.getElementById('audit-filter-standard');
  if(stdFilter) stdFilter.onchange = ()=>{ auditStandardFilter = stdFilter.value; render(); };
  const statusFilter = document.getElementById('audit-filter-status');
  if(statusFilter) statusFilter.onchange = ()=>{ auditStatusFilter = statusFilter.value; render(); };
  const riskFilter = document.getElementById('audit-filter-risk');
  if(riskFilter) riskFilter.onchange = ()=>{ auditRiskFilter = riskFilter.value; render(); };

  /* pro modal */
  const openProBtn = document.querySelector('[data-action="open-pro-modal"]'); if(openProBtn) openProBtn.onclick=()=>{ showProModal=true; render(); };
  document.querySelectorAll('[data-action="close-pro-modal"]').forEach(el=>el.onclick=()=>{ showProModal=false; render(); });
  const submitProBtn = document.querySelector('[data-action="submit-pro-code"]');
  if(submitProBtn) submitProBtn.onclick=()=>{
    const code = document.getElementById('pro-code-input').value;
    if(unlockPro(code)){ showProModal=false; render(); }
    else { document.getElementById('pro-error').style.display='block'; }
  };

  /* company settings modal */
  const openCompanyBtn = document.querySelector('[data-action="open-company-modal"]');
  if(openCompanyBtn) openCompanyBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    showCompanyModal=true; render();
  };
  document.querySelectorAll('[data-action="close-company-modal"]').forEach(el=>el.onclick=()=>{ showCompanyModal=false; render(); });
  const saveCompanyBtn = document.querySelector('[data-action="save-company-settings"]');
  if(saveCompanyBtn) saveCompanyBtn.onclick=()=>{
    state.companySettings.name = document.getElementById('cs-name').value;
    state.companySettings.address = document.getElementById('cs-address').value;
    state.companySettings.footerText = document.getElementById('cs-footer').value;
    const logoFile = document.getElementById('cs-logo').files[0];
    if(logoFile){
      const reader = new FileReader();
      reader.onload = () => { state.companySettings.logoDataUrl = reader.result; persist(); showCompanyModal=false; render(); };
      reader.readAsDataURL(logoFile);
    } else {
      persist(); showCompanyModal=false; render();
    }
  };

  /* Excel export (Pro gated) */
  const excelBtn = document.querySelector('[data-action="export-excel"]');
  if(excelBtn) excelBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    if(typeof XLSX === 'undefined'){ alert('Excel library failed to load — check your internet connection and try again.'); return; }
    const auditRows = state.audits.map(a=>({
      "Audit Number": a.auditNumber||'', "Title": a.title, "Standard": a.standard, "Area": a.area,
      "Auditor": a.auditor, "Date": a.date, "Status": a.status, "Compliance %": scoreOf(a)
    }));
    const findingRows = state.audits.flatMap(a=>a.findings.map(f=>({
      "Audit Number": a.auditNumber||'', "Audit Title": a.title, "Clause": f.clause, "Description": f.desc,
      "Severity": f.severity, "Owner": f.owner, "Due Date": f.dueDate, "CAPA": f.actionText, "Status": f.status
    })));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(auditRows), "Audits");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(findingRows), "Findings & CAPA");
    XLSX.writeFile(wb, `aqms-export-${today()}.xlsx`);
  };

  /* CSV export (Pro gated) — findings/CAPA, most useful for external analysis */
  const csvBtn = document.querySelector('[data-action="export-csv"]');
  if(csvBtn) csvBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    const headers = ["Audit Number","Audit Title","Clause","Description","Severity","Owner","Due Date","CAPA","Status"];
    const rows = state.audits.flatMap(a=>a.findings.map(f=>[
      a.auditNumber||'', a.title, f.clause, f.desc, f.severity, f.owner||'', f.dueDate||'', f.actionText||'', f.status
    ]));
    const csvEscape = (v) => `"${String(v).replace(/"/g,'""')}"`;
    const csv = [headers.map(csvEscape).join(','), ...rows.map(r=>r.map(csvEscape).join(','))].join('\n');
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `aqms-findings-${today()}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };


  const backupBtn = document.querySelector('[data-action="open-backup"]');
  if(backupBtn) backupBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `aqms-backup-${today()}.json`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
    localStorage.setItem('aqms-last-backup', new Date().toLocaleString());
    render();
  };
  const restoreBtn = document.querySelector('[data-action="open-restore"]');
  const restoreFileInput = document.getElementById('restore-file-input');
  if(restoreBtn) restoreBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    restoreFileInput.click();
  };
  if(restoreFileInput) restoreFileInput.onchange=()=>{
    const file = restoreFileInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data.audits) throw new Error("Invalid backup file");
        if(!confirm("Restoring will replace all current audits with the backup file. Continue?")) return;
        state = data; openAuditId=null; persist(); render();
      }catch(e){ alert("Could not read this file — please check it's a valid AQMS backup."); }
    };
    reader.readAsText(file);
  };

  /* PDF export (Pro gated) */
  document.querySelectorAll('[data-action="export-audit-pdf"]').forEach(el=>el.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    buildAuditPrintReport(a);
    window.print();
  });
}

render();

/* auto-save safety net — quietly persists every 5s in case a change slipped through */
setInterval(() => { saveStore(state); }, 5000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', function(){
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      });
    });
  });
}

function showUpdateBanner(){
  if(document.getElementById('update-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1c2b4a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:200;font-family:sans-serif;font-size:13px;gap:10px;';
  banner.innerHTML = '<span>A new version of AuditQMS Pro Suite is available.</span><button id="reload-app-btn" style="background:#fff;color:#1c2b4a;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;">Reload</button>';
  document.body.appendChild(banner);
  document.getElementById('reload-app-btn').onclick = () => window.location.reload();
}
</script>
</body>
</html>
