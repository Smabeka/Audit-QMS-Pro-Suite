<script>
/* ---------- storage ---------- */
const STORE_KEY = "audit-qms-standalone-v1";

/* ---------- workspaces (multi-client support) ----------
   Each client/company gets its own isolated dataset under its own localStorage key
   (STORE_KEY + "::" + workspaceId). A small registry ("aqms-workspaces") tracks the
   list of workspaces, and "aqms-current-workspace" tracks which one is active.
   loadStore/saveStore always read/write whichever workspace is currently active. */
const WORKSPACES_KEY = "aqms-workspaces";
const CURRENT_WORKSPACE_KEY = "aqms-current-workspace";
function workspaceStoreKey(id){ return STORE_KEY + "::" + id; }
function getWorkspaces(){ try{ const r = localStorage.getItem(WORKSPACES_KEY); return r ? JSON.parse(r) : []; }catch(e){ return []; } }
function saveWorkspaces(list){ try{ localStorage.setItem(WORKSPACES_KEY, JSON.stringify(list)); return true; }catch(e){ console.error(e); return false; } }

let currentWorkspaceId = null;
/* Runs once at startup. Migrates a pre-workspace install (single dataset under STORE_KEY)
   into a first workspace, or creates a fresh one if this is a brand new install. */
function initWorkspaces(){
  let workspaces = getWorkspaces();
  if(workspaces.length === 0){
    const legacyRaw = localStorage.getItem(STORE_KEY);
    const id = uid();
    let name = "My Company";
    if(legacyRaw){
      try{ const legacy = JSON.parse(legacyRaw); if(legacy && legacy.companySettings && legacy.companySettings.name) name = legacy.companySettings.name; }catch(e){}
      localStorage.setItem(workspaceStoreKey(id), legacyRaw);
      localStorage.removeItem(STORE_KEY);
    }
    workspaces = [{id, name}];
    saveWorkspaces(workspaces);
    localStorage.setItem(CURRENT_WORKSPACE_KEY, id);
    currentWorkspaceId = id;
  } else {
    currentWorkspaceId = localStorage.getItem(CURRENT_WORKSPACE_KEY);
    if(!currentWorkspaceId || !workspaces.find(w=>w.id===currentWorkspaceId)){
      currentWorkspaceId = workspaces[0].id;
      localStorage.setItem(CURRENT_WORKSPACE_KEY, currentWorkspaceId);
    }
  }
}
function currentWorkspaceName(){
  const w = getWorkspaces().find(w=>w.id===currentWorkspaceId);
  return w ? w.name : "My Company";
}
function switchWorkspace(id){
  if(id === currentWorkspaceId) return;
  saveStore(state); // flush current workspace before leaving it
  currentWorkspaceId = id;
  localStorage.setItem(CURRENT_WORKSPACE_KEY, id);
  state = loadStore() || { audits: [], auditSeq: 0 };
  migrateAuditNumbers();
  ensureStateDefaults();
  showWorkspaceModal = false;
  newWorkspaceName = "";
  render();
}
function createWorkspace(name){
  const trimmed = (name||"").trim();
  if(!trimmed) return;
  const id = uid();
  const list = getWorkspaces();
  list.push({id, name: trimmed});
  saveWorkspaces(list);
  saveStore(state); // flush current workspace first
  currentWorkspaceId = id;
  localStorage.setItem(CURRENT_WORKSPACE_KEY, id);
  state = { audits: [], auditSeq: 0 }; // new client starts empty, not the demo dataset
  saveStore(state);
  migrateAuditNumbers();
  ensureStateDefaults();
  showWorkspaceModal = false;
  newWorkspaceName = "";
  render();
}
function renameWorkspace(id, name){
  const trimmed = (name||"").trim();
  if(!trimmed) return;
  const list = getWorkspaces();
  const w = list.find(w=>w.id===id);
  if(w){ w.name = trimmed; saveWorkspaces(list); render(); }
}
function deleteWorkspace(id){
  const list = getWorkspaces();
  if(list.length <= 1) return; // never delete the last remaining workspace
  const remaining = list.filter(w=>w.id!==id);
  saveWorkspaces(remaining);
  localStorage.removeItem(workspaceStoreKey(id));
  if(id === currentWorkspaceId){
    currentWorkspaceId = remaining[0].id;
    localStorage.setItem(CURRENT_WORKSPACE_KEY, currentWorkspaceId);
    state = loadStore() || { audits: [], auditSeq: 0 };
    migrateAuditNumbers();
    ensureStateDefaults();
  }
  pendingDeleteWorkspaceId = null;
  render();
}

function loadStore(){ try{ const r = localStorage.getItem(workspaceStoreKey(currentWorkspaceId)); return r? JSON.parse(r): null; }catch(e){ return null; } }
function saveStore(d){ try{ localStorage.setItem(workspaceStoreKey(currentWorkspaceId), JSON.stringify(d)); return true; }catch(e){ console.error(e); return false; } }

/* ---------- Cloud Backup (Phase 1: Supabase) ----------
   This is a manual push/pull backup, not live multi-user sync — that's a later phase.
   To enable: create a free project at supabase.com, run the SQL setup (see project notes),
   then fill in SUPABASE_URL and SUPABASE_ANON_KEY below. Until those are filled in,
   the Cloud Account feature is simply hidden and the app behaves exactly as before. */
const SUPABASE_URL = "https://panpkvjfyjichfioriqr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ArasDdZ0EsWKnq3WM9HhkA_nN7eRHFE";
const CLOUD_ENABLED = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;

let supabaseClient = null;
if(CLOUD_ENABLED && window.supabase){
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch(e){ console.error("Supabase init failed:", e); }
}

let currentCloudUser = null;   // { id, email } once signed in, else null
let showCloudModal = false;
let cloudAuthMode = "signin";  // "signin" | "signup"
let cloudStatus = "";          // short status/result message shown in the Cloud modal
let cloudBusy = false;

async function initCloudSession(){
  if(!supabaseClient) return;
  try{
    const { data } = await supabaseClient.auth.getSession();
    if(data && data.session){ currentCloudUser = data.session.user; render(); }
  }catch(e){ console.error(e); }
}
async function cloudSignUp(email, password){
  if(!supabaseClient) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  cloudBusy = false;
  if(error){ cloudStatus = "⚠ " + error.message; }
  else { cloudStatus = "✓ Account created. Check your email to confirm, then sign in."; }
  render();
}
async function cloudSignIn(email, password){
  if(!supabaseClient) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  cloudBusy = false;
  if(error){ cloudStatus = "⚠ " + error.message; }
  else { currentCloudUser = data.user; cloudStatus = ""; }
  render();
}
async function cloudSignOut(){
  if(!supabaseClient) return;
  await supabaseClient.auth.signOut();
  currentCloudUser = null;
  render();
}
/* Pushes the CURRENT workspace's data to the cloud, one row per (user, workspace).
   This overwrites whatever was previously backed up for this workspace. */
async function cloudBackupNow(){
  if(!supabaseClient || !currentCloudUser) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { error } = await supabaseClient.from("workspace_backups").upsert({
    user_id: currentCloudUser.id,
    workspace_id: currentWorkspaceId,
    workspace_name: currentWorkspaceName(),
    data: state,
    updated_at: new Date().toISOString()
  }, { onConflict: "user_id,workspace_id" });
  cloudBusy = false;
  cloudStatus = error ? ("⚠ Backup failed: " + error.message) : "✓ Backed up to cloud just now.";
  render();
}
/* Pulls the cloud copy of the CURRENT workspace and replaces local data with it.
   Destructive to local changes, so the UI confirms before calling this. */
async function cloudRestoreNow(){
  if(!supabaseClient || !currentCloudUser) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { data, error } = await supabaseClient.from("workspace_backups")
    .select("data, updated_at")
    .eq("user_id", currentCloudUser.id)
    .eq("workspace_id", currentWorkspaceId)
    .maybeSingle();
  cloudBusy = false;
  if(error){ cloudStatus = "⚠ Restore failed: " + error.message; render(); return; }
  if(!data){ cloudStatus = "No cloud backup found for this workspace yet."; render(); return; }
  state = data.data;
  ensureStateDefaults();
  persist();
  cloudStatus = "✓ Restored from cloud (backed up " + new Date(data.updated_at).toLocaleString() + ").";
  render();
}
/* Lists which of the device's local workspaces also have a cloud backup, and when. */
async function cloudListBackups(){
  if(!supabaseClient || !currentCloudUser) return [];
  const { data, error } = await supabaseClient.from("workspace_backups")
    .select("workspace_id, workspace_name, updated_at")
    .eq("user_id", currentCloudUser.id);
  if(error){ console.error(error); return []; }
  return data || [];
}


/* Pro unlock — change PRO_CODE to whatever code you distribute to paying users.
   Note: this is a client-side check only (anyone could view-source to find it) —

const PRO_CODE = "AQMS-PRO-2026";
/* Pro gate temporarily disabled — all Pro features are free for now.

const PRO_GATE_ENABLED = false;

const uid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().slice(0,10);

function formatAuditNumber(n, year){ return `AUD-${year}-${String(n).padStart(4,'0')}`; }

function seedSampleMetrics(){
  const existingNames = new Set(state.metrics.map(m=>m.name));
  let added = 0;
  SAMPLE_KPI_METRICS.forEach(sm=>{
    if(existingNames.has(sm.name)) return;
    state.metrics.push({
      id: uid(), name: sm.name, category: sm.category, unit: sm.unit, target: sm.target,
      direction: sm.direction, critical: sm.critical, source: "manual", autoType: null,
      history: [{ id: uid(), date: today(), value: sm.value }]
    });
    added++;
  });
  return added;
}

function computeAutoMetricValue(autoType){
  const allFindings = state.audits.flatMap(a=>a.findings);
  switch(autoType){
    case "capa_closure_rate":
      if(allFindings.length===0) return null;
      return Math.round((allFindings.filter(f=>f.status==="Closed").length/allFindings.length)*1000)/10;
    case "overdue_capas":
      return allFindings.filter(f=>f.status!=="Closed" && f.dueDate && daysUntil(f.dueDate)<0).length;
    case "avg_audit_compliance": {
      const scores = state.audits.map(scoreOf).filter(s=>s!==null);
      if(scores.length===0) return null;
      return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
    }
    case "audit_findings_closed_count":
      return allFindings.filter(f=>f.status==="Closed").length;
    case "open_high_critical_risks":
      return state.riskAssessments.filter(r=>(r.riskLevel==="High"||r.riskLevel==="Critical") && RISK_NEEDS_ATTENTION_STATUSES.includes(r.status)).length;
    default:
      return null;
  }
}

function metricCurrentValue(m){
  if(m.source==="auto") return computeAutoMetricValue(m.autoType);
  if(!m.history || m.history.length===0) return null;
  const sorted = [...m.history].sort((a,b)=>a.date.localeCompare(b.date));
  return sorted[sorted.length-1].value;
}
function metricPreviousValue(m){
  if(m.source==="auto" || !m.history || m.history.length<2) return null;
  const sorted = [...m.history].sort((a,b)=>a.date.localeCompare(b.date));
  return sorted[sorted.length-2].value;
}
function metricStatus(m, value){
  if(value===null || value===undefined) return null;
  const onTarget = m.direction==="lower" ? value<=m.target : value>=m.target;
  return onTarget ? "On Target" : "Off Target";
}

function downloadCsv(headers, rows, filename){
  const csvEscape = (v) => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = [headers.map(csvEscape).join(','), ...rows.map(row=>row.map(csvEscape).join(','))].join('\n');
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* Compresses/resizes a photo client-side before storing as base64, to stay well within
   localStorage limits. Caps the LONGEST edge (whichever of width/height is larger) at
   maxDim px and re-encodes as JPEG at `quality`. Fixed: previously only checked width,
   so portrait-shaped photos with width < maxDim could skip compression entirely. */
function compressImageToDataURL(file, maxDim, quality, cb){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { alert("Could not read this image — please try a different photo."); };
    img.src = e.target.result;
  };
  reader.onerror = () => { alert("Could not read this file — please try a different photo."); };
  reader.readAsDataURL(file);
}

    return `<select ${attrString}>${opts.map(o=>`<option ${String(o)===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;

  if(field.type==='number'){
    return `<input type="number" ${attrString} value="${value==null?'':esc(value)}" placeholder="${esc(field.placeholder||'')}" />`;
