<style>
  :root{
    --bg:#f7f5ee; --paper:#ffffff; --line:#e2dbc9; --line2:#eee7d5; --ink:#2a2620;
    --muted:#8a8168; --navy:#1c2b4a; --navyBg:#e4e9f2; --rust:#9b3f28; --rustBg:#f6e4dd;
    --green:#3f6b2e; --greenBg:#e6ede0; --amber:#8a5a10; --amberBg:#faedd4;
  }
  body.dark{
    --bg:#121212; --paper:#1d1d1d; --line:#333029; --line2:#2b2822; --ink:#f0ede4;
    --muted:#a39a86; --navy:#5b7fc4; --navyBg:#26314a; --rust:#e08669; --rustBg:#3d251f;
    --green:#8fc46e; --greenBg:#213321; --amber:#e0b95f; --amberBg:#3a3020;

  body.dark header{background:rgba(18,18,18,.95);}

  .wrap{max-width:900px;margin:0 auto;padding:0 20px;}
  header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(247,245,238,.95);backdrop-filter:blur(6px);z-index:10;}
  .headrow{display:flex;align-items:center;justify-content:space-between;padding:16px 0;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:flex-start;gap:10px;}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:700;letter-spacing:.02em;flex-shrink:0;}

  .tag-amber{background:var(--amberBg);color:var(--amber);border-color:#efd6a0;}

<script>
/* ---------- storage ---------- */
const STORE_KEY = "audit-qms-standalone-v1";

/* ---------- workspaces (multi-client support) ----------
   Each client/company gets its own isolated dataset under its own localStorage key
   (STORE_KEY + "::" + workspaceId). A small registry ("aqms-workspaces") tracks the
   list of workspaces, and "aqms-current-workspace" tracks which one is active.
   loadStore/saveStore always read/write whichever workspace is currently active. */
const WORKSPACES_KEY = "aqms-workspaces";
const CURRENT_WORKSPACE_KEY = "aqms-current-workspace";
function workspaceStoreKey(id){ return STORE_KEY + "::" + id; }
function getWorkspaces(){ try{ const r = localStorage.getItem(WORKSPACES_KEY); return r ? JSON.parse(r) : []; }catch(e){ return []; } }
function saveWorkspaces(list){ try{ localStorage.setItem(WORKSPACES_KEY, JSON.stringify(list)); return true; }catch(e){ console.error(e); return false; } }

let currentWorkspaceId = null;
/* Runs once at startup. Migrates a pre-workspace install (single dataset under STORE_KEY)
   into a first workspace, or creates a fresh one if this is a brand new install. */
function initWorkspaces(){
  let workspaces = getWorkspaces();
  if(workspaces.length === 0){
    const legacyRaw = localStorage.getItem(STORE_KEY);
    const id = uid();
    let name = "My Company";
    if(legacyRaw){
      try{ const legacy = JSON.parse(legacyRaw); if(legacy && legacy.companySettings && legacy.companySettings.name) name = legacy.companySettings.name; }catch(e){}
      localStorage.setItem(workspaceStoreKey(id), legacyRaw);
      localStorage.removeItem(STORE_KEY);
    }
    workspaces = [{id, name}];
    saveWorkspaces(workspaces);
    localStorage.setItem(CURRENT_WORKSPACE_KEY, id);
    currentWorkspaceId = id;
  } else {
    currentWorkspaceId = localStorage.getItem(CURRENT_WORKSPACE_KEY);
    if(!currentWorkspaceId || !workspaces.find(w=>w.id===currentWorkspaceId)){
      currentWorkspaceId = workspaces[0].id;
      localStorage.setItem(CURRENT_WORKSPACE_KEY, currentWorkspaceId);
    }
  }
}
function currentWorkspaceName(){
  const w = getWorkspaces().find(w=>w.id===currentWorkspaceId);
  return w ? w.name : "My Company";
}
function switchWorkspace(id){
  if(id === currentWorkspaceId) return;
  saveStore(state); // flush current workspace before leaving it
  currentWorkspaceId = id;
  localStorage.setItem(CURRENT_WORKSPACE_KEY, id);
  state = loadStore() || { audits: [], auditSeq: 0 };
  migrateAuditNumbers();
  ensureStateDefaults();
  showWorkspaceModal = false;
  newWorkspaceName = "";
  render();
}
function createWorkspace(name){
  const trimmed = (name||"").trim();
  if(!trimmed) return;
  const id = uid();
  const list = getWorkspaces();
  list.push({id, name: trimmed});
  saveWorkspaces(list);
  saveStore(state); // flush current workspace first
  currentWorkspaceId = id;
  localStorage.setItem(CURRENT_WORKSPACE_KEY, id);
  state = { audits: [], auditSeq: 0 }; // new client starts empty, not the demo dataset
  saveStore(state);
  migrateAuditNumbers();
  ensureStateDefaults();
  showWorkspaceModal = false;
  newWorkspaceName = "";
  render();
}
function renameWorkspace(id, name){
  const trimmed = (name||"").trim();
  if(!trimmed) return;
  const list = getWorkspaces();
  const w = list.find(w=>w.id===id);
  if(w){ w.name = trimmed; saveWorkspaces(list); render(); }
}
function deleteWorkspace(id){
  const list = getWorkspaces();
  if(list.length <= 1) return; // never delete the last remaining workspace
  const remaining = list.filter(w=>w.id!==id);
  saveWorkspaces(remaining);
  localStorage.removeItem(workspaceStoreKey(id));
  if(id === currentWorkspaceId){
    currentWorkspaceId = remaining[0].id;
    localStorage.setItem(CURRENT_WORKSPACE_KEY, currentWorkspaceId);
    state = loadStore() || { audits: [], auditSeq: 0 };
    migrateAuditNumbers();
    ensureStateDefaults();
  }
  pendingDeleteWorkspaceId = null;
  render();
}

function loadStore(){ try{ const r = localStorage.getItem(workspaceStoreKey(currentWorkspaceId)); return r? JSON.parse(r): null; }catch(e){ return null; } }
function saveStore(d){ try{ localStorage.setItem(workspaceStoreKey(currentWorkspaceId), JSON.stringify(d)); return true; }catch(e){ console.error(e); return false; } }

/* ---------- Cloud Backup (Phase 1: Supabase) ----------
   This is a manual push/pull backup, not live multi-user sync — that's a later phase.
   To enable: create a free project at supabase.com, run the SQL setup (see project notes),
   then fill in SUPABASE_URL and SUPABASE_ANON_KEY below. Until those are filled in,
   the Cloud Account feature is simply hidden and the app behaves exactly as before. */
const SUPABASE_URL = "https://rchzyvnkfgofvdkgoawm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5f0SnAqrhuvo148s6N0cpA_4d37ntTX";
const CLOUD_ENABLED = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;

let supabaseClient = null;
if(CLOUD_ENABLED && window.supabase){
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch(e){ console.error("Supabase init failed:", e); }
}

let currentCloudUser = null;   // { id, email } once signed in, else null
let showCloudModal = false;
let cloudAuthMode = "signin";  // "signin" | "signup"
let cloudStatus = "";          // short status/result message shown in the Cloud modal
let cloudBusy = false;

async function initCloudSession(){
  if(!supabaseClient) return;
  try{
    const { data } = await supabaseClient.auth.getSession();
    if(data && data.session){
      currentCloudUser = data.session.user; render();
      await fetchMyProfile();
      if(currentProfile && currentProfile.status === "Active"){
        fetchDocumentsFromCloud();
        subscribeDocumentsRealtime();
        fetchCapaFindingsFromCloud();
        subscribeCapaRealtime();
        fetchRiskFromCloud();
        subscribeRiskRealtime();
        syncAllGenericCloudModules();
      }
    }
    else { render(); } // nothing was in session, but we still need to drop the "Loading…" gate
  }catch(e){ console.error(e); render(); }
}
async function cloudSignUp(email, password, fullName){
  if(!supabaseClient) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { data, error } = await supabaseClient.auth.signUp({ email, password, options:{ data:{ full_name: fullName||email } } });
  cloudBusy = false;
  if(error){ cloudStatus = "⚠ " + error.message; }
  else { cloudStatus = "✓ Account created. Check your email to confirm, then sign in. An Administrator must also activate your account before you can log in."; }
  render();
}
async function cloudSignIn(email, password){
  if(!supabaseClient) return;
  cloudBusy = true; cloudStatus = ""; loginError = ""; render();
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email.trim(), password });
  cloudBusy = false;
  if(error){
    const msg = error.message.toLowerCase();
    if(msg.includes("email not confirmed")){
      cloudStatus = "⚠ Please confirm your email first — check your inbox (and spam folder) for the confirmation link.";
    } else if(msg.includes("invalid login credentials")){
      cloudStatus = "⚠ Wrong email or password. If you just registered, make sure you've confirmed your email.";
    } else {
      cloudStatus = "⚠ " + error.message;
    }
    render();
    return;
  }
  currentCloudUser = data.user;
  cloudStatus = "";
  render();
  await fetchMyProfile();
  if(!currentProfile){
    // Profile row missing — signup trigger may not have run, or RLS blocked the read
    loginError = profileLoadError
      ? "Couldn't load your account profile (" + profileLoadError + "). Contact your Administrator."
      : "No profile found for this account yet. Contact your Administrator — the account setup may be incomplete.";
    await supabaseClient.auth.signOut();
    currentCloudUser = null; currentProfile = null;
    render();
    return;
  }
  if(currentProfile.status === "Disabled"){
    loginError = "This account is not yet activated. Ask an Administrator to activate it under Users & Roles.";
    await supabaseClient.auth.signOut();
    currentCloudUser = null; currentProfile = null;
    render();
    return;
  }
  loginError = "";
  render();
  fetchDocumentsFromCloud();
  subscribeDocumentsRealtime();
  fetchCapaFindingsFromCloud();
  subscribeCapaRealtime();
  fetchRiskFromCloud();
  subscribeRiskRealtime();
  syncAllGenericCloudModules();
}
async function cloudResetPassword(email){
  if(!supabaseClient) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
  cloudBusy = false;
  cloudStatus = error ? ("⚠ " + error.message) : "✓ Password reset email sent — check your inbox for the link.";
  render();
}
async function cloudSignOut(){
  if(!supabaseClient) return;
  unsubscribeDocumentsRealtime();
  unsubscribeCapaRealtime();
  unsubscribeRiskRealtime();
  unsyncAllGenericCloudModules();
  await supabaseClient.auth.signOut();
  currentCloudUser = null;
  currentProfile = null;
  allProfiles = [];
  state.documents = [];
  state.audits = state.audits.filter(a=>!a.isCloudShellAudit); // drop placeholder audits that only existed to hold synced CAPA data
  render();
}
/* Pushes the CURRENT workspace's data to the cloud, one row per (user, workspace).
   This overwrites whatever was previously backed up for this workspace. */
async function cloudBackupNow(){
  if(!supabaseClient || !currentCloudUser) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { error } = await supabaseClient.from("workspace_backups").upsert({
    user_id: currentCloudUser.id,
    workspace_id: currentWorkspaceId,
    workspace_name: currentWorkspaceName(),
    data: state,
    updated_at: new Date().toISOString()
  }, { onConflict: "user_id,workspace_id" });
  cloudBusy = false;
  cloudStatus = error ? ("⚠ Backup failed: " + error.message) : "✓ Backed up to cloud just now.";
  render();
}
/* Pulls the cloud copy of the CURRENT workspace and replaces local data with it.
   Destructive to local changes, so the UI confirms before calling this. */
async function cloudRestoreNow(){
  if(!supabaseClient || !currentCloudUser) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { data, error } = await supabaseClient.from("workspace_backups")
    .select("data, updated_at")
    .eq("user_id", currentCloudUser.id)
    .eq("workspace_id", currentWorkspaceId)
    .maybeSingle();
  cloudBusy = false;
  if(error){ cloudStatus = "⚠ Restore failed: " + error.message; render(); return; }
  if(!data){ cloudStatus = "No cloud backup found for this workspace yet."; render(); return; }
  state = data.data;
  ensureStateDefaults();
  persist();
  cloudStatus = "✓ Restored from cloud (backed up " + new Date(data.updated_at).toLocaleString() + ").";
  render();
  if(cloudReady()){ fetchDocumentsFromCloud(); fetchCapaFindingsFromCloud(); fetchRiskFromCloud(); syncAllGenericCloudModules(); } // Documents, CAPA, Risk and every cloudSynced module live in their own shared tables now — don't let a personal workspace snapshot override the team's shared copy
}
/* Lists which of the device's local workspaces also have a cloud backup, and when. */
async function cloudListBackups(){
  if(!supabaseClient || !currentCloudUser) return [];
  const { data, error } = await supabaseClient.from("workspace_backups")
    .select("workspace_id, workspace_name, updated_at")
    .eq("user_id", currentCloudUser.id);
  if(error){ console.error(error); return []; }
  return data || [];
}


/* Pro unlock — change PRO_CODE to whatever code you distribute to paying users.
   Note: this is a client-side check only (anyone could view-source to find it) —
   it's a soft gate suitable for now, not real license enforcement. */
const PRO_CODE = "AQMS-PRO-2026";
/* Pro gate temporarily disabled — all Pro features are free for now.
   Flip this back to true whenever you want to re-enable the paywall. */
const PRO_GATE_ENABLED = false;
function isPro(){ return !PRO_GATE_ENABLED || localStorage.getItem("aqms-pro-unlocked") === "true"; }
function unlockPro(code){ if(code.trim() === PRO_CODE){ localStorage.setItem("aqms-pro-unlocked","true"); return true; } return false; }

const APP_VERSION = "Enterprise Edition 2.0";
const uid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().slice(0,10);
const daysUntil = (d) => Math.ceil((new Date(d) - new Date(today())) / 86400000);
function formatAuditNumber(n, year){ return `AUD-${year}-${String(n).padStart(4,'0')}`; }
function nextSeqCode(list, field, prefix){
  const year = new Date().getFullYear();
  const pattern = new RegExp(`^${prefix}-${year}-(\\d+)$`);
  let max = 0;
  (list||[]).forEach(r=>{
    const m = (r[field]||"").match(pattern);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return `${prefix}-${year}-${String(max+1).padStart(3,'0')}`;
}

const STANDARDS = [
  "ISO 9001:2015","ISO 22000","FSSC 22000","BRCGS","HACCP","Internal GMP",
  "Pharma GMP","ISO 45001 (OHS)","ISO 14001 (Environmental)",
  "ISO 50001 (Energy)","WIPHA (Wine)","TPN (Tobacco)","Cosmetics GMP",

];

const COPQ_CATEGORIES = ["Scrap & Rework","Customer Returns","Complaint Handling","Downtime & Delays","Recall Costs","Product Disposal","Product Recall","Microbiological Failure","Other"];
const CLAUSE_OPTIONS = ["4. Context of the Organization","5. Leadership","6. Planning","7. Support","8. Operation","9. Performance Evaluation","10. Improvement"];
const TEMPLATES = {

/* ---------------------------------------------------------------
   Generic multi-user data sync for GENERIC_MODULES entries.
   Any module with `cloudSynced: true, supabaseTable: "table_name"`
   in its GENERIC_MODULES definition gets automatic shared-data sync
   through this engine — no per-module code needed beyond that flag
   plus a matching Supabase table (id, workspace_id, created_by,
   updated_by, fields jsonb, created_at, updated_at).
   Modules WITHOUT cloudSynced are completely unaffected — they keep
   working exactly as before, purely local. This lets each module be
   turned on for sharing one at a time, tested individually.
--------------------------------------------------------------- */
let cloudSyncStatus = {}; // { [moduleKey]: "" | "syncing" | "error: ..." }
async function cloudSyncFetch(cfg){
  if(!cloudReady() || !cfg.supabaseTable) return;
  cloudSyncStatus[cfg.key] = "syncing"; render();
  const { data, error } = await supabaseClient.from(cfg.supabaseTable)
    .select("*").order("created_at", { ascending:true });
  if(error){
    cloudSyncStatus[cfg.key] = "error: " + error.message;
    render();
    return;
  }
  state[cfg.stateArr] = (data||[]).map(row => ({ id: row.id, ...row.fields }));
  cloudSyncStatus[cfg.key] = "";
  persist(); render();
}
async function cloudSyncInsert(cfg, record){
  if(!cloudReady() || !cfg.supabaseTable) return;
  const { id, ...fields } = record;
  const { error } = await supabaseClient.from(cfg.supabaseTable).insert({
    id, created_by: currentCloudUser.id, updated_by: currentCloudUser.id, fields
  });
  if(error){ cloudSyncStatus[cfg.key] = "error: " + error.message; render(); }
}
async function cloudSyncUpdate(cfg, record){
  if(!cloudReady() || !cfg.supabaseTable) return;
  const { id, ...fields } = record;
  const { error } = await supabaseClient.from(cfg.supabaseTable).update({
    fields, updated_by: currentCloudUser.id, updated_at: new Date().toISOString()
  }).eq("id", id);
  if(error){ cloudSyncStatus[cfg.key] = "error: " + error.message; render(); }
}
async function cloudSyncDelete(cfg, id){
  if(!cloudReady() || !cfg.supabaseTable) return;
  const { error } = await supabaseClient.from(cfg.supabaseTable).delete().eq("id", id);
  if(error){ cloudSyncStatus[cfg.key] = "error: " + error.message; render(); }
}
let genericRealtimeChannels = {}; // { [moduleKey]: channel }
function subscribeGenericModuleRealtime(cfg){
  if(!cloudReady() || !cfg.supabaseTable || genericRealtimeChannels[cfg.key]) return;
  genericRealtimeChannels[cfg.key] = supabaseClient.channel(cfg.supabaseTable + "-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:cfg.supabaseTable }, (payload) => {
      const arr = state[cfg.stateArr] || (state[cfg.stateArr] = []);
      if(payload.eventType === "DELETE"){
        state[cfg.stateArr] = arr.filter(r=>r.id!==payload.old.id);
      } else {
        const updated = { id: payload.new.id, ...payload.new.fields };
        const idx = arr.findIndex(r=>r.id===updated.id);
        if(idx>=0) arr[idx] = updated; else arr.unshift(updated);
      }
      render();
    })
    .subscribe();
}
function unsubscribeGenericModuleRealtime(cfg){
  if(genericRealtimeChannels[cfg.key]){ supabaseClient.removeChannel(genericRealtimeChannels[cfg.key]); delete genericRealtimeChannels[cfg.key]; }
}
function syncAllGenericCloudModules(){
  GENERIC_MODULES.filter(m=>m.cloudSynced).forEach(cfg=>{
    cloudSyncFetch(cfg);
    subscribeGenericModuleRealtime(cfg);
  });
}
function unsyncAllGenericCloudModules(){
  GENERIC_MODULES.filter(m=>m.cloudSynced).forEach(cfg=>unsubscribeGenericModuleRealtime(cfg));
}

/* ---------------- Shared Documents (Day 1 of the multi-user migration) ----------------
   state.documents stays the in-memory array every existing render function already
   reads — that doesn't change. What changes is where it comes FROM (Supabase, not just
   localStorage) and that every write also pushes to the cloud + a live subscription
   pulls in everyone else's changes automatically. */
let documentsSyncError = "";
let documentsRealtimeChannel = null;

function docRowToLocal(row){
  return {
    id: row.id, title: row.title, docNumber: row.doc_number, category: row.category,
    version: row.version, status: row.status, owner: row.owner,
    issueDate: row.issue_date, reviewDate: row.review_date,
    reviewedBy: row.reviewed_by, reviewedDate: row.reviewed_date,
    approvedBy: row.approved_by, approvedDate: row.approved_date,
    notes: row.notes, history: row.history||[], acknowledgments: row.acknowledgments||[]
  };
}
function docLocalToRow(d){
  return {
    id: d.id, title: d.title, doc_number: d.docNumber, category: d.category,
    version: d.version, status: d.status, owner: d.owner,
    issue_date: d.issueDate||null, review_date: d.reviewDate||null,
    reviewed_by: d.reviewedBy||null, reviewed_date: d.reviewedDate||null,
    approved_by: d.approvedBy||null, approved_date: d.approvedDate||null,
    notes: d.notes, history: d.history||[], acknowledgments: d.acknowledgments||[],
    updated_at: new Date().toISOString()
  };
}
async function fetchDocumentsFromCloud(){
  if(!cloudReady()) return;
  const { data, error } = await supabaseClient.from("documents").select("*").order("created_at", { ascending:false });
  if(error){ documentsSyncError = error.message; render(); return; }
  state.documents = (data||[]).map(docRowToLocal);
  documentsSyncError = "";
  render();
}
async function pushDocumentToCloud(d){
  if(!cloudReady()) return;
  const row = docLocalToRow(d);
  if(!d.createdByPushed){ row.created_by = currentCloudUser.id; d.createdByPushed = true; }
  const { error } = await supabaseClient.from("documents").upsert(row);
  if(error){ documentsSyncError = error.message; render(); }
}
async function deleteDocumentFromCloud(id){
  if(!cloudReady()) return;
  const { error } = await supabaseClient.from("documents").delete().eq("id", id);
  if(error){ documentsSyncError = error.message; render(); }
}
function subscribeDocumentsRealtime(){
  if(!cloudReady() || documentsRealtimeChannel) return;
  documentsRealtimeChannel = supabaseClient.channel("documents-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"documents" }, (payload) => {
      if(payload.eventType === "DELETE"){
        state.documents = state.documents.filter(d=>d.id!==payload.old.id);
      } else {
        const updated = docRowToLocal(payload.new);
        const idx = state.documents.findIndex(d=>d.id===updated.id);
        if(idx>=0) state.documents[idx] = updated; else state.documents.unshift(updated);
      }
      render();
    })
    .subscribe();
}
function unsubscribeDocumentsRealtime(){
  if(documentsRealtimeChannel){ supabaseClient.removeChannel(documentsRealtimeChannel); documentsRealtimeChannel = null; }

/* ---------------- Shared CAPA / findings (Day 2) ----------------
   Findings live nested inside state.audits[].findings[] — that stays
   exactly as-is for every existing render function. This layer just
   keeps a shared `capa_findings` table in sync with whatever's in
   those local arrays, denormalizing the parent audit's title/number
   so CAPA is fully shared even though full Audit Management records
   aren't migrated yet. Photos stay local-only for now (base64 blobs
   don't belong in a constantly-synced table row — that needs proper
   file storage, a separate future piece of work). */
let capaSyncError = "";
let capaRealtimeChannel = null;
const CAPA_CORE_FIELDS = new Set(["id","refNo","clause","clauseRef","category","desc","severity","owner","dueDate","actionText","status","autoGenerated","verifiedBy","verifiedAt","photo"]);

function findingRowToLocal(row){
  return {
    id: row.id, refNo: row.ref_no, clause: row.clause, clauseRef: row.clause_ref,
    category: row.category, desc: row.description, severity: row.severity, owner: row.owner,
    dueDate: row.due_date, actionText: row.action_text, status: row.status,
    autoGenerated: row.auto_generated, verifiedBy: row.verified_by, verifiedAt: row.verified_at,
    ...(row.meta||{})
  };
}
function findingLocalToRow(f, auditId, auditTitle, auditNumber){
  const meta = {};
  Object.keys(f).forEach(k=>{ if(!CAPA_CORE_FIELDS.has(k)) meta[k] = f[k]; });
  return {
    id: f.id, audit_id: auditId, audit_title: auditTitle, audit_number: auditNumber||null,
    ref_no: f.refNo||null, clause: f.clause||null, clause_ref: f.clauseRef||null,
    category: f.category||null, description: f.desc||null, severity: f.severity||null, owner: f.owner||null,
    due_date: f.dueDate||null, action_text: f.actionText||null, status: f.status||"Open",
    auto_generated: !!f.autoGenerated, verified_by: f.verifiedBy||null, verified_at: f.verifiedAt||null,
    meta, updated_at: new Date().toISOString()
  };
}
async function pushAuditFindingsToCloud(a){
  if(!cloudReady() || !a.findings || a.findings.length===0) return;
  const rows = a.findings.map(f => {
    const row = findingLocalToRow(f, a.id, a.title, a.auditNumber);
    row.created_by = currentCloudUser.id;
    return row;
  });
  const { error } = await supabaseClient.from("capa_findings").upsert(rows);
  if(error){ capaSyncError = error.message; render(); }
}
async function deleteFindingFromCloud(id){
  if(!cloudReady()) return;
  const { error } = await supabaseClient.from("capa_findings").delete().eq("id", id);
  if(error){ capaSyncError = error.message; render(); }
}
function mergeCloudFindingsIntoLocalAudits(rows){
  const byAudit = {};
  rows.forEach(r => { (byAudit[r.audit_id] = byAudit[r.audit_id]||[]).push(r); });
  Object.keys(byAudit).forEach(auditId => {
    let a = state.audits.find(x=>x.id===auditId);
    if(!a){
      const sample = byAudit[auditId][0];
      a = seedAudit(sample.audit_title || "Shared CAPA (full audit not loaded)", "", "", [], sample.audit_number, "Internal");
      a.id = auditId; // reuse the shared id so future syncs match correctly
      a.isCloudShellAudit = true;
      a.status = "In Progress";
      state.audits.push(a);
    }
    const cloudFindings = byAudit[auditId].map(findingRowToLocal);
    const cloudIds = new Set(cloudFindings.map(f=>f.id));
    const localOnly = (a.findings||[]).filter(f=>!cloudIds.has(f.id)); // keep anything not yet pushed (e.g. offline edit)
    a.findings = [...cloudFindings, ...localOnly];
  });
}
async function fetchCapaFindingsFromCloud(){
  if(!cloudReady()) return;
  const { data, error } = await supabaseClient.from("capa_findings").select("*");
  if(error){ capaSyncError = error.message; render(); return; }
  mergeCloudFindingsIntoLocalAudits(data||[]);
  capaSyncError = "";
  render();
}
function subscribeCapaRealtime(){
  if(!cloudReady() || capaRealtimeChannel) return;
  capaRealtimeChannel = supabaseClient.channel("capa-findings-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"capa_findings" }, (payload) => {
      if(payload.eventType === "DELETE"){
        state.audits.forEach(a => { a.findings = (a.findings||[]).filter(f=>f.id!==payload.old.id); });
      } else {
        mergeCloudFindingsIntoLocalAudits([payload.new]);
      }
      render();
    })
    .subscribe();
}
function unsubscribeCapaRealtime(){
  if(capaRealtimeChannel){ supabaseClient.removeChannel(capaRealtimeChannel); capaRealtimeChannel = null; }
}

/* ---------------- Shared Risk Management (Day 3) ----------------
   Same pattern as Documents/CAPA: state.riskAssessments stays exactly
   as every render function already expects it. Evidence (photos/PDFs
   as base64) stays local-only, same reasoning as CAPA photos — those
   don't belong in a constantly-synced row and need real file storage
   as a separate future piece of work. */
let riskSyncError = "";
let riskRealtimeChannel = null;
const RISK_CORE_FIELDS = new Set([
  "id","refNo","date","category","area","hazard","riskTo","controls","rootCause",
  "likelihood","severity","riskScore","riskLevel","action","dueDate","reviewDate",
  "completedDate","status","residualLikelihood","residualSeverity","residualRiskScore","residualRiskLevel"
]);
function riskRowToLocal(row){
  return {
    id: row.id, refNo: row.ref_no, date: row.date, category: row.category, area: row.area,
    hazard: row.hazard, riskTo: row.risk_to, controls: row.controls, rootCause: row.root_cause,
    likelihood: row.likelihood, severity: row.severity, riskScore: row.risk_score, riskLevel: row.risk_level,
    action: row.action, dueDate: row.due_date, reviewDate: row.review_date, completedDate: row.completed_date,
    status: row.status, residualLikelihood: row.residual_likelihood, residualSeverity: row.residual_severity,
    residualRiskScore: row.residual_risk_score, residualRiskLevel: row.residual_risk_level,
    evidence: [], // local-only, never synced — see note above
    ...(row.meta||{})
  };
}
function riskLocalToRow(r){
  const meta = {};
  Object.keys(r).forEach(k=>{ if(!RISK_CORE_FIELDS.has(k) && k!=="evidence") meta[k] = r[k]; });
  return {
    id: r.id, ref_no: r.refNo||null, date: r.date||null, category: r.category||null, area: r.area||null,
    hazard: r.hazard||null, risk_to: r.riskTo||null, controls: r.controls||null, root_cause: r.rootCause||null,
    likelihood: r.likelihood||null, severity: r.severity||null, risk_score: r.riskScore||null, risk_level: r.riskLevel||null,
    action: r.action||null, due_date: r.dueDate||null, review_date: r.reviewDate||null, completed_date: r.completedDate||null,
    status: r.status||"Open", residual_likelihood: r.residualLikelihood||null, residual_severity: r.residualSeverity||null,
    residual_risk_score: r.residualRiskScore||null, residual_risk_level: r.residualRiskLevel||null,
    meta, updated_at: new Date().toISOString()
  };
}
async function fetchRiskFromCloud(){
  if(!cloudReady()) return;
  const { data, error } = await supabaseClient.from("risk_assessments").select("*").order("created_at", { ascending:false });
  if(error){ riskSyncError = error.message; render(); return; }
  state.riskAssessments = (data||[]).map(riskRowToLocal);
  riskSyncError = "";
  render();
}
async function pushRiskToCloud(r){
  if(!cloudReady()) return;
  const row = riskLocalToRow(r);
  if(!r.createdByPushed){ row.created_by = currentCloudUser.id; r.createdByPushed = true; }
  const { error } = await supabaseClient.from("risk_assessments").upsert(row);
  if(error){ riskSyncError = error.message; render(); }
}
async function deleteRiskFromCloud(id){
  if(!cloudReady()) return;
  const { error } = await supabaseClient.from("risk_assessments").delete().eq("id", id);
  if(error){ riskSyncError = error.message; render(); }
}
function subscribeRiskRealtime(){
  if(!cloudReady() || riskRealtimeChannel) return;
  riskRealtimeChannel = supabaseClient.channel("risk-assessments-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"risk_assessments" }, (payload) => {
      if(payload.eventType === "DELETE"){
        state.riskAssessments = state.riskAssessments.filter(r=>r.id!==payload.old.id);
      } else {
        const updated = riskRowToLocal(payload.new);
        const idx = state.riskAssessments.findIndex(r=>r.id===updated.id);
        if(idx>=0){ updated.evidence = state.riskAssessments[idx].evidence||[]; state.riskAssessments[idx] = updated; }
        else state.riskAssessments.unshift(updated);
      }
      render();
    })
    .subscribe();
}
function unsubscribeRiskRealtime(){
  if(riskRealtimeChannel){ supabaseClient.removeChannel(riskRealtimeChannel); riskRealtimeChannel = null; }
}
function can(perm){
  const u = currentUser();
  if(!u) return false;
  if(u.status === "Disabled") return false;
  const rp = ROLE_PERMISSIONS[u.role];
  return !!(rp && rp[perm]);
}

function migrateAuditNumbers(){
  if(state.auditSeq === undefined){
    state.auditSeq = 0;
    [...state.audits].reverse().forEach(a=>{
      if(!a.auditNumber){
        state.auditSeq++;
        const year = (a.date && new Date(a.date).getFullYear()) || new Date().getFullYear();
        a.auditNumber = formatAuditNumber(state.auditSeq, year);
      }
    });
    saveStore(state);
  }
  let changed = false;
  state.audits.forEach(a=>{
    if(!a.riskLevel){ a.riskLevel = "Medium"; changed = true; }
    if(!a.history){ a.history = [{ id: uid(), date: new Date().toISOString(), text: "Audit created" }]; changed = true; }
    if(a.auditee === undefined){ a.auditee = ""; changed = true; }
    if(!a.signOff){ a.signOff = { auditorName:"", auditorSignedAt:null, approverName:"", approverSignedAt:null }; changed = true; }
    if(!a.auditPlan){ a.auditPlan = { organization:"", address:"", visitNumber:"", leadAuditor:"", teamMembers:"", standards: a.standard||"", auditLanguage:"English", scope:"", objectives:"", itinerary: [] }; changed = true; }
  });
  if(changed) saveStore(state);
}

function computeAutoMetricValue(autoType){
  const allFindings = state.audits.flatMap(a=>a.findings);
  switch(autoType){
    case "capa_closure_rate":
      if(allFindings.length===0) return null;
      return Math.round((allFindings.filter(f=>f.status==="Closed").length/allFindings.length)*1000)/10;
    case "overdue_capas":
      return allFindings.filter(f=>f.status!=="Closed" && f.dueDate && daysUntil(f.dueDate)<0).length;
    case "avg_audit_compliance": {
      const scores = state.audits.map(scoreOf).filter(s=>s!==null);
      if(scores.length===0) return null;
      return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
    }
    case "audit_findings_closed_count":
      return allFindings.filter(f=>f.status==="Closed").length;
    case "open_high_critical_risks":
      return state.riskAssessments.filter(r=>(r.riskLevel==="High"||r.riskLevel==="Critical") && RISK_NEEDS_ATTENTION_STATUSES.includes(r.status)).length;
    default:

}

function downloadCsv(headers, rows, filename){
  const csvEscape = (v) => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = [headers.map(csvEscape).join(','), ...rows.map(row=>row.map(csvEscape).join(','))].join('\n');
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* Compresses/resizes a photo client-side before storing as base64, to stay well within
   localStorage limits. Caps the LONGEST edge (whichever of width/height is larger) at
   maxDim px and re-encodes as JPEG at `quality`. Fixed: previously only checked width,
   so portrait-shaped photos with width < maxDim could skip compression entirely. */
function compressImageToDataURL(file, maxDim, quality, cb){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { alert("Could not read this image — please try a different photo."); };
    img.src = e.target.result;
  };
  reader.onerror = () => { alert("Could not read this file — please try a different photo."); };
  reader.readAsDataURL(file);
}

    rowTitle:r=>r.product||"Drill",
    rowSub:r=>`${r.date||'—'} · ${r.actualTimeMins??'—'}min · ${r.percentTraced??'—'}% traced`,
    rowTag:r=>({label:r.result||"Pending", tone:r.result==="Pass"?"green":(r.result==="Fail"?"rust":"neutral")}),
    extraStats:(arr)=>{
      if(!arr.length) return '';
      const avgTime = Math.round(arr.reduce((s,e)=>s+(Number(e.actualTimeMins)||0),0)/arr.length);
      const avgTraced = Math.round(arr.reduce((s,e)=>s+(Number(e.percentTraced)||0),0)/arr.length);
      const passRate = Math.round((arr.filter(e=>e.result==="Pass").length/arr.length)*100);
      return `<div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
        ${statCard("⏱","Avg. Trace Time","~"+avgTime+"m")}
        ${statCard("🎯","Avg. % Traced",avgTraced+"%")}
        ${statCard("✅","Drill Pass Rate",passRate+"%")}
      </div>`;
    }
  },

function coverageTone(cov){
  if(cov==="Very High" || cov==="High") return "green";
  if((cov||"").includes("Medium")) return "amber";
  if(cov==="Low") return "rust";
  return "neutral";
}
function moduleChip(name){
  const tabVal = MODULE_TAB_MAP[name];
  if(tabVal) return `<button class="tag tag-navy" data-goto-tab="${tabVal}" style="cursor:pointer;border:none;">${esc(name)}</button>`;
  return `<span class="tag tag-neutral">${esc(name)}</span>`;
}
function renderCalibrationDashboard(){
  const recs = state.calibrationRecords||[];
  const withDue = recs.filter(r=>r.nextDueDate);
  const overdue = withDue.filter(r=>daysUntil(r.nextDueDate)<0);
  const due30 = withDue.filter(r=>{ const d=daysUntil(r.nextDueDate); return d>=0 && d<=30; });
  const due90 = withDue.filter(r=>{ const d=daysUntil(r.nextDueDate); return d>30 && d<=90; });
  const upToDate = withDue.filter(r=>daysUntil(r.nextDueDate)>90);
  const noDueDate = recs.filter(r=>!r.nextDueDate);
  const byLocation = {};
  recs.forEach(r=>{ const loc = r.location||"Unspecified"; byLocation[loc] = (byLocation[loc]||0)+1; });
  const group = (title, list, tone) => `
    <div class="card p4" style="margin-bottom:12px;">
      <h3 class="serif" style="font-size:15px;margin:0 0 10px;">${title} <span class="tag tag-${tone}" style="font-size:11px;">${list.length}</span></h3>
      ${list.length===0 ? `<p class="muted-italic" style="font-size:12px;">None.</p>` : list.map(r=>`
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;">
          <span>${esc(r.equipmentId)} <span class="muted-italic">— ${esc(r.description)||'—'} · ${esc(r.location)||'—'}</span></span>
          <span class="tag tag-${tone}">${r.nextDueDate||'—'}</span>
        </div>
      `).join('')}
    </div>
  `;
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">📊 Calibration / Equipment Dashboard</h2>
      <button class="btn btn-ghost" data-goto-tab="calibration">Open Full Register →</button>
    </div>
    <p class="muted-italic" style="margin-bottom:16px;font-size:13px;">Due-date traffic light view across all calibrated equipment (ISO 13485 §7.6).</p>
    <div class="stats" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
      ${statCard("🔴","Overdue", overdue.length)}
      ${statCard("🟠","Due ≤ 30 days", due30.length)}
      ${statCard("🟡","Due ≤ 90 days", due90.length)}
      ${statCard("🟢","Up to Date", upToDate.length)}
    </div>
    ${group("🔴 Overdue", overdue, "rust")}
    ${group("🟠 Due within 30 days", due30, "amber")}
    ${group("🟡 Due within 90 days", due90, "amber")}
    ${noDueDate.length ? group("⚪ No due date set", noDueDate, "neutral") : ''}
    <div class="card p4">
      <h3 class="serif" style="font-size:15px;margin:0 0 10px;">Equipment by Location</h3>
      ${Object.entries(byLocation).sort((a,b)=>b[1]-a[1]).map(([loc,count])=>`
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;">
          <span>${esc(loc)}</span><span class="tag tag-navy">${count}</span>
        </div>
      `).join('') || `<p class="muted-italic">No equipment logged yet.</p>`}
    </div>
  `;
}
function fsmsChecklistPct(){
  const items = state.fsmsChecklist.items||[];
  if(!items.length) return 0;
  return Math.round((items.filter(i=>i.checked).length/items.length)*100);
}

function renderRecallReports(){

  const byClass = {}; RECALL_CLASSES.forEach(c=>byClass[c]=0); recalls.forEach(r=>{ if(r.riskClass) byClass[r.riskClass]=(byClass[r.riskClass]||0)+1; });
  const byReason = {}; recalls.forEach(r=>{ if(r.reason) byReason[r.reason]=(byReason[r.reason]||0)+1; });
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">

        <h3 class="serif" style="font-size:15px;margin:0 0 10px;">By Reason</h3>

      <div class="card p4">

              <div class="muted-italic" style="font-size:11px;">${esc(r.reason)||'—'} · ${(r.riskClass||'').split(' –')[0]}</div>
            </div>
            <div class="flex-wrap">
              <span style="font-size:12px;color:var(--muted);">${recallCompletionPct(r)}%</span>
              <span class="tag tag-${statusTone[r.status]||'neutral'}">${esc(r.status)}</span>
            </div>
          </div>
        `).join('')}

}

function renderLabTrendAnalysis(){
  const micro = state.labResults.filter(r=>r.testType==="Microbiological");
  const chem = state.labResults.filter(r=>r.testType!=="Microbiological");
  const emp = state.empSwabs;
  const pt = state.proficiencyTests;
  const passRate = arr => arr.length ? Math.round((arr.filter(r=>r.status==="Pass").length/arr.length)*100) : null;
  const sections = [
    { label:"Microbiology", arr:micro, icon:"🧫" },
    { label:"Chemistry / Analytical", arr:chem, icon:"⚗️" },
    { label:"Environmental Monitoring (EMP)", arr:emp, icon:"🧼" },
    { label:"Proficiency Testing", arr:pt, icon:"🧪" }
  ];
  const monthKey = d => (d||"").slice(0,7);
  const allDated = [...micro, ...chem, ...emp].filter(r=>r.date);
  const months = [...new Set(allDated.map(r=>monthKey(r.date)))].sort().slice(-6);
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">📈 Laboratory Trend Analysis</h2>
    </div>
    <div class="stats" style="grid-template-columns:repeat(2,1fr);margin-bottom:16px;">
      ${sections.map(s=>statCard(s.icon, s.label+" Pass Rate", passRate(s.arr)===null?'—':passRate(s.arr)+"%")).join('')}
    </div>
    <div class="card p4" style="margin-bottom:16px;">
      <h3 class="serif" style="font-size:15px;margin:0 0 10px;">Sample Volume — Last 6 Months</h3>
      ${months.length===0 ? `<p class="muted-italic">Not enough dated results yet to show a trend.</p>` : months.map(m=>{
        const count = allDated.filter(r=>monthKey(r.date)===m).length;
        const fails = allDated.filter(r=>monthKey(r.date)===m && r.status==="Fail").length;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;">
          <span>${m}</span>
          <span class="flex-wrap"><span class="tag tag-navy">${count} samples</span>${fails?`<span class="tag tag-rust">${fails} fail</span>`:''}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="card p4">
      <h3 class="serif" style="font-size:15px;margin:0 0 10px;">Failures Needing Attention</h3>
      ${(() => {
        const fails = [...micro, ...chem, ...emp].filter(r=>r.status==="Fail");
        if(!fails.length) return `<p class="muted-italic">No open failures across Micro, Chemistry, or EMP. 🎉</p>`;
        return fails.map(r=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;"><span>${esc(r.labSampleId||r.clientSampleId||r.sampleId||r.swabId||'—')} · ${esc(r.product||r.location||'—')}</span><span class="tag tag-rust">${esc(r.date||'—')}</span></div>`).join('');
      })()}
    </div>
  `;
}

function navNodeActive(node){
  if(node.children) return node.children.some(navNodeActive);
  if(node.isActive) return node.isActive();
  return false;
}
function navFindPath(id, nodes=NAV_TREE, path=[]){
  for(const n of nodes){
    const newPath = [...path, n];
    if(n.id===id) return newPath;
    if(n.children){ const r = navFindPath(id, n.children, newPath); if(r) return r; }
  }
  return null;
}
function navFirstLeafAction(node){
  if(node.action){ node.action(); return; }
  if(node.children && node.children.length) navFirstLeafAction(node.children[0]);
}
function navHandleClick(id){
  const path = navFindPath(id);
  if(!path) return;
  const node = path[path.length-1];
  if(node.children){
    const depth = path.length;
    if(depth===1){
      navGroupOpen = navGroupOpen===node.id ? null : node.id;
      navSubGroupOpen = null;
    } else {
      navSubGroupOpen = navSubGroupOpen===node.id ? null : node.id;
    }
  } else {
    node.action();
    navGroupOpen = path.length>=2 ? path[0].id : null;
    navSubGroupOpen = path.length>=3 ? path[1].id : null;
    navMenuOpen = false;
  }
}
function navRowHtml(node, depth){
  const active = navNodeActive(node);
  const icon = node.icon ? node.icon+" " : "";
  const hasChildren = !!node.children;
  const isOpen = depth===0 ? navGroupOpen===node.id : navSubGroupOpen===node.id;
  const pad = 14 + depth*18;
  return `
    <button data-navid="${node.id}" class="${active?'active':''}" style="display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:10px 14px 10px ${pad}px;background:none;border:none;border-bottom:1px solid var(--line2);font-size:${depth===0?'14px':'13px'};color:inherit;">
      <span>${icon}${esc(node.label)}</span>
      ${hasChildren ? `<span style="color:var(--muted);font-size:11px;">${isOpen?'▲':'▼'}</span>` : ''}
    </button>
    ${hasChildren && isOpen ? node.children.map(c=>navRowHtml(c, depth+1)).join('') : ''}
  `;
}
function activeBreadcrumb(){
  for(const g of NAV_TREE){
    if(!g.children){ if(navNodeActive(g)) return g.label; continue; }
    for(const c of g.children){
      if(c.children){
        for(const gc of c.children){ if(navNodeActive(gc)) return `${g.label} › ${c.label} › ${gc.label}`; }
      }
      if(navNodeActive(c)) return `${g.label} › ${c.label}`;
    }
    if(navNodeActive(g)) return g.label;
  }
  return "Dashboard";
}

function attachLoginHandlers(){
  const byId = id => document.getElementById(id);
  const setMode = (m) => { loginMode = m; loginError = ""; cloudStatus = ""; render(); };
  const doLogin = document.querySelector('[data-action="do-login"]');
  if(doLogin) doLogin.onclick = () => {
    const email = (byId('login-email').value||"").trim().toLowerCase();
    const pw = byId('login-password').value||"";
    if(!email || !pw){ loginError = "Email and password are required."; render(); return; }
    loginError = "";
    if(cloudReady()){
      cloudSignIn(email, pw);
      return;
    }
    // Local fallback (no Supabase configured)
    const u = (state.users||[]).find(x=>x.email.toLowerCase()===email);
    if(!u){ loginError = "No account found with that email."; render(); return; }
    if(u.status==="Disabled"){ loginError = "This account is disabled. Contact your Administrator."; render(); return; }
    if(u.password !== pw){ loginError = "Incorrect password."; render(); return; }
    u.lastLogin = new Date().toISOString();
    state.currentUserId = u.id;
    persist();
    logActivity(`${u.fullName} logged in`);
    persist();
    render();
  };
  const showRegister = document.querySelector('[data-action="show-register"]');
  if(showRegister) showRegister.onclick = () => setMode("register");
  const showReset = document.querySelector('[data-action="show-reset"]');
  if(showReset) showReset.onclick = () => setMode("reset");
  const showLogin = document.querySelectorAll('[data-action="show-login"]');
  showLogin.forEach(el=>el.onclick = () => setMode("login"));
  const doRegister = document.querySelector('[data-action="do-register"]');
  if(doRegister) doRegister.onclick = () => {
    const name = (byId('reg-name').value||"").trim();
    const email = (byId('reg-email').value||"").trim().toLowerCase();
    const pw = byId('reg-password').value||"";
    const pw2 = byId('reg-password2').value||"";
    if(!name || !email || !pw){ loginError = "Full name, email and password are required."; render(); return; }
    if(pw !== pw2){ loginError = "Passwords do not match."; render(); return; }
    loginError = "";
    if(cloudReady()){
      cloudSignUp(email, pw, name).then(()=>{ loginMode = "login"; render(); });
      return;
    }
    // Local fallback
    const empId = (byId('reg-empid')?.value||"").trim();
    const dept = (byId('reg-dept')?.value||"").trim();
    const title = (byId('reg-title')?.value||"").trim();
    if((state.users||[]).some(u=>u.email.toLowerCase()===email)){ loginError = "An account with that email already exists."; render(); return; }
    state.users.push({
      id: uid(), fullName:name, email, employeeId:empId, department:dept, jobTitle:title,
      role:"Employee", status:"Disabled", password:pw, lastLogin:"", createdDate: today()
    });
    logActivity(`New account registered: ${name} (${email}) — pending Administrator activation`);
    persist();
    loginMode = "login";
    render();
    setTimeout(()=>{ alert("Account created. An Administrator must activate your account before you can log in."); }, 50);
  };
  const doReset = document.querySelector('[data-action="do-reset"]');
  if(doReset) doReset.onclick = () => {
    const email = (byId('reset-email').value||"").trim().toLowerCase();
    if(!email){ loginError = "Enter your email first."; render(); return; }
    loginError = "";
    if(cloudReady()){
      cloudResetPassword(email);
      return;
    }
    // Local fallback
    const empId = (byId('reset-empid').value||"").trim();
    const pw = byId('reset-password').value||"";
    const pw2 = byId('reset-password2').value||"";
    const u = (state.users||[]).find(x=>x.email.toLowerCase()===email && x.employeeId===empId);
    if(!u){ loginError = "No account matches that email and Employee ID."; render(); return; }
    if(!pw || pw !== pw2){ loginError = "Passwords must match and cannot be blank."; render(); return; }
    u.password = pw;
    logActivity(`Password reset for ${u.fullName}`);
    persist();
    loginMode = "login";
    render();
    setTimeout(()=>{ alert("Password updated. Please sign in."); }, 50);
  };
}
