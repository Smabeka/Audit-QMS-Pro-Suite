  :root{
    --bg:#f7f5ee; --paper:#ffffff; --line:#e2dbc9; --line2:#eee7d5; --ink:#2a2620;
    --muted:#8a8168; --navy:#1c2b4a; --navyBg:#e4e9f2; --rust:#9b3f28; --rustBg:#f6e4dd;

  .brand p{font-size:11px;color:var(--muted);margin:2px 0 0;text-transform:uppercase;letter-spacing:.12em;}

  .btn-primary:hover{background:#16223b;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:#4a4535;}
  .btn-ghost:hover{background:#efe9dc;}
  .btn-danger{background:transparent;border:1px solid #e8c3b5;color:var(--rust);}
  .btn-danger:hover{background:var(--rustBg);}

  .tag-green{background:var(--greenBg);color:var(--green);border-color:#c7dab8;}

  .tag-amber{background:var(--amberBg);color:var(--amber);border-color:#efd6a0;}

<script>
/* ---------- storage ---------- */
const STORE_KEY = "audit-qms-standalone-v1";

/* ---------- workspaces (multi-client support) ----------
   Each client/company gets its own isolated dataset under its own localStorage key
   (STORE_KEY + "::" + workspaceId). A small registry ("aqms-workspaces") tracks the
   list of workspaces, and "aqms-current-workspace" tracks which one is active.
   loadStore/saveStore always read/write whichever workspace is currently active. */
const WORKSPACES_KEY = "aqms-workspaces";
const CURRENT_WORKSPACE_KEY = "aqms-current-workspace";
function workspaceStoreKey(id){ return STORE_KEY + "::" + id; }
function getWorkspaces(){ try{ const r = localStorage.getItem(WORKSPACES_KEY); return r ? JSON.parse(r) : []; }catch(e){ return []; } }
function saveWorkspaces(list){ try{ localStorage.setItem(WORKSPACES_KEY, JSON.stringify(list)); return true; }catch(e){ console.error(e); return false; } }

let currentWorkspaceId = null;
/* Runs once at startup. Migrates a pre-workspace install (single dataset under STORE_KEY)
   into a first workspace, or creates a fresh one if this is a brand new install. */
function initWorkspaces(){
  let workspaces = getWorkspaces();
  if(workspaces.length === 0){
    const legacyRaw = localStorage.getItem(STORE_KEY);
    const id = uid();
    let name = "My Company";
    if(legacyRaw){
      try{ const legacy = JSON.parse(legacyRaw); if(legacy && legacy.companySettings && legacy.companySettings.name) name = legacy.companySettings.name; }catch(e){}
      localStorage.setItem(workspaceStoreKey(id), legacyRaw);
      localStorage.removeItem(STORE_KEY);
    }
    workspaces = [{id, name}];
    saveWorkspaces(workspaces);
    localStorage.setItem(CURRENT_WORKSPACE_KEY, id);
    currentWorkspaceId = id;
  } else {
    currentWorkspaceId = localStorage.getItem(CURRENT_WORKSPACE_KEY);
    if(!currentWorkspaceId || !workspaces.find(w=>w.id===currentWorkspaceId)){
      currentWorkspaceId = workspaces[0].id;
      localStorage.setItem(CURRENT_WORKSPACE_KEY, currentWorkspaceId);
    }
  }
}
function currentWorkspaceName(){
  const w = getWorkspaces().find(w=>w.id===currentWorkspaceId);
  return w ? w.name : "My Company";
}
function switchWorkspace(id){
  if(id === currentWorkspaceId) return;
  saveStore(state); // flush current workspace before leaving it
  currentWorkspaceId = id;
  localStorage.setItem(CURRENT_WORKSPACE_KEY, id);
  state = loadStore() || { audits: [], auditSeq: 0 };
  migrateAuditNumbers();
  ensureStateDefaults();
  showWorkspaceModal = false;
  newWorkspaceName = "";
  render();
}
function createWorkspace(name){
  const trimmed = (name||"").trim();
  if(!trimmed) return;
  const id = uid();
  const list = getWorkspaces();
  list.push({id, name: trimmed});
  saveWorkspaces(list);
  saveStore(state); // flush current workspace first
  currentWorkspaceId = id;
  localStorage.setItem(CURRENT_WORKSPACE_KEY, id);
  state = { audits: [], auditSeq: 0 }; // new client starts empty, not the demo dataset
  saveStore(state);
  migrateAuditNumbers();
  ensureStateDefaults();
  showWorkspaceModal = false;
  newWorkspaceName = "";
  render();
}
function createDemoWorkspace(){
  const id = uid();
  const list = getWorkspaces();
  const existingDemoCount = list.filter(w=>/^Demo/.test(w.name)).length;
  const name = existingDemoCount ? `Demo (${existingDemoCount+1})` : "Demo";
  list.push({id, name});
  saveWorkspaces(list);
  saveStore(state); // flush current workspace first
  currentWorkspaceId = id;
  localStorage.setItem(CURRENT_WORKSPACE_KEY, id);
  state = seedDemoWorkspaceData();
  saveStore(state);
  migrateAuditNumbers();
  ensureStateDefaults();
  showWorkspaceModal = false;
  newWorkspaceName = "";
  render();
}
function renameWorkspace(id, name){
  const trimmed = (name||"").trim();
  if(!trimmed) return;
  const list = getWorkspaces();
  const w = list.find(w=>w.id===id);
  if(w){ w.name = trimmed; saveWorkspaces(list); render(); }
}
function deleteWorkspace(id){
  const list = getWorkspaces();
  if(list.length <= 1) return; // never delete the last remaining workspace
  const remaining = list.filter(w=>w.id!==id);
  saveWorkspaces(remaining);
  localStorage.removeItem(workspaceStoreKey(id));
  if(id === currentWorkspaceId){
    currentWorkspaceId = remaining[0].id;
    localStorage.setItem(CURRENT_WORKSPACE_KEY, currentWorkspaceId);
    state = loadStore() || { audits: [], auditSeq: 0 };
    migrateAuditNumbers();
    ensureStateDefaults();
  }
  pendingDeleteWorkspaceId = null;
  render();
}

function loadStore(){ try{ const r = localStorage.getItem(workspaceStoreKey(currentWorkspaceId)); return r? JSON.parse(r): null; }catch(e){ return null; } }
function saveStore(d){ try{ localStorage.setItem(workspaceStoreKey(currentWorkspaceId), JSON.stringify(d)); return true; }catch(e){ console.error(e); return false; } }

/* ---------- Cloud Backup (Phase 1: Supabase) ----------
   This is a manual push/pull backup, not live multi-user sync — that's a later phase.
   To enable: create a free project at supabase.com, run the SQL setup (see project notes),
   then fill in SUPABASE_URL and SUPABASE_ANON_KEY below. Until those are filled in,
   the Cloud Account feature is simply hidden and the app behaves exactly as before. */
const SUPABASE_URL = "https://panpkvjfyjichfioriqr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ArasDdZ0EsWKnq3WM9HhkA_nN7eRHFE";
const CLOUD_ENABLED = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;

let supabaseClient = null;
if(CLOUD_ENABLED && window.supabase){
  try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch(e){ console.error("Supabase init failed:", e); }
}

let currentCloudUser = null;   // { id, email } once signed in, else null
let showCloudModal = false;
let cloudAuthMode = "signin";  // "signin" | "signup"
let cloudStatus = "";          // short status/result message shown in the Cloud modal
let cloudBusy = false;

async function initCloudSession(){
  if(!supabaseClient) return;
  try{
    const { data } = await supabaseClient.auth.getSession();
    if(data && data.session){ currentCloudUser = data.session.user; render(); }
  }catch(e){ console.error(e); }
}
async function cloudSignUp(email, password){
  if(!supabaseClient) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  cloudBusy = false;
  if(error){ cloudStatus = "⚠ " + error.message; }
  else { cloudStatus = "✓ Account created. Check your email to confirm, then sign in."; }
  render();
}
async function cloudSignIn(email, password){
  if(!supabaseClient) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  cloudBusy = false;
  if(error){ cloudStatus = "⚠ " + error.message; }
  else { currentCloudUser = data.user; cloudStatus = ""; }
  render();
}
async function cloudSignOut(){
  if(!supabaseClient) return;
  await supabaseClient.auth.signOut();
  currentCloudUser = null;
  render();
}
/* Pushes the CURRENT workspace's data to the cloud, one row per (user, workspace).
   This overwrites whatever was previously backed up for this workspace. */
async function cloudBackupNow(){
  if(!supabaseClient || !currentCloudUser) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { error } = await supabaseClient.from("workspace_backups").upsert({
    user_id: currentCloudUser.id,
    workspace_id: currentWorkspaceId,
    workspace_name: currentWorkspaceName(),
    data: state,
    updated_at: new Date().toISOString()
  }, { onConflict: "user_id,workspace_id" });
  cloudBusy = false;
  cloudStatus = error ? ("⚠ Backup failed: " + error.message) : "✓ Backed up to cloud just now.";
  render();
}
/* Pulls the cloud copy of the CURRENT workspace and replaces local data with it.
   Destructive to local changes, so the UI confirms before calling this. */
async function cloudRestoreNow(){
  if(!supabaseClient || !currentCloudUser) return;
  cloudBusy = true; cloudStatus = ""; render();
  const { data, error } = await supabaseClient.from("workspace_backups")
    .select("data, updated_at")
    .eq("user_id", currentCloudUser.id)
    .eq("workspace_id", currentWorkspaceId)
    .maybeSingle();
  cloudBusy = false;
  if(error){ cloudStatus = "⚠ Restore failed: " + error.message; render(); return; }
  if(!data){ cloudStatus = "No cloud backup found for this workspace yet."; render(); return; }
  state = data.data;
  ensureStateDefaults();
  persist();
  cloudStatus = "✓ Restored from cloud (backed up " + new Date(data.updated_at).toLocaleString() + ").";
  render();
}
/* Lists which of the device's local workspaces also have a cloud backup, and when. */
async function cloudListBackups(){
  if(!supabaseClient || !currentCloudUser) return [];
  const { data, error } = await supabaseClient.from("workspace_backups")
    .select("workspace_id, workspace_name, updated_at")
    .eq("user_id", currentCloudUser.id);
  if(error){ console.error(error); return []; }
  return data || [];
}

const PRO_CODE = "AQMS-PRO-2026";

const PRO_GATE_ENABLED = false;

const uid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().slice(0,10);
const daysUntil = (d) => Math.ceil((new Date(d) - new Date(today())) / 86400000);

function migrateAuditNumbers(){
  if(state.auditSeq === undefined){
    state.auditSeq = 0;
    [...state.audits].reverse().forEach(a=>{
      if(!a.auditNumber){
        state.auditSeq++;
        const year = (a.date && new Date(a.date).getFullYear()) || new Date().getFullYear();
        a.auditNumber = formatAuditNumber(state.auditSeq, year);
      }
    });
    saveStore(state);
  }
  let changed = false;
  state.audits.forEach(a=>{
    if(!a.riskLevel){ a.riskLevel = "Medium"; changed = true; }
    if(!a.history){ a.history = [{ id: uid(), date: new Date().toISOString(), text: "Audit created" }]; changed = true; }
    if(a.auditee === undefined){ a.auditee = ""; changed = true; }
    if(!a.signOff){ a.signOff = { auditorName:"", auditorSignedAt:null, approverName:"", approverSignedAt:null }; changed = true; }
    if(!a.auditPlan){ a.auditPlan = { organization:"", address:"", visitNumber:"", leadAuditor:"", teamMembers:"", standards: a.standard||"", auditLanguage:"English", scope:"", objectives:"", itinerary: [] }; changed = true; }
  });
  if(changed) saveStore(state);
}

function seedSampleMetrics(){
  const existingNames = new Set(state.metrics.map(m=>m.name));
  let added = 0;
  SAMPLE_KPI_METRICS.forEach(sm=>{
    if(existingNames.has(sm.name)) return;
    state.metrics.push({
      id: uid(), name: sm.name, category: sm.category, unit: sm.unit, target: sm.target,
      direction: sm.direction, critical: sm.critical, source: "manual", autoType: null,
      history: [{ id: uid(), date: today(), value: sm.value }]

function computeAutoMetricValue(autoType){
  const allFindings = state.audits.flatMap(a=>a.findings);
  switch(autoType){
    case "capa_closure_rate":
      if(allFindings.length===0) return null;
      return Math.round((allFindings.filter(f=>f.status==="Closed").length/allFindings.length)*1000)/10;
    case "overdue_capas":
      return allFindings.filter(f=>f.status!=="Closed" && f.dueDate && daysUntil(f.dueDate)<0).length;
    case "avg_audit_compliance": {
      const scores = state.audits.map(scoreOf).filter(s=>s!==null);
      if(scores.length===0) return null;
      return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
    }
    case "audit_findings_closed_count":
      return allFindings.filter(f=>f.status==="Closed").length;
    case "open_high_critical_risks":
      return state.riskAssessments.filter(r=>(r.riskLevel==="High"||r.riskLevel==="Critical") && r.status!=="Closed").length;
    default:
      return null;
  }
}

function downloadCsv(headers, rows, filename){
  const csvEscape = (v) => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = [headers.map(csvEscape).join(','), ...rows.map(row=>row.map(csvEscape).join(','))].join('\n');
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* Compresses/resizes a photo client-side before storing as base64, to stay well within
   localStorage limits. Caps the LONGEST edge (whichever of width/height is larger) at
   maxDim px and re-encodes as JPEG at `quality`. Fixed: previously only checked width,
   so portrait-shaped photos with width < maxDim could skip compression entirely. */
function compressImageToDataURL(file, maxDim, quality, cb){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { alert("Could not read this image — please try a different photo."); };
    img.src = e.target.result;
  };
  reader.onerror = () => { alert("Could not read this file — please try a different photo."); };
  reader.readAsDataURL(file);
}

function renderTraceLotHistory(){
  const q = lotHistorySearch.trim().toLowerCase();
  const rows = [...state.batches].filter(b=>{
    if(!q) return true;
    return [b.product,b.batchNo,b.supplier].some(v=>(v||'').toLowerCase().includes(q));
  }).sort((a,b)=>String(b.received||'').localeCompare(String(a.received||'')));
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">🕓 Lot History</h2>
      <button class="btn btn-ghost" data-action="export-lot-history-csv">⬇ CSV</button>
    </div>
    <p class="muted-italic" style="font-size:12px;margin:-10px 0 14px;">A chronological view of every batch/lot across your traceability register, most recent first.</p>
    <div class="card p4" style="margin-bottom:16px;">
      <input id="lot-history-search" placeholder="Search product, batch/lot no, supplier…" value="${esc(lotHistorySearch)}" />
    </div>
    <div>
      ${rows.length===0 ? `<p class="muted-italic">No batches logged yet.</p>` : rows.map(b=>{
        const expiryFlag = batchExpiryStatus(b);
        const fwd = batchForwardTrace(b).length;
        const back = batchBackwardTrace(b).length;
        return `
          <button class="audit-row" data-jump-batch="${b.id}" style="border-radius:8px;margin-bottom:8px;background:#fff;border:1px solid var(--line2);width:100%;">
            <div style="min-width:0;">
              <div class="audit-title">${esc(b.product)} <span style="color:var(--muted);font-weight:400;font-size:11px;">#${esc(b.batchNo)}</span></div>
              <div class="audit-sub">${esc(b.type)} · Received ${b.received||'—'}${b.expiry?` · Expires ${b.expiry}`:''}${fwd?` · ${fwd} downstream`:''}${back?` · ${back} upstream`:''}</div>
            </div>
            <div class="flex-wrap">
              ${expiryFlag ? `<span class="tag tag-${expiryFlag==='Expired'?'rust':'amber'}">${expiryFlag}</span>` : ''}
              <span class="tag tag-${statusTone[b.status]||'neutral'}">${esc(b.status)}</span>
            </div>
          </button>
        `;
      }).join('')}
    </div>
  `;
}

function renderRecallReports(){
  const recalls = state.productRecalls;
  const total = recalls.length;
  const avgCompletion = total ? Math.round(recalls.reduce((s,r)=>s+recallCompletionPct(r),0)/total) : null;
  const byClass = {}; RECALL_CLASSES.forEach(c=>byClass[c]=0); recalls.forEach(r=>{ if(r.riskClass) byClass[r.riskClass]=(byClass[r.riskClass]||0)+1; });
  const byReason = {}; recalls.forEach(r=>{ if(r.reason) byReason[r.reason]=(byReason[r.reason]||0)+1; });
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">🧾 Recall Reports</h2>
      <button class="btn btn-ghost" data-action="export-recalls-csv">⬇ CSV</button>
    </div>
    ${total===0 ? `<p class="muted-italic">No recalls logged yet — reports will populate once you log a Product Recall.</p>` : `
      <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
        ${statCard("🚨","Total Recalls",total)}
        ${statCard("📊","Avg. Completion",avgCompletion+"%")}
        ${statCard("⏳","Open Recalls", recalls.filter(r=>r.status!=="Closed").length)}
      </div>
      <div class="card p4" style="margin-bottom:16px;">
        <h3 class="serif" style="font-size:15px;margin:0 0 10px;">By Risk Classification</h3>
        ${RECALL_CLASSES.map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;"><span>${esc(c)}</span><span class="tag tag-${recallClassTone[c]}">${byClass[c]||0}</span></div>`).join('')}
      </div>

function renderLabTrendAnalysis(){
  const micro = state.labResults.filter(r=>r.testType==="Microbiological");
  const chem = state.labResults.filter(r=>r.testType!=="Microbiological");
  const emp = state.empSwabs;
  const pt = state.proficiencyTests;
  const passRate = arr => arr.length ? Math.round((arr.filter(r=>r.status==="Pass").length/arr.length)*100) : null;
  const sections = [
    { label:"Microbiology", arr:micro, icon:"🧫" },
    { label:"Chemistry / Analytical", arr:chem, icon:"⚗️" },
    { label:"Environmental Monitoring (EMP)", arr:emp, icon:"🧼" },
    { label:"Proficiency Testing", arr:pt, icon:"🧪" }
  ];
  const monthKey = d => (d||"").slice(0,7);
  const allDated = [...micro, ...chem, ...emp].filter(r=>r.date);
  const months = [...new Set(allDated.map(r=>monthKey(r.date)))].sort().slice(-6);
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">📈 Laboratory Trend Analysis</h2>
    </div>
    <div class="stats" style="grid-template-columns:repeat(2,1fr);margin-bottom:16px;">
      ${sections.map(s=>statCard(s.icon, s.label+" Pass Rate", passRate(s.arr)===null?'—':passRate(s.arr)+"%")).join('')}
    </div>
    <div class="card p4" style="margin-bottom:16px;">
      <h3 class="serif" style="font-size:15px;margin:0 0 10px;">Sample Volume — Last 6 Months</h3>
      ${months.length===0 ? `<p class="muted-italic">Not enough dated results yet to show a trend.</p>` : months.map(m=>{
        const count = allDated.filter(r=>monthKey(r.date)===m).length;
        const fails = allDated.filter(r=>monthKey(r.date)===m && r.status==="Fail").length;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;">
          <span>${m}</span>
          <span class="flex-wrap"><span class="tag tag-navy">${count} samples</span>${fails?`<span class="tag tag-rust">${fails} fail</span>`:''}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="card p4">
      <h3 class="serif" style="font-size:15px;margin:0 0 10px;">Failures Needing Attention</h3>
      ${(() => {
        const fails = [...micro, ...chem, ...emp].filter(r=>r.status==="Fail");
        if(!fails.length) return `<p class="muted-italic">No open failures across Micro, Chemistry, or EMP. 🎉</p>`;
        return fails.map(r=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;"><span>${esc(r.labSampleId||r.clientSampleId||r.sampleId||r.swabId||'—')} · ${esc(r.product||r.location||'—')}</span><span class="tag tag-rust">${esc(r.date||'—')}</span></div>`).join('');
      })()}
    </div>
  `;
}

function navNodeActive(node){
  if(node.children) return node.children.some(navNodeActive);
  if(node.isActive) return node.isActive();
  return false;
}
function navFindPath(id, nodes=NAV_TREE, path=[]){
  for(const n of nodes){
    const newPath = [...path, n];
    if(n.id===id) return newPath;
    if(n.children){ const r = navFindPath(id, n.children, newPath); if(r) return r; }
  }
  return null;
}
function navFirstLeafAction(node){
  if(node.action){ node.action(); return; }
  if(node.children && node.children.length) navFirstLeafAction(node.children[0]);
}
function navHandleClick(id){
  const path = navFindPath(id);
  if(!path) return;
  const node = path[path.length-1];
  if(node.children){
    const depth = path.length;
    if(depth===1){
      navGroupOpen = navGroupOpen===node.id ? null : node.id;
      navSubGroupOpen = null;
    } else {
      navSubGroupOpen = navSubGroupOpen===node.id ? null : node.id;
    }
  } else {
    node.action();
    navGroupOpen = path.length>=2 ? path[0].id : null;
    navSubGroupOpen = path.length>=3 ? path[1].id : null;
    navMenuOpen = false;
  }
}
function navRowHtml(node, depth){
  const active = navNodeActive(node);
  const icon = node.icon ? node.icon+" " : "";
  const hasChildren = !!node.children;
  const isOpen = depth===0 ? navGroupOpen===node.id : navSubGroupOpen===node.id;
  const pad = 14 + depth*18;
  return `
    <button data-navid="${node.id}" class="${active?'active':''}" style="display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:10px 14px 10px ${pad}px;background:none;border:none;border-bottom:1px solid var(--line2);font-size:${depth===0?'14px':'13px'};color:inherit;">
      <span>${icon}${esc(node.label)}</span>
      ${hasChildren ? `<span style="color:var(--muted);font-size:11px;">${isOpen?'▲':'▼'}</span>` : ''}
    </button>
    ${hasChildren && isOpen ? node.children.map(c=>navRowHtml(c, depth+1)).join('') : ''}
  `;
}
function activeBreadcrumb(){
  for(const g of NAV_TREE){
    if(!g.children){ if(navNodeActive(g)) return g.label; continue; }
    for(const c of g.children){
      if(c.children){
        for(const gc of c.children){ if(navNodeActive(gc)) return `${g.label} › ${c.label} › ${gc.label}`; }
      }
      if(navNodeActive(c)) return `${g.label} › ${c.label}`;
    }
    if(navNodeActive(g)) return g.label;
  }
  return "Dashboard";
}

  let html = `<div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
    <button data-action="toggle-nav-menu" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:none;border:none;color:inherit;padding:6px 0;">
      <span style="font-size:16px;">${navMenuOpen?'✕':'☰'}</span> Platform Modules

      ${NAV_TREE.map(n=>navRowHtml(n, 0)).join('')}
    </div>`;
  }
  return html;
}

function navBtn(key,label){

let scoreCache = new Map();
function scoreOf(audit){
  if(scoreCache.has(audit.id)) return scoreCache.get(audit.id);
  const items = audit.sections.flatMap(s=>s.items).filter(i=>i.result==="Pass"||i.result==="Fail");
  const score = items.length===0 ? null : Math.round((items.filter(i=>i.result==="Pass").length/items.length)*100);
  scoreCache.set(audit.id, score);
  return score;
}

function complianceGrade(score){
  if(score===null) return {label:"No Data", tone:"neutral"};
  if(score>=90) return {label:"Excellent", tone:"green"};
  if(score>=80) return {label:"Good", tone:"navy"};
  if(score>=60) return {label:"Needs Attention", tone:"amber"};
  return {label:"Critical", tone:"rust"};
}

const GRADE_EMOJI = {green:"🟢", amber:"🟡", rust:"🔴", navy:"🔵", neutral:"⚪"};

function recordComplianceSnapshot(overallScore, metricsObj){
  if(overallScore===null && !metricsObj) return;
  const month = today().slice(0,7);
  let existing = state.complianceScoreHistory.find(h=>h.month===month);
  if(!existing){ existing = {month, score:null, metrics:{}}; state.complianceScoreHistory.push(existing); }
  if(overallScore!==null) existing.score = overallScore;
  if(metricsObj){ existing.metrics = existing.metrics || {}; Object.assign(existing.metrics, metricsObj); }
  saveStore(state);
}
function complianceTrend(){
  const sorted = [...state.complianceScoreHistory].sort((a,b)=>a.month.localeCompare(b.month));
  if(sorted.length<2) return null;
  const thisMonth = today().slice(0,7);
  const priorEntries = sorted.filter(h=>h.month!==thisMonth && h.score!=null);
  if(priorEntries.length===0) return null;
  const prev = priorEntries[priorEntries.length-1];
  const curr = sorted[sorted.length-1];
  if(curr.score==null) return null;
  return Math.round((curr.score - prev.score)*10)/10;
}
function metricTrend(key, currentValue){
  if(currentValue===null) return null;
  const sorted = [...state.complianceScoreHistory].sort((a,b)=>a.month.localeCompare(b.month));
  const thisMonth = today().slice(0,7);
  const priorEntries = sorted.filter(h=>h.month!==thisMonth && h.metrics && h.metrics[key]!=null);
  if(priorEntries.length===0) return null;
  const prev = priorEntries[priorEntries.length-1];
  return Math.round((currentValue - prev.metrics[key])*10)/10;
}

function renderDashboard(){
  const audits = state.audits;
  const allFindings = audits.flatMap(a=>a.findings.map(f=>({...f, auditTitle:a.title, auditId:a.id})));
  const openFindings = allFindings.filter(f=>f.status!=="Closed");
  const overdue = openFindings.filter(f=>f.dueDate && daysUntil(f.dueDate)<0);
  const critical = openFindings.filter(f=>f.severity==="Critical"||f.severity==="Major");
  const scored = audits.map(scoreOf).filter(s=>s!==null);
  const avgScore = scored.length ? Math.round(scored.reduce((a,b)=>a+b,0)/scored.length) : null;
  const highRisks = state.riskAssessments.filter(r=>(r.riskLevel==="High"||r.riskLevel==="Critical") && r.status!=="Closed");

  /* Overall Compliance Score — built from every module that exists in this app today. */
  const capaScore = computeAutoMetricValue("capa_closure_rate");
  const totalRisks = state.riskAssessments.length;
  const riskScore = totalRisks>0 ? Math.round(((totalRisks-highRisks.length)/totalRisks)*1000)/10 : null;
  const metricsWithData = state.metrics.map(m=>({m,value:metricCurrentValue(m)})).filter(x=>x.value!==null);
  const onTargetMetrics = metricsWithData.filter(x=>metricStatus(x.m,x.value)==="On Target").length;
  const metricsScore = metricsWithData.length>0 ? Math.round((onTargetMetrics/metricsWithData.length)*1000)/10 : null;
  const totalDocs = state.documents.length;
  const docsInGoodStanding = state.documents.filter(d=>d.status==="Approved" && documentReviewStatus(d)!=="Overdue").length;
  const documentScore = totalDocs>0 ? Math.round((docsInGoodStanding/totalDocs)*1000)/10 : null;
  const totalTraining = state.trainingRecords.length;
  const trainingInGoodStanding = state.trainingRecords.filter(t=>{ const s=trainingStatus(t); return s==="Valid"||s==="No Expiry"; }).length;
  const trainingScore = totalTraining>0 ? Math.round((trainingInGoodStanding/totalTraining)*1000)/10 : null;
  const activeHaccp = state.haccpPoints.filter(p=>p.status!=="Inactive");
  const haccpScore = activeHaccp.length>0 ? Math.round((activeHaccp.filter(p=>haccpStatus(p)==="Compliant").length/activeHaccp.length)*1000)/10 : null;
  const totalRecalls = state.productRecalls.length;
  const recallScore = totalRecalls>0 ? Math.round((state.productRecalls.reduce((sum,r)=>sum+recallCompletionPct(r),0)/totalRecalls)*10)/10 : null;
  const totalSuppliers = state.suppliers.length;
  const supplierScore = totalSuppliers>0 ? Math.round((state.suppliers.filter(s=>s.approvalStatus==="Approved").length/totalSuppliers)*1000)/10 : null;
  const totalAllergenIncidents = state.allergenIncidents.length;
  const allergenScore = totalAllergenIncidents>0 ? Math.round((state.allergenIncidents.filter(i=>i.capaStatus==="Closed").length/totalAllergenIncidents)*1000)/10 : null;
  const activeCip = state.cipSchedules.filter(c=>c.status!=="Inactive");
  const cipScore = activeCip.length>0 ? Math.round((activeCip.filter(c=>cipStatus(c)!=="Overdue").length/activeCip.length)*1000)/10 : null;
  const totalSensory = state.sensoryEvaluations.length;
  const sensoryScore = totalSensory>0 ? Math.round((state.sensoryEvaluations.filter(e=>sensoryResult(e)==="Pass").length/totalSensory)*1000)/10 : null;
  const foodSafetyComponents = [haccpScore, cipScore, allergenScore].filter(s=>s!==null);
  const foodSafetyScore = foodSafetyComponents.length ? Math.round((foodSafetyComponents.reduce((a,b)=>a+b,0)/foodSafetyComponents.length)*10)/10 : null;
  const labTests = [
    ...state.labResults.filter(r=>r.status),
    ...state.empSwabs.filter(r=>r.status),
    ...state.proficiencyTests.filter(r=>r.status)
  ];
  const labScore = labTests.length ? Math.round((labTests.filter(r=>r.status==="Pass").length/labTests.length)*1000)/10 : null;

  /* Management summary counts */
  const openAudits = audits.filter(a=>a.status!=="Closed").length;
  const pendingDocuments = state.documents.filter(d=>d.status==="Draft"||d.status==="Under Review").length;
  const approvedSuppliers = state.suppliers.filter(s=>s.approvalStatus==="Approved").length;
  const employeeNames = new Set();
  state.trainingRecords.forEach(r=>{ if(r.employeeName) employeeNames.add(r.employeeName.trim().toLowerCase()); });
  [...state.competencyRecords, ...state.medicalSurveillanceRecords, ...state.medicalCertRecords, ...state.foodHandlerDeclarations, ...state.ppeIssueLogs].forEach(r=>{ if(r.employee) employeeNames.add(r.employee.trim().toLowerCase()); });
  const activeEmployees = employeeNames.size;

  /* Alerts */
  const supplierExpiring = state.suppliers.filter(s=>{
    if(!s.lastAssessmentDate) return false;
    const nextDue = new Date(s.lastAssessmentDate); nextDue.setDate(nextDue.getDate()+365);
    const days = Math.round((nextDue-new Date())/86400000);
    return days>=0 && days<=7;
  });
  const haccpVerificationOverdue = state.verificationLogs.filter(v=>v.activityType==="HACCP Plan Review" && v.nextDueDate && daysUntil(v.nextDueDate)<0);
  const trainingExpiring = state.trainingRecords.filter(t=>trainingStatus(t)==="Expiring Soon");
  const alerts = [];
  if(overdue.length) alerts.push(`⚠️ ${overdue.length} CAPA${overdue.length===1?'':'s'} overdue`);

  if(trainingExpiring.length) alerts.push(`⚠️ ${trainingExpiring.length} training certificate${trainingExpiring.length===1?'':'s'} expiring soon`);

  const moduleScores = [
    {label:"Audit Compliance", score:avgScore},
    {label:"CAPA Management", score:capaScore},
    {label:"Risk Management", score:riskScore},
    {label:"KPI Metrics On-Target", score:metricsScore},
    {label:"Document Control", score:documentScore},
    {label:"Training Compliance", score:trainingScore},
    {label:"HACCP Compliance", score:haccpScore},
    {label:"Product Recall Progress", score:recallScore},
    {label:"Supplier Approval Rate", score:supplierScore},
    {label:"Allergen Incident Closure", score:allergenScore},
    {label:"CIP Cleaning Compliance", score:cipScore},
    {label:"Sensory Evaluation Pass Rate", score:sensoryScore}

  const availableScores = moduleScores.filter(x=>x.score!==null);
  const overallScore = availableScores.length ? Math.round(availableScores.reduce((a,b)=>a+b.score,0)/availableScores.length) : null;
  const overallGrade = complianceGrade(overallScore);
  const metricSnapshot = {
    overall:overallScore, audit:avgScore, capa:capaScore, risk:riskScore,
    training:trainingScore, documents:documentScore, kpiMetrics:metricsScore, supplier:supplierScore,
    haccp:haccpScore, recall:recallScore, allergen:allergenScore, cip:cipScore, sensory:sensoryScore,
    lab:labScore
  };
  recordComplianceSnapshot(overallScore, metricSnapshot);
  const trend = complianceTrend();

  const KPI_NAV_TARGETS = {
    audit:"nav-audit-register", capa:"nav-capa", risk:"nav-risk", training:"nav-people-training",
    documents:"nav-documents", kpiMetrics:"nav-metrics", supplier:"nav-suppliers-list",
    haccp:"nav-fs-haccp", recall:"nav-trace-recall", allergen:"nav-fs-allergens", cip:"nav-fs-cip",
    sensory:"nav-sensory-0", lab:"nav-lab-trend"
  };
  function kpiRow(label, score, key){
    const g = complianceGrade(score);
    const t = metricTrend(key, score);
    const trendHtml = t===null ? '' : `<span style="font-size:11px;color:${t>=0?'var(--green)':'var(--rust)'};margin-left:6px;">${t>=0?'↑ +':'↓ '}${t}%</span>`;
    const navId = KPI_NAV_TARGETS[key];
    const inner = `
      <span>${GRADE_EMOJI[g.tone]} ${label}</span>

    if(navId){

  }

  /* Today's Priorities — a ranked, clickable action list.
     Primary sort: severity tier (red > yellow > green).
     Secondary sort: urgency within the tier (more overdue days / higher risk level first),
     so the single worst item in each tier always surfaces first instead of insertion order. */
  const priorities = [];

  const topPriorities = priorities.slice(0,8);

                <div style="grid-column:1/-1;display:flex;justify-content:flex-end;">
                  <button class="btn btn-primary" data-action="create-copq">Save Entry</button>

              </div>

            ${recentCopq.length ? `
              <div style="margin-top:8px;">
                ${recentCopq.map(e=>`
                  <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:3px 0;">
                    <span>${e.date} · ${esc(e.category)} · ${esc(e.description)||'—'}</span>
                    <span class="flex-wrap"><strong style="color:var(--text);">R ${Number(e.amount||0).toLocaleString()}</strong><button class="btn btn-ghost" style="padding:1px 6px;font-size:11px;" data-delete-copq="${e.id}">✕</button></span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;

        const recentCsat = [...state.csatEntries].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,3);
        const csatHtml = `
          <div style="padding:8px 0;font-size:13px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
              <div>Customer Satisfaction</div>
              <div class="flex-wrap">
                <span class="tag tag-${csatAvg===null?'neutral':(csatAvg>=4?'green':csatAvg>=3?'amber':'rust')}">${csatAvg===null ? 'not tracked yet' : `${csatAvg.toFixed(1)} / 5 · ${state.csatEntries.length} response(s)`}</span>
                <button class="btn btn-ghost" style="padding:2px 8px;font-size:12px;" data-action="toggle-csat-form">${dashShowCsatForm?'Cancel':'+ Log Score'}</button>
              </div>
            </div>
            ${dashShowCsatForm ? `
              <div class="grid3" style="margin-top:8px;">
                <label class="field">Date<input type="date" id="csat-date" value="${today()}" /></label>
                <label class="field">Customer / Account<input id="csat-customer" placeholder="e.g. Woolworths DC" /></label>
                <label class="field">Score (1–5)<select id="csat-score">${[5,4,3,2,1].map(v=>`<option>${v}</option>`).join('')}</select></label>

                ${recentCsat.map(e=>`
                  <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:3px 0;">
                    <span>${e.date} · ${esc(e.customer)||'—'} ${e.comments?`· ${esc(e.comments)}`:''}</span>
                    <span class="flex-wrap"><strong style="color:var(--text);">${e.score} / 5</strong><button class="btn btn-ghost" style="padding:1px 6px;font-size:11px;" data-delete-csat="${e.id}">✕</button></span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>

        return staticHtml + copqHtml + csatHtml;
      })()}

let complianceChartInstance = null;

  foodsafeTempChartInstance = new Chart(canvas, {

}
function renderComplianceChart(){
  if(typeof Chart === 'undefined') return;

function statCard(icon,label,value,navId){
  if(navId){
    return `<button data-navid="${navId}" class="card p4" style="text-align:left;cursor:pointer;display:block;width:100%;border:1px solid var(--line2);"><div class="stat-label">${icon} ${label}</div><div class="stat-value">${value}</div></button>`;
  }
  return `<div class="card p4"><div class="stat-label">${icon} ${label}</div><div class="stat-value">${value}</div></div>`;
}

function filteredAudits(){
  return state.audits.filter(a=>{
    const findingsText = a.findings.map(f=>f.desc+" "+f.clause).join(" ");
    const haystack = (a.title+" "+a.area+" "+a.auditor+" "+(a.auditNumber||"")+" "+findingsText).toLowerCase();
    const matchesSearch = !auditSearch || haystack.includes(auditSearch.toLowerCase());
    const matchesStandard = auditStandardFilter==="All" || a.standard===auditStandardFilter;
    const matchesStatus = auditStatusFilter==="All" || a.status===auditStatusFilter || (auditStatusFilter==="Open" && a.status!=="Closed");
    const matchesRisk = auditRiskFilter==="All" || a.riskLevel===auditRiskFilter;
    return matchesSearch && matchesStandard && matchesStatus && matchesRisk;
  });
}

  const audits = filteredAudits();
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">Audit Register</h2>
      <div class="flex-wrap">
        <button class="btn btn-ghost" data-action="open-company-modal">⚙ Company</button>

        <button class="btn btn-ghost" data-action="export-csv">⬇ CSV</button>
        <input type="file" id="restore-file-input" accept=".json" style="display:none;" />

    <div class="card p4 grid3" style="margin-bottom:16px;">
      <label class="field">Search<input id="audit-search" placeholder="Title, area, auditor, finding text…" value="${esc(auditSearch)}" /></label>
      <label class="field">Standard<select id="audit-filter-standard"><option>All</option>${STANDARDS.map(s=>`<option ${s===auditStandardFilter?'selected':''}>${s}</option>`).join('')}</select></label>
      <label class="field">Status<select id="audit-filter-status"><option ${auditStatusFilter==="All"?'selected':''}>All</option><option ${auditStatusFilter==="Open"?'selected':''}>Open</option>${["Planned","In Progress","Closed"].map(s=>`<option ${s===auditStatusFilter?'selected':''}>${s}</option>`).join('')}</select></label>
      <label class="field">Risk Level<select id="audit-filter-risk"><option>All</option>${RISK_LEVELS.map(s=>`<option ${s===auditRiskFilter?'selected':''}>${s}</option>`).join('')}</select></label>
    </div>
    ${showNewAudit ? `
      <div class="card p4 grid3" style="margin-bottom:16px;">
        <label class="field">Title<input id="na-title" /></label>
        <label class="field">Standard<select id="na-standard">${STANDARDS.map(s=>`<option>${s}</option>`).join('')}</select></label>
        <label class="field">Department / Area<input id="na-area" /></label>
        <label class="field">Audit Type<select id="na-audit-type">${AUDIT_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></label>
        <div class="muted-italic" style="grid-column:1/-1;font-size:12px;">Checklist sections auto-populate from a starter template for the selected standard — you can edit or add to them after creating the audit.</div>
        <div style="grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;">
          <button class="btn btn-ghost" data-action="cancel-new-audit">Cancel</button>

      </div>` : ``}

    </div>
  `;
}

function renderAuditRow(a){
  const open = openAuditId === a.id;
  const openFindings = a.findings.filter(f=>f.status!=="Closed").length;
  return `
    <div class="card" style="margin-bottom:10px;overflow:hidden;">
      <button class="audit-row" data-toggle-audit="${a.id}">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <span style="color:#a39a86;">${open?'▾':'›'}</span>
          <div style="min-width:0;">
            <div class="audit-title">${esc(a.title)} ${a.auditNumber?`<span style="color:var(--muted);font-weight:400;font-size:11px;">· ${a.auditNumber}</span>`:''}</div>
            <div class="audit-sub">${esc(a.standard)} · ${esc(a.area)||'—'} · ${a.date}</div>
          </div>
        </div>
        <div class="flex-wrap">
          ${openFindings>0?`<span class="tag tag-rust">${openFindings} open</span>`:''}
          <span class="tag tag-${riskTone[a.riskLevel]||'neutral'}">${a.riskLevel||'—'} risk</span>
          <span class="tag tag-${statusTone[a.status]}">${a.status}</span>
        </div>
      </button>
      ${open ? `<div style="border-top:1px solid var(--line2);padding:16px;">${renderAuditDetail(a)}</div>` : ''}
    </div>
  `;
}

function renderAuditDetail(a){
  const items = a.sections.flatMap(s=>s.items).filter(i=>i.result==="Pass"||i.result==="Fail");
  const score = items.length ? Math.round((items.filter(i=>i.result==="Pass").length/items.length)*100) : null;
  const signOff = a.signOff || { auditorName:"", auditorSignedAt:null, approverName:"", approverSignedAt:null };
  const ap = a.auditPlan || { organization:"", address:"", visitNumber:"", leadAuditor:"", teamMembers:"", standards: a.standard||"", auditLanguage:"English", scope:"", objectives:"", itinerary: [] };
  const locked = !!signOff.auditorSignedAt;
  const lockStyle = locked ? 'opacity:.55;pointer-events:none;' : '';
  return `
    <div class="card p4" style="margin-bottom:12px;">
      <div class="grid2">
        <label class="field">Audit Number<input value="${esc(a.auditNumber)||'—'}" disabled style="opacity:.7;" /></label>

        <label class="field">Standard<select data-audit-field="${a.id}:standard">${STANDARDS.map(s=>`<option ${s===a.standard?'selected':''}>${s}</option>`).join('')}</select></label>
        <label class="field">Department / Area<input data-audit-field="${a.id}:area" value="${esc(a.area)}" /></label>
        <label class="field">Auditor<input data-audit-field="${a.id}:auditor" value="${esc(a.auditor)}" placeholder="e.g. Sandiso" /></label>
        <label class="field">Auditee<input data-audit-field="${a.id}:auditee" value="${esc(a.auditee)}" placeholder="e.g. Saider" /></label>
        <label class="field">Date<input type="date" data-audit-field="${a.id}:date" value="${a.date}" /></label>
        <label class="field">Status<select data-audit-field="${a.id}:status">${["Planned","In Progress","Closed"].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></label>
        <label class="field">Risk Level<select data-audit-field="${a.id}:riskLevel">${RISK_LEVELS.map(s=>`<option ${s===a.riskLevel?'selected':''}>${s}</option>`).join('')}</select></label>
        <label class="field">Audit Type<select data-audit-field="${a.id}:auditType">${AUDIT_TYPES.map(t=>`<option ${t===(a.auditType||'Internal')?'selected':''}>${t}</option>`).join('')}</select></label>
      </div>
      <div class="top-border" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">

function renderCapa(){
  const all = state.audits.flatMap(a=>a.findings.map(f=>({...f, auditTitle:a.title, auditId:a.id})));
  const filtered = all.filter(f => capaFilter==="All" || f.status===capaFilter || (capaFilter==="Overdue" && f.dueDate && daysUntil(f.dueDate)<0 && f.status!=="Closed"));
  const sorted = [...filtered].sort((a,b)=>(a.dueDate||"9999").localeCompare(b.dueDate||"9999"));
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">CAPA Tracker</h2>
      <div class="flex-wrap">
        ${["All","Open","In Progress","Closed","Overdue"].map(f=>`<button class="status-pill ${capaFilter===f?'active':''}" data-capa-filter="${f}">${f}</button>`).join('')}
      </div>
    </div>
    <div>
      ${sorted.length===0 ? `<p class="muted-italic">No CAPAs match this filter.</p>` : sorted.map(f=>{
        const overdue = f.dueDate && daysUntil(f.dueDate)<0 && f.status!=="Closed";
        return `<button data-jump-audit="${f.auditId}" class="card p4" style="display:flex;width:100%;text-align:left;gap:12px;flex-wrap:wrap;margin-bottom:8px;cursor:pointer;${overdue?'border-color:#e8c3b5;':''}">
          <div style="flex:1;min-width:200px;">
            <div style="font-size:14px;">${esc(f.desc)}</div>
            <div class="audit-sub">${esc(f.auditTitle)} · ${esc(f.clause)}</div>
          </div>
          <div class="flex-wrap" style="font-size:12px;color:var(--muted);">
            ${f.owner?`<span>👤 ${esc(f.owner)}</span>`:''}
            ${f.dueDate?`<span style="${overdue?'color:var(--rust);font-weight:600;':''}">📅 ${f.dueDate}</span>`:''}
            ${f.autoGenerated?`<span class="tag tag-navy">⚡ Auto-CAPA</span>`:''}
            <span class="tag tag-${sevTone[f.severity]}">${f.severity}</span>
            <span class="tag tag-${statusTone[f.status]}">${f.status}</span>
          </div>
        </button>`;
      }).join('')}
    </div>
  `;
}

    <div class="grid2" style="margin-bottom:12px;">

function documentReviewStatus(d){
  if(d.status==="Obsolete") return null;
  if(!d.reviewDate) return null;
  const days = daysUntil(d.reviewDate);
  if(days<0) return "Overdue";
  if(days<=30) return "Due Soon";
  return null;
}

/* ---------- HACCP ---------- */
function haccpStatus(p){
  if(p.status==="Inactive") return "Inactive";
  if(!p.readings || p.readings.length===0) return "No Readings";
  const latest = [...p.readings].sort((a,b)=>b.date.localeCompare(a.date))[0];
  return latest.result==="Deviation" ? "Deviation" : "Compliant";
}

/* ---------- Product Recall ---------- */
function recallCompletionPct(r){
  const steps = r.actionSteps || [];
  if(steps.length===0) return 0;
  return Math.round((steps.filter(s=>s.done).length/steps.length)*100);
}

function nextRecallNumber(){
  return `REC-${new Date().getFullYear()}-${String(state.productRecalls.length+1).padStart(3,'0')}`;
}

function renderRecalls(){
  const all = state.productRecalls;
  const filtered = all.filter(r => recallStatusFilter==="All" || r.status===recallStatusFilter);
  const activeCount = all.filter(r=>r.status!=="Closed").length;
  const classICount = all.filter(r=>r.riskClass && r.riskClass.startsWith("Class I –")).length;
  const avgCompletion = all.length ? Math.round(all.reduce((sum,r)=>sum+recallCompletionPct(r),0)/all.length) : 0;
  return `

/* ---------- CIP Cleaning Management ---------- */
function cipStatus(c){
  if(c.status==="Inactive") return "Inactive";
  if(!c.nextDueDate) return "On Track";
  const days = daysUntil(c.nextDueDate);
  if(days<0) return "Overdue";
  if(days<=1) return "Due Soon";
  return "On Track";
}

function renderCip(){
  const all = state.cipSchedules;
  const filtered = all.filter(c => cipStatusFilter==="All" || cipStatus(c)===cipStatusFilter);
  const overdueCount = all.filter(c=>cipStatus(c)==="Overdue").length;

/* ---------- Sensory Evaluation ---------- */
function sensoryOverallScore(e){
  const scores = SENSORY_ATTRIBUTES.map(attr => Number(e.scores?.[attr])).filter(v=>!Number.isNaN(v));
  if(scores.length===0) return null;
  return Math.round((scores.reduce((a,b)=>a+b,0)/scores.length)*10)/10;
}
function sensoryResult(e){
  const scores = SENSORY_ATTRIBUTES.map(attr => Number(e.scores?.[attr])).filter(v=>!Number.isNaN(v));
  if(scores.length===0) return "Fail";
  if(scores.some(v=>v<=2)) return "Fail";
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  if(avg>=4) return "Pass";
  if(avg>=3) return "Borderline";
  return "Fail";
}

/* ---------- Traceability ---------- */
function batchExpiryStatus(b){
  if(!b.expiry) return null;
  const days = daysUntil(b.expiry);
  if(days<0) return "Expired";
  if(days<=14) return "Expiring Soon";
  return null;
}
function batchForwardTrace(b){
  return state.batches.filter(x=>x.type==="Finished Product" && (x.components||[]).includes(b.id));
}
function batchBackwardTrace(b){
  return (b.components||[]).map(id=>state.batches.find(x=>x.id===id)).filter(Boolean);
}

function renderTraceability(){

  const q = batchSearch.trim().toLowerCase();
  const filtered = all.filter(b=>{

    const matchesSearch = !q || [b.product,b.batchNo,b.supplier].some(v=>(v||'').toLowerCase().includes(q));
    return matchesType && matchesSearch;
  });
  const rawCount = all.filter(b=>b.type==="Raw Material").length;
  const finishedCount = all.filter(b=>b.type==="Finished Product").length;
  const quarantineCount = all.filter(b=>b.status==="Quarantine").length;
  const expired = all.filter(b=>batchExpiryStatus(b)==="Expired");
  const expiringSoon = all.filter(b=>batchExpiryStatus(b)==="Expiring Soon");
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">🔍 Traceability — Batch Register</h2>

    ${expired.length>0 ? `
      <div class="card p4" style="margin-bottom:16px;border:1px solid var(--rust);">
        <strong style="color:var(--rust);">⚠ Expired — Action Required</strong>
        ${expired.map(b=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span>${esc(b.product)} · <strong>${esc(b.batchNo)}</strong></span><span class="tag tag-rust">${Math.abs(daysUntil(b.expiry))}d expired</span></div>`).join('')}
      </div>` : ''}
    ${expiringSoon.length>0 ? `
      <div class="card p4" style="margin-bottom:16px;">
        <strong>Expiring Within 14 Days</strong>

      </div>` : ''}
    ${quarantineCount>0 ? `
      <div class="card p4" style="margin-bottom:16px;">

/* ---------- Temperature Monitoring ---------- */
function tempLogIsCritical(log){
  const p = state.tempProducts.find(x=>x.id===log.productId);
  if(!p) return false;
  return log.temp < p.tempMin || log.temp > p.tempMax;
}

function renderMetricDetail(m, value){

    </div>
    ${m.source==="manual" ? `
      <div class="card p4 top-border" style="margin-bottom:12px;">
        <h3 class="serif" style="font-size:15px;margin:0 0 10px;">Log a Reading</h3>
        <div class="grid3">

          <label class="field">Value<input type="number" step="any" id="reading-value-${m.id}" /></label>
          <button class="btn btn-primary" style="align-self:end;" data-action="add-reading" data-metric="${m.id}">+ Add Reading</button>
        </div>
        ${m.history && m.history.length>=2 ? `<div class="top-border"><canvas id="metric-chart-${m.id}" height="120"></canvas></div>` : ''}
        <div class="top-border">${historyRows}</div>
      </div>
    ` : `
      <div class="card p4 top-border" style="margin-bottom:12px;">
        <p class="muted-italic" style="font-size:13px;">Current value: <strong style="color:var(--ink);">${value===null?'no data yet':value+' '+esc(m.unit)}</strong> — recalculated live from your Audit Register / CAPA / Risk Register data.</p>
      </div>
    `}
    <div style="display:flex;justify-content:flex-end;">
      <button class="btn btn-danger" data-action="delete-metric" data-metric="${m.id}">Delete Metric</button>
    </div>
  `;
}

let showNewChecklist = false;
let openChecklistId = null;
let checklistTemplateFilter = "All";

let metricChartInstances = {};
function renderMetricCharts(){
  if(typeof Chart === 'undefined') return;
  state.metrics.forEach(m=>{
    if(metricChartInstances[m.id]){ metricChartInstances[m.id].destroy(); delete metricChartInstances[m.id]; }
    const canvas = document.getElementById(`metric-chart-${m.id}`);
    if(!canvas) return;
    const sorted = [...(m.history||[])].sort((a,b)=>a.date.localeCompare(b.date));
    const onTargetColor = "#3f6b2e";
    metricChartInstances[m.id] = new Chart(canvas, {
      type: 'line',
      data: {
        labels: sorted.map(h=>h.date),
        datasets: [
          { label: m.name, data: sorted.map(h=>h.value), borderColor:'#1c2b4a', backgroundColor:'rgba(28,43,74,.12)', fill:true, tension:.25 },
          { label: 'Target', data: sorted.map(()=>m.target), borderColor: onTargetColor, borderDash:[6,4], pointRadius:0, fill:false }
        ]
      },
      options: { plugins:{ legend:{ display:true, labels:{ boxWidth:12, font:{size:10} } } }, scales:{ y:{ beginAtZero:false }, x:{ grid:{display:false} } } }
    });
  });
}

function checklistScore(c){
  const items = (c.sections||[]).flatMap(s => s.items||[]).filter(i=>i.result==="Pass"||i.result==="Fail");
  return items.length===0 ? null : Math.round((items.filter(i=>i.result==="Pass").length/items.length)*100);
}

function destroyChart(key){
  if(chartInstances[key]){ chartInstances[key].destroy(); delete chartInstances[key]; }
}

function renderCharts(){
  if(typeof Chart === 'undefined'){ return; }
  const gridColor = darkMode ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
  const textColor = darkMode ? '#d8d3c6' : '#5c5540';
  Chart.defaults.color = textColor;
  Chart.defaults.borderColor = gridColor;

  /* Findings by severity (open only) */
  const openFindings = state.audits.flatMap(a=>a.findings).filter(f=>f.status!=="Closed");
  const sevCounts = ["Minor","Major","Critical"].map(s=>openFindings.filter(f=>f.severity===s).length);
  destroyChart('severity');
  const sevCtx = document.getElementById('chart-severity');
  if(sevCtx){
    chartInstances.severity = new Chart(sevCtx, {
      type: 'doughnut',
      data: { labels:["Minor","Major","Critical"], datasets:[{ data: sevCounts, backgroundColor:['#8a5a10','#9b3f28','#7a2c1a'] }] },
      options: { plugins:{ legend:{ position:'bottom' } }, maintainAspectRatio:true }
    });
  }

  /* CAPA ageing buckets (open findings with a due date) */
  const openWithDue = openFindings.filter(f=>f.dueDate);
  const buckets = { "Not overdue":0, "1–7 days":0, "8–30 days":0, "30+ days":0 };
  openWithDue.forEach(f=>{
    const overdueDays = -daysUntil(f.dueDate);
    if(overdueDays <= 0) buckets["Not overdue"]++;
    else if(overdueDays <= 7) buckets["1–7 days"]++;
    else if(overdueDays <= 30) buckets["8–30 days"]++;
    else buckets["30+ days"]++;
  });
  destroyChart('ageing');
  const ageingCtx = document.getElementById('chart-ageing');
  if(ageingCtx){
    chartInstances.ageing = new Chart(ageingCtx, {
      type: 'bar',
      data: { labels: Object.keys(buckets), datasets:[{ label:"Open CAPAs", data: Object.values(buckets), backgroundColor:'#9b3f28' }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 }, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Compliance trend across audits, ordered by date */
  const scoredAudits = state.audits
    .map(a=>({ label: a.auditNumber || a.title, date:a.date, score: scoreOf(a) }))
    .filter(a=>a.score!==null)
    .sort((x,y)=>x.date.localeCompare(y.date));
  destroyChart('trend');
  const trendCtx = document.getElementById('chart-trend');
  if(trendCtx){
    chartInstances.trend = new Chart(trendCtx, {
      type: 'line',
      data: { labels: scoredAudits.map(a=>a.label), datasets:[{ label:"Compliance %", data: scoredAudits.map(a=>a.score), borderColor:'#1c2b4a', backgroundColor:'rgba(28,43,74,.15)', fill:true, tension:.25 }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Audits by standard */
  const byStandard = {};
  state.audits.forEach(a=>{ byStandard[a.standard] = (byStandard[a.standard]||0)+1; });
  destroyChart('standards');
  const stdCtx = document.getElementById('chart-standards');
  if(stdCtx){
    chartInstances.standards = new Chart(stdCtx, {
      type: 'bar',
      data: { labels: Object.keys(byStandard), datasets:[{ label:"Audits", data: Object.values(byStandard), backgroundColor:'#3f6b2e' }] },
      options: { indexAxis:'y', plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, ticks:{ precision:0 }, grid:{color:gridColor} }, y:{ grid:{display:false} } } }
    });
  }

  /* CAPA Status pie (Open / In Progress / Closed / Overdue) */
  const allFindings = state.audits.flatMap(a=>a.findings);
  const capaOverdueCount = allFindings.filter(f=>f.status!=="Closed" && f.dueDate && daysUntil(f.dueDate)<0).length;
  const capaStatusCounts = {
    "Open": allFindings.filter(f=>f.status==="Open").length,
    "In Progress": allFindings.filter(f=>f.status==="In Progress").length,
    "Closed": allFindings.filter(f=>f.status==="Closed").length,
    "Overdue": capaOverdueCount
  };
  destroyChart('capaStatus');
  const capaStatusCtx = document.getElementById('chart-capa-status');
  if(capaStatusCtx){
    chartInstances.capaStatus = new Chart(capaStatusCtx, {
      type: 'pie',
      data: { labels: Object.keys(capaStatusCounts), datasets:[{ data: Object.values(capaStatusCounts), backgroundColor:['#c98a2b','#1c2b4a','#3f6b2e','#9b3f28'] }] },
      options: { plugins:{ legend:{ position:'bottom' } } }
    });
  }

  /* Audit results by department/area */
  const byArea = {};
  state.audits.forEach(a=>{
    const s = scoreOf(a);
    if(s===null) return;
    const area = a.area || "Unspecified";
    if(!byArea[area]) byArea[area] = [];
    byArea[area].push(s);
  });
  const areaLabels = Object.keys(byArea);
  const areaAverages = areaLabels.map(k=>Math.round(byArea[k].reduce((a,b)=>a+b,0)/byArea[k].length));
  destroyChart('auditDept');
  const auditDeptCtx = document.getElementById('chart-audit-dept');
  if(auditDeptCtx){
    chartInstances.auditDept = new Chart(auditDeptCtx, {
      type: 'bar',
      data: { labels: areaLabels, datasets:[{ label:"Avg. Audit Score %", data: areaAverages, backgroundColor:'#1c2b4a' }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Training compliance by department (role field) */
  const byDept = {};
  state.trainingRecords.forEach(t=>{
    const dept = t.role || "Unspecified";
    if(!byDept[dept]) byDept[dept] = {valid:0,total:0};
    byDept[dept].total++;
    const s = trainingStatus(t);
    if(s==="Valid"||s==="No Expiry") byDept[dept].valid++;
  });
  const deptLabels = Object.keys(byDept);
  const deptPct = deptLabels.map(k=>Math.round((byDept[k].valid/byDept[k].total)*100));
  destroyChart('trainingDept');
  const trainingDeptCtx = document.getElementById('chart-training-dept');
  if(trainingDeptCtx){
    chartInstances.trainingDept = new Chart(trainingDeptCtx, {
      type: 'bar',
      data: { labels: deptLabels, datasets:[{ label:"% Compliant", data: deptPct, backgroundColor:'#3f6b2e' }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Laboratory test pass rate over time (by month) */
  const labAll = [...state.labResults, ...state.empSwabs, ...state.proficiencyTests].filter(r=>r.status && r.date);
  const byMonth = {};
  labAll.forEach(r=>{
    const m = r.date.slice(0,7);
    if(!byMonth[m]) byMonth[m] = {pass:0,total:0};
    byMonth[m].total++;
    if(r.status==="Pass") byMonth[m].pass++;
  });
  const monthLabels = Object.keys(byMonth).sort();
  const monthPassRate = monthLabels.map(m=>Math.round((byMonth[m].pass/byMonth[m].total)*100));
  destroyChart('labPassRate');
  const labPassCtx = document.getElementById('chart-lab-pass-rate');
  if(labPassCtx){
    chartInstances.labPassRate = new Chart(labPassCtx, {
      type: 'line',
      data: { labels: monthLabels, datasets:[{ label:"Pass Rate %", data: monthPassRate, borderColor:'#3f6b2e', backgroundColor:'rgba(63,107,46,.15)', fill:true, tension:.25 }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* HACCP CCP compliance */
  const ccpLabels = state.haccpPoints.map(p=>p.ccpNumber||"CCP");
  const ccpValues = state.haccpPoints.map(p=>haccpStatus(p)==="Compliant"?100:haccpStatus(p)==="Deviation"?0:50);

/* Rough localStorage usage estimate. Browsers differ (5-10MB is typical), so this is shown
   as an estimate against a conservative 5MB baseline rather than a precise number. */
function estimateStorageUsage(){
  let totalChars = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      const v = localStorage.getItem(k) || "";
      totalChars += k.length + v.length;
    }
  }catch(e){ /* ignore */ }
  const bytes = totalChars * 2; // JS strings are UTF-16
  const CONSERVATIVE_QUOTA_BYTES = 5 * 1024 * 1024;
  const pct = Math.min(100, Math.round((bytes / CONSERVATIVE_QUOTA_BYTES) * 100));
  let photoBytes = 0, photoCount = 0;
  const countPhoto = (p)=>{ if(p){ photoBytes += p.length*2; photoCount++; } };
  (state.audits||[]).forEach(a=>{
    (a.findings||[]).forEach(f=>countPhoto(f.photo));
    (a.sections||[]).forEach(sec=>(sec.items||[]).forEach(it=>countPhoto(it.photo)));
  });
  (state.checklists||[]).forEach(c=>{
    (c.sections||[]).forEach(sec=>(sec.items||[]).forEach(it=>countPhoto(it.photo)));
  });
  return { bytes, pct, photoBytes, photoCount };
}
function formatBytes(b){
  if(b < 1024) return b + " B";
  if(b < 1024*1024) return Math.round(b/1024) + " KB";
  return (b/(1024*1024)).toFixed(1) + " MB";
}

function renderSettings(){
  const usage = estimateStorageUsage();
  const barColor = usage.pct >= 85 ? "var(--rust)" : usage.pct >= 60 ? "var(--amber)" : "var(--green)";
  return `
    <h2 class="serif" style="font-size:18px;margin:0 0 16px;">Settings</h2>
    <div class="card p4" style="margin-bottom:16px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
        <h3 class="serif" style="font-size:15px;margin:0;">Device Storage</h3>
        <span style="font-size:12px;color:${barColor};font-weight:600;">${usage.pct}% used (estimate)</span>
      </div>
      <div style="background:var(--line2);border-radius:6px;height:8px;overflow:hidden;margin-bottom:8px;">
        <div style="width:${usage.pct}%;background:${barColor};height:100%;"></div>
      </div>
      <p class="muted-italic" style="font-size:12px;margin:0 0 6px;">
        ${formatBytes(usage.bytes)} used, estimated against a conservative 5MB browser baseline — actual limits vary by browser and device.

/* ---------- PDF audit report ---------- */
function buildMetricsPrintReport(){
  const CATEGORY_ORDER = ["Process","Customer","Food Safety","Manufacturing","Supply Chain","Safety","Engineering","Recall & Traceability"];
  const metrics = state.metrics;
  const withValues = metrics.map(m => ({ m, value: metricCurrentValue(m), status: metricStatus(m, metricCurrentValue(m)), prev: metricPreviousValue(m) }));
  const onTarget = withValues.filter(x=>x.status==="On Target").length;
  const offTarget = withValues.filter(x=>x.status==="Off Target").length;

  const categories = [...new Set(metrics.map(m=>m.category||"Other"))]
    .sort((a,b)=> CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b) || a.localeCompare(b));

  const sectionsHtml = categories.map(cat=>{
    const rows = withValues.filter(x=>(x.m.category||"Other")===cat).map(x=>{
      const trend = (x.value!==null && x.prev!==null) ? (Math.round((x.value-x.prev)*100)/100) : null;
      const statusColor = x.status==="On Target" ? "#3f6b2e" : (x.status==="Off Target" ? "#9b3f28" : "#8a8168");
      return `<tr>
        <td>${esc(x.m.name)}${x.m.critical?' <span style="color:#9b3f28;">⚠</span>':''}</td>
        <td>${x.value===null?'—':x.value+' '+esc(x.m.unit||'')}</td>
        <td>${x.m.target} ${esc(x.m.unit||'')}</td>
        <td style="color:${statusColor};font-weight:600;">${x.status||'No data'}</td>
        <td>${trend===null?'—':(trend>=0?'+':'')+trend}</td>
      </tr>`;
    }).join('');
    return `
      <div class="section-title">${esc(cat).toUpperCase()}</div>
      <table><thead><tr><th>Metric</th><th>Current</th><th>Target</th><th>Status</th><th>Trend</th></tr></thead>
      <tbody>${rows}</tbody></table>
    `;
  }).join('');

  const c = state.companySettings || {};
  const logoHtml = c.logoDataUrl
    ? `<img src="${c.logoDataUrl}" style="max-height:44px;max-width:120px;" />`
    : `<div style="width:40px;height:40px;border-radius:9px;background:#1c2b4a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:sans-serif;">AQ</div>`;

  document.getElementById('print-report').innerHTML = `
