<style>
  :root{
    --bg:#f7f5ee; --paper:#ffffff; --line:#e2dbc9; --line2:#eee7d5; --ink:#2a2620;
    --muted:#8a8168; --navy:#1c2b4a; --navyBg:#e4e9f2; --rust:#9b3f28; --rustBg:#f6e4dd;
    --green:#3f6b2e; --greenBg:#e6ede0; --amber:#8a5a10; --amberBg:#faedd4;
  }
  body.dark{
    --bg:#121212; --paper:#1d1d1d; --line:#333029; --line2:#2b2822; --ink:#f0ede4;
    --muted:#a39a86; --navy:#5b7fc4; --navyBg:#26314a; --rust:#e08669; --rustBg:#3d251f;
    --green:#8fc46e; --greenBg:#213321; --amber:#e0b95f; --amberBg:#3a3020;
  }
  body.dark .logo{background:var(--navy);}
  body.dark header{background:rgba(18,18,18,.95);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',sans-serif;}
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px;}
  header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(247,245,238,.95);backdrop-filter:blur(6px);z-index:10;}
  .headrow{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:700;letter-spacing:.02em;flex-shrink:0;}
  .brand h1{font-size:21px;font-weight:600;margin:0;color:var(--navy);}
  .brand p{font-size:11px;color:var(--muted);margin:2px 0 0;text-transform:uppercase;letter-spacing:.12em;}
  nav{display:flex;gap:4px;}
  .tabnav button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;font-size:14px;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;}
  .tabnav button.active{color:var(--rust);border-color:var(--rust);}
  .tabnav::-webkit-scrollbar{display:none;}
  main{padding:24px 0 60px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(30,25,15,.04);}
  .p4{padding:16px;}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
  @media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr);}}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px;}
  .stat-value{font-size:24px;font-family:'Fraunces',serif;color:var(--navy);}
  input,select{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;color:var(--ink);font-family:inherit;width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--rust);box-shadow:0 0 0 3px rgba(155,63,40,.12);}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;font-size:14px;cursor:pointer;border:none;font-family:inherit;}
  .btn-primary{background:var(--navy);color:#fff;font-weight:500;}
  .btn-primary:hover{background:#16223b;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:#4a4535;}
  .btn-ghost:hover{background:#efe9dc;}
  .btn-danger{background:transparent;border:1px solid #e8c3b5;color:var(--rust);}
  .btn-danger:hover{background:var(--rustBg);}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;border:1px solid;font-size:11px;font-weight:500;}
  .tag-neutral{background:#efe9dc;color:#5c5540;border-color:#ddd4bc;}
  .tag-rust{background:var(--rustBg);color:var(--rust);border-color:#e8c3b5;}
  .tag-green{background:var(--greenBg);color:var(--green);border-color:#c7dab8;}
  .tag-navy{background:var(--navyBg);color:var(--navy);border-color:#c3cee2;}
  .tag-amber{background:var(--amberBg);color:var(--amber);border-color:#efd6a0;}
  .grid2{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.grid2{grid-template-columns:1fr 1fr;}}
  .grid3{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.grid3{grid-template-columns:1fr 1fr 1fr;}}
  .audit-row{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:none;border:none;cursor:pointer;text-align:left;font-family:inherit;}
  .audit-row:hover{background:#faf8f2;}
  .audit-title{font-size:14px;font-weight:500;color:var(--ink);}
  .audit-sub{font-size:11px;color:#a39a86;}
  .section-box{border:1px solid var(--line2);border-radius:10px;padding:12px;margin-bottom:10px;}
  .item-row{display:flex;align-items:flex-start;gap:8px;padding:4px 0;}
  .result-toggle{display:flex;gap:2px;flex-shrink:0;}
  .result-toggle button{background:none;border:none;cursor:pointer;padding:4px;border-radius:4px;font-size:16px;line-height:1;}
  .result-toggle button.active{background:#efe9dc;}
  .finding-box{border:1px solid var(--line2);border-radius:10px;padding:12px;margin-bottom:10px;}
  .muted-italic{color:#a39a86;font-style:italic;font-size:13px;}
  .flex-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .status-pill{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:none;cursor:pointer;font-family:inherit;}
  .status-pill.active{border-color:rgba(155,63,40,.5);color:var(--rust);background:var(--rustBg);}
  .top-border{border-top:1px solid var(--line2);padding-top:12px;margin-top:12px;}
  .x-btn{background:none;border:none;color:#c9c0a8;cursor:pointer;padding:2px;}
  .x-btn:hover{color:var(--rust);}
  .saved-flash{font-size:10px;color:var(--green);}
  .center{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .pro-tag{background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(30,25,15,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-card{background:var(--paper);border-radius:12px;padding:20px;max-width:360px;width:100%;}
  #print-report{display:none;}
  @media print{
    body{background:#fff;}
    header,.no-print{display:none !important;}
    #app > *:not(#print-report){display:none !important;}
    #print-report{display:block !important;}
    #print-report table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px;}
    #print-report th,#print-report td{border:1px solid #ccc;padding:6px 8px;text-align:left;}
    #print-report th{background:#eef1f6;}
    #print-report h1{font-size:20px;margin:0 0 2px;}
    #print-report .meta{font-size:12px;color:#555;margin-bottom:10px;}
    #print-report .section-title{font-size:13px;font-weight:700;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em;}
    #print-report .sig-row{display:flex;gap:40px;margin-top:40px;}
    #print-report .sig-line{flex:1;border-top:1px solid #333;padding-top:4px;font-size:11px;color:#555;}
  }
</style>
</head>

  });

}

function computeAutoMetricValue(autoType){
  const allFindings = state.audits.flatMap(a=>a.findings);
  switch(autoType){
    case "capa_closure_rate":
      if(allFindings.length===0) return null;
      return Math.round((allFindings.filter(f=>f.status==="Closed").length/allFindings.length)*1000)/10;
    case "overdue_capas":
      return allFindings.filter(f=>f.status!=="Closed" && f.dueDate && daysUntil(f.dueDate)<0).length;
    case "avg_audit_compliance": {
      const scores = state.audits.map(scoreOf).filter(s=>s!==null);
      if(scores.length===0) return null;
      return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
    }
    case "audit_findings_closed_count":
      return allFindings.filter(f=>f.status==="Closed").length;
    case "open_high_critical_risks":
      return state.riskAssessments.filter(r=>(r.riskLevel==="High"||r.riskLevel==="Critical") && r.status!=="Closed").length;
    default:
      return null;
  }
}

function metricCurrentValue(m){
  if(m.source==="auto") return computeAutoMetricValue(m.autoType);
  if(!m.history || m.history.length===0) return null;
  const sorted = [...m.history].sort((a,b)=>a.date.localeCompare(b.date));
  return sorted[sorted.length-1].value;
}
function metricPreviousValue(m){
  if(m.source==="auto" || !m.history || m.history.length<2) return null;
  const sorted = [...m.history].sort((a,b)=>a.date.localeCompare(b.date));
  return sorted[sorted.length-2].value;
}
function metricStatus(m, value){
  if(value===null || value===undefined) return null;
  const onTarget = m.direction==="lower" ? value<=m.target : value>=m.target;
  return onTarget ? "On Target" : "Off Target";
}

function compressImageToDataURL(file, maxWidth, quality, cb){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > maxWidth){ h = Math.round(h * (maxWidth/w)); w = maxWidth; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { alert("Could not read this image — please try a different photo."); };
    img.src = e.target.result;
  };
  reader.onerror = () => { alert("Could not read this file — please try a different photo."); };
  reader.readAsDataURL(file);
}

/* Compresses/resizes a photo client-side before storing as base64, to stay well within
   localStorage limits. Caps the longest edge at maxDim px and re-encodes as JPEG at `quality`. */
function compressImageFile(file, maxDim=1000, quality=0.7){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith("image/")){ reject(new Error("Not an image file")); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Could not read image"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}

let scoreCache = new Map();
function scoreOf(audit){
  if(scoreCache.has(audit.id)) return scoreCache.get(audit.id);
  const items = audit.sections.flatMap(s=>s.items).filter(i=>i.result==="Pass"||i.result==="Fail");
  const score = items.length===0 ? null : Math.round((items.filter(i=>i.result==="Pass").length/items.length)*100);
  scoreCache.set(audit.id, score);
  return score;
}

function complianceGrade(score){
  if(score===null) return {label:"No data yet", tone:"neutral"};
  if(score>=95) return {label:"Excellent", tone:"green"};
  if(score>=90) return {label:"Compliant", tone:"green"};
  if(score>=80) return {label:"Needs Improvement", tone:"amber"};
  if(score>=70) return {label:"At Risk", tone:"amber"};
  return {label:"Critical", tone:"rust"};
}

const GRADE_EMOJI = {green:"🟢", amber:"🟡", rust:"🔴", neutral:"⚪"};

function recordComplianceSnapshot(score){
  if(score===null) return;
  const t = today();
  const existing = state.complianceScoreHistory.find(h=>h.date===t);
  if(existing){ existing.score = score; } else { state.complianceScoreHistory.push({date:t, score}); }
  saveStore(state);
}
function complianceTrend(){
  const sorted = [...state.complianceScoreHistory].sort((a,b)=>a.date.localeCompare(b.date));
  if(sorted.length<2) return null;
  const t = today();
  const priorEntries = sorted.filter(h=>h.date!==t);
  if(priorEntries.length===0) return null;
  const prev = priorEntries[priorEntries.length-1];
  const curr = sorted[sorted.length-1];
  return Math.round((curr.score - prev.score)*10)/10;
}

     (Audit Register, CAPA, Risk Register, KPI Metrics, Document Control). Training and Supplier
     Management aren't separate modules yet, so they're intentionally left out rather than faked. */

  const totalDocs = state.documents.length;
  const docsInGoodStanding = state.documents.filter(d=>d.status==="Approved" && documentReviewStatus(d)!=="Overdue").length;
  const documentScore = totalDocs>0 ? Math.round((docsInGoodStanding/totalDocs)*1000)/10 : null;
  const totalTraining = state.trainingRecords.length;
  const trainingInGoodStanding = state.trainingRecords.filter(t=>{ const s=trainingStatus(t); return s==="Valid"||s==="No Expiry"; }).length;
  const trainingScore = totalTraining>0 ? Math.round((trainingInGoodStanding/totalTraining)*1000)/10 : null;
  const moduleScores = [
    {label:"Audit Compliance", score:avgScore},
    {label:"CAPA Management", score:capaScore},
    {label:"Risk Management", score:riskScore},
    {label:"KPI Metrics On-Target", score:metricsScore},
    {label:"Document Control", score:documentScore},
    {label:"Training Compliance", score:trainingScore}
  ];
  const availableScores = moduleScores.filter(x=>x.score!==null);
  const overallScore = availableScores.length ? Math.round(availableScores.reduce((a,b)=>a+b.score,0)/availableScores.length) : null;
  const overallGrade = complianceGrade(overallScore);
  recordComplianceSnapshot(overallScore);
  const trend = complianceTrend();

  return `
    <div class="card p4" style="margin-bottom:16px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        <h3 class="serif" style="font-size:16px;margin:0;">${GRADE_EMOJI[overallGrade.tone]} Overall Compliance Score</h3>
        <span class="tag tag-${overallGrade.tone}" style="font-size:13px;">${overallScore===null?'No data yet':overallScore+'% — '+overallGrade.label}${trend!==null?` (${trend>=0?'↑ +':'↓ '}${trend}%)`:''}</span>
      </div>
      ${moduleScores.map(m=>{
        const g = complianceGrade(m.score);
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;">
          <span>${m.label}</span>
          <span class="tag tag-${g.tone}">${m.score===null?'no data':m.score+'% — '+g.label}</span>
        </div>`;
      }).join('')}
      ${state.complianceScoreHistory.length>=2 ? `<div class="top-border"><canvas id="compliance-trend-chart" height="100"></canvas></div>` : ''}
      <p class="muted-italic" style="font-size:11px;margin:10px 0 0;">Supplier Management isn't a separate module yet, so it's not included in this score.</p>
    </div>
    <div class="stats">
      ${statCard("📋", "Total Audits", audits.length)}
      ${statCard("⚠", "Open Findings", openFindings.length)}
      ${statCard("⏳", "Overdue CAPAs", overdue.length)}
      ${statCard("🚨", "High/Critical Risks", highRisks.length)}
      ${statCard("📄", "Docs Review Overdue", state.documents.filter(d=>documentReviewStatus(d)==="Overdue").length)}
      ${statCard("🎓", "Training Overdue", state.trainingRecords.filter(t=>trainingStatus(t)==="Overdue").length)}
      ${statCard("🚨", "Active Recalls", state.productRecalls.filter(r=>r.status!=="Closed").length)}
    </div>
    <div class="card p4" style="margin-bottom:16px;">
      <h3 class="serif" style="font-size:16px;margin:0 0 10px;">Priority Findings</h3>
      ${critical.filter(f=>f.status!=="Closed").length===0 ? `<p class="muted-italic">No major or critical findings open right now.</p>` :
        critical.filter(f=>f.status!=="Closed").slice(0,6).map(f=>`
          <button data-jump-audit="${f.auditId}" class="audit-row" style="background:#faf8f2;border:1px solid #e8e1cd;border-radius:8px;margin-bottom:6px;">
            <div style="min-width:0;">
              <div style="font-size:14px;">${esc(f.desc)}</div>
              <div class="audit-sub">${esc(f.auditTitle)} · ${esc(f.clause)}</div>
            </div>
            <div class="flex-wrap">
              ${f.dueDate && daysUntil(f.dueDate)<0 ? `<span class="tag tag-rust">overdue</span>`:''}
              <span class="tag tag-${sevTone[f.severity]}">${f.severity}</span>
            </div>
          </button>`).join('')}
    </div>
    <div class="card p4">
      <h3 class="serif" style="font-size:16px;margin:0 0 10px;">Audit Overview</h3>
      ${audits.map(a=>{
        const s = scoreOf(a);
        return `<button data-jump-audit="${a.id}" class="audit-row" style="border-radius:8px;">
          <div style="display:flex;align-items:center;gap:8px;min-width:0;">
            <span style="color:#c9c0a8;">›</span><span style="font-size:14px;">${esc(a.title)}</span>
          </div>
          <div class="flex-wrap">
            ${s!==null?`<span style="font-size:12px;color:var(--muted);">${s}%</span>`:''}
            <span class="tag tag-${statusTone[a.status]}">${a.status}</span>
          </div>
        </button>`;
      }).join('')}
    </div>
  `;
}
let complianceChartInstance = null;
function renderComplianceChart(){
  if(typeof Chart === 'undefined') return;
  if(complianceChartInstance){ complianceChartInstance.destroy(); complianceChartInstance = null; }
  const canvas = document.getElementById('compliance-trend-chart');
  if(!canvas) return;
  const sorted = [...state.complianceScoreHistory].sort((a,b)=>a.date.localeCompare(b.date));
  complianceChartInstance = new Chart(canvas, {
    type: 'line',
    data: { labels: sorted.map(h=>h.date), datasets: [{ label:'Overall Compliance %', data: sorted.map(h=>h.score), borderColor:'#1c2b4a', backgroundColor:'rgba(28,43,74,.12)', fill:true, tension:.25, pointRadius:3 }] },
    options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:false, max:100 }, x:{ grid:{display:false} } } }
  });
}

function statCard(icon,label,value){
  return `<div class="card p4"><div class="stat-label">${icon} ${label}</div><div class="stat-value">${value}</div></div>`;
}

function filteredAudits(){
  return state.audits.filter(a=>{
    const findingsText = a.findings.map(f=>f.desc+" "+f.clause).join(" ");
    const haystack = (a.title+" "+a.area+" "+a.auditor+" "+(a.auditNumber||"")+" "+findingsText).toLowerCase();
    const matchesSearch = !auditSearch || haystack.includes(auditSearch.toLowerCase());
    const matchesStandard = auditStandardFilter==="All" || a.standard===auditStandardFilter;
    const matchesStatus = auditStatusFilter==="All" || a.status===auditStatusFilter;
    const matchesRisk = auditRiskFilter==="All" || a.riskLevel===auditRiskFilter;
    return matchesSearch && matchesStandard && matchesStatus && matchesRisk;
  });
}

  const sorted = [...filtered].sort((a,b)=>(a.dueDate||"9999").localeCompare(b.dueDate||"9999"));

    <div>

  if(days<=30) return "Due Soon";
  return null;
}

/* ---------- HACCP ---------- */
function haccpStatus(p){
  if(p.status==="Inactive") return "Inactive";
  if(!p.readings || p.readings.length===0) return "No Readings";
  const latest = [...p.readings].sort((a,b)=>b.date.localeCompare(a.date))[0];
  return latest.result==="Deviation" ? "Deviation" : "Compliant";
}

function renderHaccp(){
  const all = state.haccpPoints;
  const filtered = all.filter(p => haccpStatusFilter==="All" || haccpStatus(p)===haccpStatusFilter);
  const deviationCount = all.filter(p=>haccpStatus(p)==="Deviation").length;
  const compliantCount = all.filter(p=>haccpStatus(p)==="Compliant").length;
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">

/* ---------- Product Recall ---------- */
function recallCompletionPct(r){
  const steps = r.actionSteps || [];
  if(steps.length===0) return 0;
  return Math.round((steps.filter(s=>s.done).length/steps.length)*100);
}

function nextRecallNumber(){
  return `REC-${new Date().getFullYear()}-${String(state.productRecalls.length+1).padStart(3,'0')}`;
}

function renderRecalls(){
  const all = state.productRecalls;
  const filtered = all.filter(r => recallStatusFilter==="All" || r.status===recallStatusFilter);
  const activeCount = all.filter(r=>r.status!=="Closed").length;
  const classICount = all.filter(r=>r.riskClass && r.riskClass.startsWith("Class I –")).length;
  const avgCompletion = all.length ? Math.round(all.reduce((sum,r)=>sum+recallCompletionPct(r),0)/all.length) : 0;
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">🚨 Product Recall Management</h2>
      <div class="flex-wrap">
        <button class="btn btn-ghost" data-action="export-recalls-csv">⬇ CSV</button>
        <button class="btn btn-primary" data-action="toggle-new-recall">+ New Recall</button>
      </div>
    </div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
      ${statCard("🚨", "Active Recalls", activeCount)}
      ${statCard("🔴", "Class I Recalls", classICount)}
      ${statCard("📊", "Avg Completion", avgCompletion+"%")}
    </div>
    <div class="card p4" style="margin-bottom:16px;">
      <div class="flex-wrap">
        <span style="font-size:12px;color:var(--muted);">Filter by Status:</span>
        ${["All",...RECALL_STATUSES].map(f=>`<button class="status-pill ${recallStatusFilter===f?'active':''}" data-recall-filter="${f}">${f}</button>`).join('')}
      </div>
    </div>
    ${showNewRecall ? renderNewRecallForm() : ''}
    <div>
      ${filtered.length===0 ? `<p class="muted-italic">No recalls logged. Hopefully it stays that way.</p>` : filtered.map(r=>renderRecallRow(r)).join('')}
    </div>
  `;
}

function renderNewRecallForm(){
  return `
    <div class="card p4 grid2" style="margin-bottom:16px;">
      <label class="field">Recall Number<input id="nr-number" value="${nextRecallNumber()}" /></label>
      <label class="field">Product Name<input id="nr-product" placeholder="e.g. Sponge Cake 500g" /></label>
      <label class="field">Product Code / SKU<input id="nr-code" placeholder="e.g. SC500-1907A" /></label>
      <label class="field">Batch / Lot Number<input id="nr-batch" placeholder="e.g. WWF-2607" /></label>
      <label class="field">Manufacturing Date<input type="date" id="nr-mfg-date" /></label>
      <label class="field">Expiry Date<input type="date" id="nr-expiry-date" /></label>
      <label class="field">Quantity Produced<input type="number" id="nr-qty-produced" /></label>
      <label class="field">Quantity Released<input type="number" id="nr-qty-released" /></label>
      <label class="field">Quantity Recalled<input type="number" id="nr-qty-recalled" /></label>
      <label class="field" style="grid-column:1/-1;">Reason for Recall<select id="nr-reason">${RECALL_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></label>
      <label class="field" style="grid-column:1/-1;">Risk Classification<select id="nr-class">${RECALL_CLASSES.map(c=>`<option>${c}</option>`).join('')}</select></label>
      <label class="field" style="grid-column:1/-1;">Notes<input id="nr-notes" placeholder="Optional notes…" /></label>

}

function renderRecallRow(r){
  const open = openRecallId === r.id;
  const pct = recallCompletionPct(r);
  return `
    <div class="card" style="margin-bottom:10px;overflow:hidden;">
      <button class="audit-row" data-toggle-recall="${r.id}">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <span style="color:#a39a86;">${open?'▾':'›'}</span>
          <div style="min-width:0;">
            <div class="audit-title">${esc(r.recallNumber)} <span style="color:var(--muted);font-weight:400;font-size:11px;">· ${esc(r.productName)}</span></div>
            <div class="audit-sub">Batch: ${esc(r.batchLot)||'—'} · ${pct}% actions complete</div>
          </div>
        </div>
        <div class="flex-wrap">
          <span class="tag tag-${recallClassTone[r.riskClass]||'neutral'}">${(r.riskClass||'').split(' –')[0]}</span>

}

function renderRecallDetail(r){
  const pct = recallCompletionPct(r);
  const commsRows = (r.commsLog && r.commsLog.length) ?

    <div class="grid2" style="margin-bottom:12px;">

      <label class="field">Product Name<input data-recall-field="${r.id}:productName" value="${esc(r.productName)}" /></label>
      <label class="field">Product Code / SKU<input data-recall-field="${r.id}:productCode" value="${esc(r.productCode)}" /></label>
      <label class="field">Batch / Lot Number<input data-recall-field="${r.id}:batchLot" value="${esc(r.batchLot)}" /></label>
      <label class="field">Manufacturing Date<input type="date" data-recall-field="${r.id}:mfgDate" value="${r.mfgDate||''}" /></label>
      <label class="field">Expiry Date<input type="date" data-recall-field="${r.id}:expiryDate" value="${r.expiryDate||''}" /></label>
      <label class="field">Quantity Produced<input type="number" data-recall-field="${r.id}:qtyProduced" value="${r.qtyProduced??''}" /></label>
      <label class="field">Quantity Released<input type="number" data-recall-field="${r.id}:qtyReleased" value="${r.qtyReleased??''}" /></label>
      <label class="field">Quantity Recalled<input type="number" data-recall-field="${r.id}:qtyRecalled" value="${r.qtyRecalled??''}" /></label>
      <label class="field" style="grid-column:1/-1;">Reason for Recall<select data-recall-field="${r.id}:reason">${RECALL_REASONS.map(x=>`<option ${x===r.reason?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="field" style="grid-column:1/-1;">Risk Classification<select data-recall-field="${r.id}:riskClass">${RECALL_CLASSES.map(x=>`<option ${x===r.riskClass?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="field" style="grid-column:1/-1;">Status<select data-recall-field="${r.id}:status">${RECALL_STATUSES.map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="field" style="grid-column:1/-1;">Notes<input data-recall-field="${r.id}:notes" value="${esc(r.notes)}" /></label>
    </div>
    <div class="card p4 top-border" style="margin-bottom:12px;">
      <h3 class="serif" style="font-size:15px;margin:0 0 10px;">✅ Recall Actions — ${pct}% Complete</h3>
      ${(r.actionSteps||[]).map((s,i)=>`
        <label style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;">

      <div class="grid2">
        <label class="field">Contact / Party<input id="rc-contact-${r.id}" placeholder="e.g. Customer, Regulator, Supplier" /></label>
        <label class="field">Date<input type="date" id="rc-date-${r.id}" value="${today()}" /></label>
        <label class="field">Method<input id="rc-method-${r.id}" placeholder="e.g. Phone, Email, Letter" /></label>
        <label class="field">Response Received<input id="rc-response-${r.id}" placeholder="Optional" /></label>
        <label class="field" style="grid-column:1/-1;">Follow-up Action<input id="rc-followup-${r.id}" placeholder="Optional" /></label>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px;">
        <button class="btn btn-primary" data-action="add-recall-comm" data-recall="${r.id}">+ Log Communication</button>

    </div>
    <div style="display:flex;justify-content:flex-end;">

/* ---------- KPI metrics render ---------- */
let showNewMetric = false;
let openMetricId = null;
let metricSourceChoice = "manual";
let metricAutoTypeChoice = AUTO_METRIC_OPTIONS[0].id;

function renderMetrics(){
  const metrics = state.metrics;
  const withValues = metrics.map(m => ({ m, value: metricCurrentValue(m), status: metricStatus(m, metricCurrentValue(m)) }));
  const onTarget = withValues.filter(x=>x.status==="On Target").length;
  const offTarget = withValues.filter(x=>x.status==="Off Target").length;
  const existingNames = new Set(metrics.map(m=>m.name));
  const allSamplesLoaded = SAMPLE_KPI_METRICS.every(sm=>existingNames.has(sm.name));
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">KPI Metrics</h2>
      <div class="flex-wrap">
        ${allSamplesLoaded
          ? `<button class="btn btn-ghost" data-action="seed-sample-metrics" disabled style="opacity:.55;cursor:default;">✓ Sample Metrics Loaded</button>
             <button class="btn btn-ghost" data-action="reset-sample-metrics" title="Delete and reload all sample metrics fresh">↺ Reset Samples</button>`
          : `<button class="btn btn-ghost" data-action="seed-sample-metrics">+ Load Sample SHEQ Metrics</button>`}
        <button class="btn btn-ghost" data-action="export-metrics-csv">⬇ CSV</button>
        <button class="btn btn-ghost" data-action="export-metrics-pdf">📄 Export Report</button>
        <button class="btn btn-primary" data-action="toggle-new-metric">+ New Metric</button>

    ${showNewMetric ? renderNewMetricForm() : ''}

      ${metrics.length===0 ? `<p class="muted-italic">No metrics tracked yet.</p>` : withValues.map(x=>renderMetricRow(x.m, x.value, x.status)).join('')}

}

function renderNewMetricForm(){
  const selectedAuto = AUTO_METRIC_OPTIONS.find(o=>o.id===metricAutoTypeChoice) || AUTO_METRIC_OPTIONS[0];
  return `
    <div class="card p4" style="margin-bottom:16px;">
      <div class="flex-wrap" style="margin-bottom:12px;">
        <button class="status-pill ${metricSourceChoice==='manual'?'active':''}" data-metric-source="manual">Manual Entry</button>
        <button class="status-pill ${metricSourceChoice==='auto'?'active':''}" data-metric-source="auto">Auto-Calculated from App Data</button>
      </div>
      <div class="grid2">
        ${metricSourceChoice==='auto' ? `
          <label class="field" style="grid-column:1/-1;">Auto Metric Source<select id="nm-auto-type">${AUTO_METRIC_OPTIONS.map(o=>`<option value="${o.id}" ${o.id===metricAutoTypeChoice?'selected':''}>${o.label}</option>`).join('')}</select></label>
        ` : `
          <label class="field" style="grid-column:1/-1;">Metric Name<input id="nm-name" placeholder="e.g. PPE Compliance" /></label>
        `}
        <label class="field">Category<input id="nm-category" placeholder="e.g. Safety" /></label>
        ${metricSourceChoice==='auto'
          ? `<label class="field">Unit<input id="nm-unit" value="${esc(selectedAuto.unit)}" disabled style="opacity:.65;" /></label>`

        <button class="btn btn-primary" data-action="create-metric">Create</button>

function renderMetricRow(m, value, status){
  const open = openMetricId === m.id;
  const delta = (value!==null && m.target!==undefined) ? Math.round((value - m.target)*100)/100 : null;
  return `
    <div class="card" style="margin-bottom:10px;overflow:hidden;">
      <button class="audit-row" data-toggle-metric="${m.id}">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <span style="color:#a39a86;">${open?'▾':'›'}</span>
          <div style="min-width:0;">
            <div class="audit-sub" style="text-transform:uppercase;">${esc(m.category)||'—'}${m.critical?' · CRITICAL':''}</div>
            <div class="audit-title">${esc(m.name)}</div>
          </div>
        </div>
        <div class="flex-wrap">
          <div style="text-align:right;">
            <div class="serif" style="font-size:18px;color:var(--navy);">${value===null?'—':value}<span style="font-size:11px;color:var(--muted);"> ${esc(m.unit)}</span></div>
            <div style="font-size:11px;color:var(--muted);">target ${m.target} ${esc(m.unit)}${delta!==null?` · ${delta>=0?'+':''}${delta}`:''}</div>
          </div>
          ${status ? `<span class="tag tag-${status==='On Target'?'green':'rust'}">${status==='On Target'?'on target':'off target'}</span>` : `<span class="tag tag-neutral">no data</span>`}
        </div>
      </button>
      ${open ? `<div style="border-top:1px solid var(--line2);padding:16px;">${renderMetricDetail(m, value)}</div>` : ''}
    </div>
  `;
}

function renderMetricDetail(m, value){
  const historyRows = (m.source==="manual" && m.history && m.history.length) ?
    [...m.history].sort((a,b)=>b.date.localeCompare(a.date)).map(h=>`
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;">
        <span>${h.date}</span><span>${h.value} ${esc(m.unit)}</span>
        <button class="x-btn" data-action="delete-reading" data-metric="${m.id}" data-reading="${h.id}">✕</button>
      </div>
    `).join('') : `<p class="muted-italic">No readings logged yet.</p>`;

  return `
    <div class="grid2" style="margin-bottom:12px;">
      ${m.source==="manual" ? `<label class="field" style="grid-column:1/-1;">Metric Name<input data-metric-field="${m.id}:name" value="${esc(m.name)}" /></label>` :
        `<div class="field" style="grid-column:1/-1;"><span>Metric Name</span><span style="font-size:14px;">${esc(m.name)} <span class="muted-italic" style="font-size:11px;">(auto-calculated from ${AUTO_METRIC_OPTIONS.find(o=>o.id===m.autoType)?.label || m.autoType})</span></span></div>`}
      <label class="field">Category<input data-metric-field="${m.id}:category" value="${esc(m.category)}" /></label>
      <label class="field">Unit<input data-metric-field="${m.id}:unit" value="${esc(m.unit)}" /></label>
      <label class="field">Target<input type="number" step="any" data-metric-field="${m.id}:target" value="${m.target}" /></label>
      <label class="field">Direction<select data-metric-field="${m.id}:direction"><option value="higher" ${m.direction==='higher'?'selected':''}>Higher is better</option><option value="lower" ${m.direction==='lower'?'selected':''}>Lower is better</option></select></label>
    </div>
    ${m.source==="manual" ? `
      <div class="card p4 top-border" style="margin-bottom:12px;">
        <h3 class="serif" style="font-size:15px;margin:0 0 10px;">Log a Reading</h3>
        <div class="grid3">
          <label class="field">Date<input type="date" id="reading-date-${m.id}" value="${today()}" /></label>
          <label class="field">Value<input type="number" step="any" id="reading-value-${m.id}" /></label>
          <button class="btn btn-primary" style="align-self:end;" data-action="add-reading" data-metric="${m.id}">+ Add Reading</button>
        </div>
        ${m.history && m.history.length>=2 ? `<div class="top-border"><canvas id="metric-chart-${m.id}" height="120"></canvas></div>` : ''}
        <div class="top-border">${historyRows}</div>
      </div>
    ` : `
      <div class="card p4 top-border" style="margin-bottom:12px;">
        <p class="muted-italic" style="font-size:13px;">Current value: <strong style="color:var(--ink);">${value===null?'no data yet':value+' '+esc(m.unit)}</strong> — recalculated live from your Audit Register / CAPA / Risk Register data.</p>
      </div>
    `}
    <div style="display:flex;justify-content:flex-end;">
      <button class="btn btn-danger" data-action="delete-metric" data-metric="${m.id}">Delete Metric</button>
    </div>
  `;
}

/* ---------- standalone checklists ---------- */
let showNewChecklist = false;
let openChecklistId = null;
let checklistTemplateFilter = "All";

let metricChartInstances = {};
function renderMetricCharts(){
  if(typeof Chart === 'undefined') return;
  state.metrics.forEach(m=>{
    if(metricChartInstances[m.id]){ metricChartInstances[m.id].destroy(); delete metricChartInstances[m.id]; }
    const canvas = document.getElementById(`metric-chart-${m.id}`);
    if(!canvas) return;
    const sorted = [...(m.history||[])].sort((a,b)=>a.date.localeCompare(b.date));
    const onTargetColor = "#3f6b2e";
    metricChartInstances[m.id] = new Chart(canvas, {
      type: 'line',
      data: {
        labels: sorted.map(h=>h.date),
        datasets: [
          { label: m.name, data: sorted.map(h=>h.value), borderColor:'#1c2b4a', backgroundColor:'rgba(28,43,74,.12)', fill:true, tension:.25 },
          { label: 'Target', data: sorted.map(()=>m.target), borderColor: onTargetColor, borderDash:[6,4], pointRadius:0, fill:false }
        ]
      },
      options: { plugins:{ legend:{ display:true, labels:{ boxWidth:12, font:{size:10} } } }, scales:{ y:{ beginAtZero:false }, x:{ grid:{display:false} } } }
    });
  });
}

function checklistScore(c){
  const items = (c.sections||[]).flatMap(s => s.items||[]).filter(i=>i.result==="Pass"||i.result==="Fail");
  return items.length===0 ? null : Math.round((items.filter(i=>i.result==="Pass").length/items.length)*100);
}

function destroyChart(key){
  if(chartInstances[key]){ chartInstances[key].destroy(); delete chartInstances[key]; }
}

function renderCharts(){
  if(typeof Chart === 'undefined'){ return; }
  const gridColor = darkMode ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
  const textColor = darkMode ? '#d8d3c6' : '#5c5540';
  Chart.defaults.color = textColor;
  Chart.defaults.borderColor = gridColor;

  /* Findings by severity (open only) */
  const openFindings = state.audits.flatMap(a=>a.findings).filter(f=>f.status!=="Closed");
  const sevCounts = ["Minor","Major","Critical"].map(s=>openFindings.filter(f=>f.severity===s).length);
  destroyChart('severity');
  const sevCtx = document.getElementById('chart-severity');
  if(sevCtx){
    chartInstances.severity = new Chart(sevCtx, {
      type: 'doughnut',
      data: { labels:["Minor","Major","Critical"], datasets:[{ data: sevCounts, backgroundColor:['#8a5a10','#9b3f28','#7a2c1a'] }] },
      options: { plugins:{ legend:{ position:'bottom' } }, maintainAspectRatio:true }
    });
  }

  /* CAPA ageing buckets (open findings with a due date) */
  const openWithDue = openFindings.filter(f=>f.dueDate);
  const buckets = { "Not overdue":0, "1–7 days":0, "8–30 days":0, "30+ days":0 };
  openWithDue.forEach(f=>{
    const overdueDays = -daysUntil(f.dueDate);
    if(overdueDays <= 0) buckets["Not overdue"]++;
    else if(overdueDays <= 7) buckets["1–7 days"]++;
    else if(overdueDays <= 30) buckets["8–30 days"]++;
    else buckets["30+ days"]++;
  });
  destroyChart('ageing');
  const ageingCtx = document.getElementById('chart-ageing');
  if(ageingCtx){
    chartInstances.ageing = new Chart(ageingCtx, {
      type: 'bar',
      data: { labels: Object.keys(buckets), datasets:[{ label:"Open CAPAs", data: Object.values(buckets), backgroundColor:'#9b3f28' }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 }, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Compliance trend across audits, ordered by date */
  const scoredAudits = state.audits
    .map(a=>({ label: a.auditNumber || a.title, date:a.date, score: scoreOf(a) }))
    .filter(a=>a.score!==null)
    .sort((x,y)=>x.date.localeCompare(y.date));
  destroyChart('trend');
  const trendCtx = document.getElementById('chart-trend');
  if(trendCtx){
    chartInstances.trend = new Chart(trendCtx, {
      type: 'line',
      data: { labels: scoredAudits.map(a=>a.label), datasets:[{ label:"Compliance %", data: scoredAudits.map(a=>a.score), borderColor:'#1c2b4a', backgroundColor:'rgba(28,43,74,.15)', fill:true, tension:.25 }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Audits by standard */
  const byStandard = {};
  state.audits.forEach(a=>{ byStandard[a.standard] = (byStandard[a.standard]||0)+1; });
  destroyChart('standards');
  const stdCtx = document.getElementById('chart-standards');
  if(stdCtx){
    chartInstances.standards = new Chart(stdCtx, {
      type: 'bar',
      data: { labels: Object.keys(byStandard), datasets:[{ label:"Audits", data: Object.values(byStandard), backgroundColor:'#3f6b2e' }] },
      options: { indexAxis:'y', plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, ticks:{ precision:0 }, grid:{color:gridColor} }, y:{ grid:{display:false} } } }
    });
  }
}

/* ---------- PDF audit report ---------- */
function buildMetricsPrintReport(){
  const CATEGORY_ORDER = ["Process","Customer","Food Safety","Manufacturing","Supply Chain","Safety","Engineering","Recall & Traceability"];
  const metrics = state.metrics;
  const withValues = metrics.map(m => ({ m, value: metricCurrentValue(m), status: metricStatus(m, metricCurrentValue(m)), prev: metricPreviousValue(m) }));
  const onTarget = withValues.filter(x=>x.status==="On Target").length;
  const offTarget = withValues.filter(x=>x.status==="Off Target").length;

  const categories = [...new Set(metrics.map(m=>m.category||"Other"))]
    .sort((a,b)=> CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b) || a.localeCompare(b));

  const sectionsHtml = categories.map(cat=>{
    const rows = withValues.filter(x=>(x.m.category||"Other")===cat).map(x=>{
      const trend = (x.value!==null && x.prev!==null) ? (Math.round((x.value-x.prev)*100)/100) : null;
      const statusColor = x.status==="On Target" ? "#3f6b2e" : (x.status==="Off Target" ? "#9b3f28" : "#8a8168");
      return `<tr>
        <td>${esc(x.m.name)}${x.m.critical?' <span style="color:#9b3f28;">⚠</span>':''}</td>
        <td>${x.value===null?'—':x.value+' '+esc(x.m.unit||'')}</td>
        <td>${x.m.target} ${esc(x.m.unit||'')}</td>
        <td style="color:${statusColor};font-weight:600;">${x.status||'No data'}</td>
        <td>${trend===null?'—':(trend>=0?'+':'')+trend}</td>
      </tr>`;
    }).join('');
    return `
      <div class="section-title">${esc(cat).toUpperCase()}</div>
      <table><thead><tr><th>Metric</th><th>Current</th><th>Target</th><th>Status</th><th>Trend</th></tr></thead>
      <tbody>${rows}</tbody></table>
    `;
  }).join('');

  const c = state.companySettings || {};
  const logoHtml = c.logoDataUrl
    ? `<img src="${c.logoDataUrl}" style="max-height:44px;max-width:120px;" />`
    : `<div style="width:40px;height:40px;border-radius:9px;background:#1c2b4a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:sans-serif;">AQ</div>`;
  const brandName = c.name ? esc(c.name) : "AuditQMS Pro Suite";

  document.getElementById('print-report').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      ${logoHtml}
      <div>
        <h1>Quality Tracking Report</h1>
        <div class="meta">${brandName} — Generated ${new Date().toLocaleString()}</div>
      </div>
    </div>
    <div class="meta" style="font-size:13px;margin-bottom:14px;">
      <strong>${metrics.length}</strong> metrics tracked &nbsp;·&nbsp; <strong style="color:#3f6b2e;">${onTarget}</strong> on target &nbsp;·&nbsp; <strong style="color:#9b3f28;">${offTarget}</strong> off target
    </div>
    ${sectionsHtml}
    <div style="margin-top:24px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#777;text-align:center;">
      Generated by AQMS Pro Suite ${APP_VERSION}
    </div>
  `;
}

        <tr><th>Audit Title</th><td colspan="3">${esc(a.title)}</td></tr>
        <tr><th>Department / Area</th><td>${esc(a.area)||'—'}</td><th>Auditor</th><td>${esc(a.auditor)||'—'}</td></tr>

/* ---------- event handling ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{ tab = el.dataset.nav; if(tab!=="audits") openAuditId=null; render(); });
  document.querySelectorAll('[data-jump-audit]').forEach(el=>el.onclick=()=>{
    jumpTo = el.dataset.jumpAudit; openAuditId = jumpTo; tab="audits";
    auditSearch = ""; auditStandardFilter = "All"; auditStatusFilter = "All"; auditRiskFilter = "All";
    render();
  });
  const toggleNew = document.querySelector('[data-action="toggle-new-audit"]'); if(toggleNew) toggleNew.onclick=()=>{ showNewAudit=!showNewAudit; render(); };
  const cancelNew = document.querySelector('[data-action="cancel-new-audit"]'); if(cancelNew) cancelNew.onclick=()=>{ showNewAudit=false; render(); };
  const createAudit = document.querySelector('[data-action="create-audit"]');
  if(createAudit) createAudit.onclick=()=>{
    const title = document.getElementById('na-title').value.trim();
    if(!title) return;
    const standard = document.getElementById('na-standard').value;
    const area = document.getElementById('na-area').value;
    const tmpl = TEMPLATES[standard];
    const sections = tmpl ? tmpl.map(s=>({name:s.name, items:[...s.items]})) : [{name:"General", items:[]}];
    state.auditSeq = (state.auditSeq||0) + 1;
    const auditNumber = formatAuditNumber(state.auditSeq, new Date().getFullYear());
    const a = seedAudit(title, standard, area, sections, auditNumber);
    state.audits.unshift(a);
    openAuditId = a.id; showNewAudit=false; persist(); render();
  };

  document.querySelectorAll('[data-toggle-audit]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggleAudit; openAuditId = openAuditId===id ? null : id; render();
  });

  document.querySelectorAll('[data-audit-field]').forEach(el=>{
    el.onchange = () => {
      const [id, field] = el.dataset.auditField.split(':');
      const a = state.audits.find(x=>x.id===id);
      const oldValue = a[field];
      a[field] = el.value;
      if((field==="status" || field==="riskLevel") && oldValue !== el.value){
        logHistory(a, `${field==="status"?"Status":"Risk level"} changed: ${oldValue} → ${el.value}`);
      }
      persist(); render();
    };
  });

  document.querySelectorAll('[data-action="delete-audit"]').forEach(el=>el.onclick=()=>{
    pendingDeleteAuditId = el.dataset.audit; render();
  });
  document.querySelectorAll('[data-action="cancel-delete-audit"]').forEach(el=>el.onclick=()=>{
    pendingDeleteAuditId = null; render();
  });
  const confirmDeleteBtn = document.querySelector('[data-action="confirm-delete-audit"]');
  if(confirmDeleteBtn) confirmDeleteBtn.onclick=()=>{
    state.audits = state.audits.filter(a=>a.id!==pendingDeleteAuditId);
    openAuditId=null; pendingDeleteAuditId=null; persist(); render();
  };

  const darkToggle = document.querySelector('[data-action="toggle-dark"]');
  if(darkToggle) darkToggle.onclick=()=>{
    darkMode = !darkMode; localStorage.setItem("aqms-dark", darkMode ? "true" : "false"); render();
  };

  document.querySelectorAll('[data-toggle-settings]').forEach(el=>el.onclick=()=>{
    const key = el.dataset.toggleSettings;
    settingsOpenSection = settingsOpenSection === key ? null : key;
    render();
  });

  document.querySelectorAll('[data-toggle-result]').forEach(el=>el.onclick=()=>{
    const [auditId, secId, itemId, val] = el.dataset.toggleResult.split(':');
    const a = state.audits.find(x=>x.id===auditId);
    const sec = a.sections.find(s=>s.id===secId);
    const item = sec.items.find(i=>i.id===itemId);
    item.result = item.result===val ? null : val;
    persist(); render();
  });

  document.querySelectorAll('[data-item-note]').forEach(el=>el.onchange=()=>{
    const [auditId, secId, itemId] = el.dataset.itemNote.split(':');
    const a = state.audits.find(x=>x.id===auditId);
    const sec = a.sections.find(s=>s.id===secId);
    const item = sec.items.find(i=>i.id===itemId);
    item.note = el.value; persist();
  });

  document.querySelectorAll('[data-item-photo]').forEach(el=>el.onchange=()=>{
    const file = el.files[0]; if(!file) return;
    const [auditId, secId, itemId] = el.dataset.itemPhoto.split(':');
    compressImageToDataURL(file, 1000, 0.7, (dataUrl) => {
      const a = state.audits.find(x=>x.id===auditId);
      const sec = a.sections.find(s=>s.id===secId);
      const item = sec.items.find(i=>i.id===itemId);
      item.photo = dataUrl; persist(); render();
    });
  });
  document.querySelectorAll('[data-action="remove-item-photo"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    const sec = a.sections.find(s=>s.id===el.dataset.section);
    const item = sec.items.find(i=>i.id===el.dataset.item);
    item.photo = null; persist(); render();
  });

  document.querySelectorAll('[data-action="remove-item"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    const sec = a.sections.find(s=>s.id===el.dataset.section);
    sec.items = sec.items.filter(i=>i.id!==el.dataset.item);
    persist(); render();
  });

  document.querySelectorAll('[data-action="add-item"]').forEach(el=>el.onclick=()=>{
    const input = document.querySelector(`[data-new-item="${el.dataset.audit}:${el.dataset.section}"]`);
    const text = input.value.trim(); if(!text) return;
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    const sec = a.sections.find(s=>s.id===el.dataset.section);
    sec.items.push({id:uid(), text, result:null, note:""});
    persist(); render();
  });

  document.querySelectorAll('[data-action="remove-section"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    a.sections = a.sections.filter(s=>s.id!==el.dataset.section);
    persist(); render();
  });

  document.querySelectorAll('[data-action="add-section"]').forEach(el=>el.onclick=()=>{
    const input = document.getElementById(`new-section-${el.dataset.audit}`);
    const name = input.value.trim(); if(!name) return;
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    a.sections.push({id:uid(), name, items:[]});
    persist(); render();
  });

  document.querySelectorAll('[data-action="remove-finding"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    a.findings = a.findings.filter(f=>f.id!==el.dataset.finding);
    persist(); render();
  });

  document.querySelectorAll('[data-set-finding-status]').forEach(el=>el.onclick=()=>{
    const [auditId, findingId, status] = el.dataset.setFindingStatus.split(':');
    const a = state.audits.find(x=>x.id===auditId);
    const f = a.findings.find(x=>x.id===findingId);
    if(f.status !== status) logHistory(a, `Finding "${f.desc.slice(0,50)}${f.desc.length>50?'…':''}" status: ${f.status} → ${status}`);
    f.status = status; persist(); render();
  });

  document.querySelectorAll('[data-action="add-finding"]').forEach(el=>el.onclick=()=>{
    const auditId = el.dataset.audit;
    const desc = document.getElementById(`nf-desc-${auditId}`).value.trim();
    if(!desc) return;
    const a = state.audits.find(x=>x.id===auditId);
    a.findings.push({
      id: uid(),
      clause: document.getElementById(`nf-clause-${auditId}`).value,
      category: document.getElementById(`nf-category-${auditId}`).value,
      desc,
      severity: document.getElementById(`nf-severity-${auditId}`).value,
      owner: document.getElementById(`nf-owner-${auditId}`).value,
      dueDate: document.getElementById(`nf-due-${auditId}`).value,
      actionText: document.getElementById(`nf-action-${auditId}`).value,
      status: "Open"
    });
    logHistory(a, `Finding logged: "${desc.slice(0,50)}${desc.length>50?'…':''}"`);
    persist(); render();
  });

  document.querySelectorAll('[data-capa-filter]').forEach(el=>el.onclick=()=>{
    capaFilter = el.dataset.capaFilter; render();
  });

  /* risk register */
  const toggleNewRisk = document.querySelector('[data-action="toggle-new-risk"]'); if(toggleNewRisk) toggleNewRisk.onclick=()=>{ showNewRisk=!showNewRisk; render(); };
  const cancelNewRisk = document.querySelector('[data-action="cancel-new-risk"]'); if(cancelNewRisk) cancelNewRisk.onclick=()=>{ showNewRisk=false; render(); };
  const createRisk = document.querySelector('[data-action="create-risk"]');
  if(createRisk) createRisk.onclick=()=>{
    const hazard = document.getElementById('nr-hazard').value.trim();
    if(!hazard) return;
    const likelihood = Number(document.getElementById('nr-likelihood').value);
    const severity = Number(document.getElementById('nr-severity').value);
    const riskScore = likelihood * severity;
    const risk = {
      id: uid(),
      refNo: document.getElementById('nr-ref').value,
      date: document.getElementById('nr-date').value || today(),
      area: document.getElementById('nr-area').value,
      hazard,
      riskTo: document.getElementById('nr-risk-to').value,
      controls: document.getElementById('nr-controls').value,
      likelihood, severity, riskScore, riskLevel: riskLevelFromScore(riskScore),
      action: document.getElementById('nr-action').value,
      owner: document.getElementById('nr-owner').value,
      dueDate: document.getElementById('nr-due').value,
      completedDate: "",
      status: "Open",
      residualLikelihood: "", residualSeverity: "", residualRiskScore: null, residualRiskLevel: null
    };
    state.riskAssessments.unshift(risk);
    openRiskId = risk.id; showNewRisk=false; persist(); render();
  };
  document.querySelectorAll('[data-toggle-risk]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggleRisk; openRiskId = openRiskId===id ? null : id; render();
  });
  document.querySelectorAll('[data-risk-filter]').forEach(el=>el.onclick=()=>{
    riskLevelFilter = el.dataset.riskFilter; render();
  });
  document.querySelectorAll('[data-risk-field]').forEach(el=>{
    el.onchange = () => {
      const [id, field] = el.dataset.riskField.split(':');
      const r = state.riskAssessments.find(x=>x.id===id);
      if(!r) return;
      if(field==="likelihood" || field==="severity"){
        r[field] = Number(el.value);
        r.riskScore = r.likelihood * r.severity;
        r.riskLevel = riskLevelFromScore(r.riskScore);
      } else if(field==="residualLikelihood" || field==="residualSeverity"){
        r[field] = el.value === "" ? "" : Number(el.value);
        if(r.residualLikelihood && r.residualSeverity){
          r.residualRiskScore = r.residualLikelihood * r.residualSeverity;
          r.residualRiskLevel = riskLevelFromScore(r.residualRiskScore);
        } else {
          r.residualRiskScore = null; r.residualRiskLevel = null;
        }
      } else {
        r[field] = el.value;
      }
      persist(); render();
    };
  });
  document.querySelectorAll('[data-action="delete-risk"]').forEach(el=>el.onclick=()=>{
    if(!confirm("Delete this risk assessment? This cannot be undone.")) return;
    state.riskAssessments = state.riskAssessments.filter(r=>r.id!==el.dataset.risk);
    openRiskId = null; persist(); render();
  });
  const riskCsvBtn = document.querySelector('[data-action="export-risk-csv"]');
  if(riskCsvBtn) riskCsvBtn.onclick=()=>{
    const headers = ["Ref No","Date","Area/Task","Hazard","Who/What at Risk","Existing Controls","Likelihood","Severity","Risk Score","Risk Level","Action Required","Responsible","Target Date","Status","Residual Risk Level"];
    const rows = state.riskAssessments.map(r=>[
      r.refNo||'', r.date, r.area||'', r.hazard, r.riskTo||'', r.controls||'', r.likelihood, r.severity, r.riskScore, r.riskLevel,
      r.action||'', r.owner||'', r.dueDate||'', r.status, r.residualRiskLevel||''
    ]);
    const csvEscape = (v) => `"${String(v).replace(/"/g,'""')}"`;
    const csv = [headers.map(csvEscape).join(','), ...rows.map(row=>row.map(csvEscape).join(','))].join('\n');
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `aqms-risk-register-${today()}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  /* Document Control */
  const toggleNewDocument = document.querySelector('[data-action="toggle-new-document"]'); if(toggleNewDocument) toggleNewDocument.onclick=()=>{ showNewDocument=!showNewDocument; render(); };
  const cancelNewDocument = document.querySelector('[data-action="cancel-new-document"]'); if(cancelNewDocument) cancelNewDocument.onclick=()=>{ showNewDocument=false; render(); };
  const createDocument = document.querySelector('[data-action="create-document"]');
  if(createDocument) createDocument.onclick=()=>{
    const title = document.getElementById('nd-title').value.trim();
    if(!title) return;
    const doc = {
      id: uid(),
      title,
      docNumber: document.getElementById('nd-number').value,
      category: document.getElementById('nd-category').value,
      version: document.getElementById('nd-version').value || "1",
      status: document.getElementById('nd-status').value,
      owner: document.getElementById('nd-owner').value,
      issueDate: document.getElementById('nd-issue-date').value || today(),
      reviewDate: document.getElementById('nd-review-date').value,
      notes: document.getElementById('nd-notes').value
    };
    state.documents.unshift(doc);
    openDocumentId = doc.id; showNewDocument=false; persist(); render();
  };
  document.querySelectorAll('[data-toggle-document]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggleDocument; openDocumentId = openDocumentId===id ? null : id; render();
  });
  document.querySelectorAll('[data-document-filter]').forEach(el=>el.onclick=()=>{
    documentStatusFilter = el.dataset.documentFilter; render();
  });
  document.querySelectorAll('[data-document-field]').forEach(el=>{
    el.onchange = () => {
      const [id, field] = el.dataset.documentField.split(':');
      const d = state.documents.find(x=>x.id===id);
      if(!d) return;
      d[field] = el.value;
      persist(); render();
    };
  });
  document.querySelectorAll('[data-action="delete-document"]').forEach(el=>el.onclick=()=>{
    if(!confirm("Delete this document record? This cannot be undone.")) return;
    state.documents = state.documents.filter(d=>d.id!==el.dataset.document);
    openDocumentId = null; persist(); render();
  });
  const documentsCsvBtn = document.querySelector('[data-action="export-documents-csv"]');
  if(documentsCsvBtn) documentsCsvBtn.onclick=()=>{
    const headers = ["Title","Document Number","Category","Version","Status","Owner","Issue Date","Next Review Date","Notes"];
    const rows = state.documents.map(d=>[d.title, d.docNumber||'', d.category||'', d.version||'', d.status, d.owner||'', d.issueDate||'', d.reviewDate||'', d.notes||'']);
    const csvEscape = (v) => `"${String(v).replace(/"/g,'""')}"`;
    const csv = [headers.map(csvEscape).join(','), ...rows.map(row=>row.map(csvEscape).join(','))].join('\n');
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `aqms-document-control-${today()}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  /* Training Matrix */
  const toggleNewTraining = document.querySelector('[data-action="toggle-new-training"]'); if(toggleNewTraining) toggleNewTraining.onclick=()=>{ showNewTraining=!showNewTraining; render(); };
  const cancelNewTraining = document.querySelector('[data-action="cancel-new-training"]'); if(cancelNewTraining) cancelNewTraining.onclick=()=>{ showNewTraining=false; render(); };
  const createTraining = document.querySelector('[data-action="create-training"]');
  if(createTraining) createTraining.onclick=()=>{
    const employeeName = document.getElementById('nt-employee').value.trim();
    const competency = document.getElementById('nt-competency').value.trim();
    if(!employeeName || !competency) return;
    const record = {
      id: uid(),
      employeeName,
      role: document.getElementById('nt-role').value,
      competency,
      trainedDate: document.getElementById('nt-trained-date').value || today(),
      expiryDate: document.getElementById('nt-expiry-date').value,
      certRef: document.getElementById('nt-cert-ref').value,
      notes: document.getElementById('nt-notes').value
    };
    state.trainingRecords.unshift(record);
    openTrainingId = record.id; showNewTraining=false; persist(); render();
  };
  document.querySelectorAll('[data-toggle-training]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggleTraining; openTrainingId = openTrainingId===id ? null : id; render();
  });
  document.querySelectorAll('[data-training-filter]').forEach(el=>el.onclick=()=>{
    trainingStatusFilter = el.dataset.trainingFilter; render();
  });
  document.querySelectorAll('[data-training-field]').forEach(el=>{
    el.onchange = () => {
      const [id, field] = el.dataset.trainingField.split(':');
      const t = state.trainingRecords.find(x=>x.id===id);
      if(!t) return;
      t[field] = el.value;

    };

  document.querySelectorAll('[data-action="delete-training"]').forEach(el=>el.onclick=()=>{

      correctiveAction: document.getElementById('nh-corrective').value,
      responsible: document.getElementById('nh-responsible').value,
      status: "Active", readings: []
    };

    openHaccpId = point.id; showNewHaccp=false; persist(); render();

  document.querySelectorAll('[data-toggle-haccp]').forEach(el=>el.onclick=()=>{

  if(csvBtn) csvBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    const headers = ["Audit Number","Audit Title","Department","Description","Severity","Owner","Due Date","CAPA","Status"];
    const rows = state.audits.flatMap(a=>a.findings.map(f=>[
      a.auditNumber||'', a.title, f.clause, f.desc, f.severity, f.owner||'', f.dueDate||'', f.actionText||'', f.status
    ]));
    const csvEscape = (v) => `"${String(v).replace(/"/g,'""')}"`;
    const csv = [headers.map(csvEscape).join(','), ...rows.map(r=>r.map(csvEscape).join(','))].join('\n');
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `aqms-findings-${today()}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };


  const backupBtn = document.querySelector('[data-action="open-backup"]');
  if(backupBtn) backupBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `aqms-backup-${today()}.json`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
    localStorage.setItem('aqms-last-backup', new Date().toLocaleString());
    render();
  };
  const restoreBtn = document.querySelector('[data-action="open-restore"]');
  const restoreFileInput = document.getElementById('restore-file-input');
  if(restoreBtn) restoreBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    restoreFileInput.click();
  };
  if(restoreFileInput) restoreFileInput.onchange=()=>{
    const file = restoreFileInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data.audits) throw new Error("Invalid backup file");
        if(!confirm("Restoring will replace all current audits with the backup file. Continue?")) { restoreFileInput.value = ""; return; }
        state = data; openAuditId=null; persist(); render();
      }catch(e){ alert("Could not read this file — please check it's a valid AQMS backup."); }
      restoreFileInput.value = "";
    };
    reader.readAsText(file);
  };

  /* PDF export (Pro gated) */
  document.querySelectorAll('[data-action="export-audit-pdf"]').forEach(el=>el.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    buildAuditPrintReport(a);
    window.print();
  });
}

render();

/* auto-save safety net — quietly persists every 5s in case a change slipped through */
setInterval(() => { saveStore(state); }, 5000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', function(){
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      });
    });
  });
}

function showUpdateBanner(){
  if(document.getElementById('update-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1c2b4a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:200;font-family:sans-serif;font-size:13px;gap:10px;';
  banner.innerHTML = '<span>A new version of AuditQMS Pro Suite is available.</span><button id="reload-app-btn" style="background:#fff;color:#1c2b4a;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;">Reload</button>';
  document.body.appendChild(banner);
  document.getElementById('reload-app-btn').onclick = () => window.location.reload();
}
</script>
</body>
</html>
