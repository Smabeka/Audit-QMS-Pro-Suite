  const printBadge = (label, tone) => {
    const c = PRINT_TONES[tone] || PRINT_TONES.navy;
    return `<span style="display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;color:${c.fg};background:${c.bg};">${esc(label)}</span>`;
  };
  const printPhoto = (dataUrl) => dataUrl
    ? `<img src="${dataUrl}" style="max-width:110px;max-height:110px;border-radius:4px;display:block;object-fit:cover;border:1px solid #ccc;" />`
    : '—';

  const ap = a.auditPlan || {};
  const hasPlanDetails = ap.organization || ap.visitNumber || ap.leadAuditor || ap.scope || (ap.itinerary && ap.itinerary.length);
  const auditPlanSection = hasPlanDetails ? `
    <div class="section-title">Audit Plan</div>
    <table>
      <tbody>
        <tr><th>Organization</th><td>${esc(ap.organization)||'—'}</td><th>Visit Number</th><td>${esc(ap.visitNumber)||'—'}</td></tr>
        <tr><th>Address</th><td colspan="3">${esc(ap.address)||'—'}</td></tr>
        <tr><th>Lead Auditor</th><td>${esc(ap.leadAuditor)||'—'}</td><th>Team Member(s)</th><td>${esc(ap.teamMembers)||'—'}</td></tr>
        <tr><th>Standard(s)</th><td>${esc(ap.standards)||'—'}</td><th>Audit Language</th><td>${esc(ap.auditLanguage)||'—'}</td></tr>
        <tr><th>Scope</th><td colspan="3">${esc(ap.scope)||'—'}</td></tr>
        <tr><th>Objectives</th><td colspan="3">${esc(ap.objectives)||'—'}</td></tr>
      </tbody>
    </table>
    ${(ap.itinerary && ap.itinerary.length) ? `
      <table><thead><tr><th>Date</th><th>Time</th><th>Auditor</th><th>Activity</th><th>Key Contact</th></tr></thead>
      <tbody>
        ${ap.itinerary.map(row=>`<tr><td>${esc(row.date)}</td><td>${esc(row.time)}</td><td>${esc(row.auditor)}</td><td>${esc(row.activity)}</td><td>${esc(row.keyContact)}</td></tr>`).join('')}
      </tbody></table>
    ` : ''}
  ` : '';

  const checklistRows = a.sections.map(sec => `
    <div class="section-title">${esc(sec.name)}</div>
    <table><thead><tr><th>Item</th><th>Result</th><th>Note</th><th>Photo</th></tr></thead>
    <tbody>
      ${sec.items.map(it=>`<tr><td>${esc(it.text)}</td><td>${it.result||'—'}</td><td>${esc(it.note)||''}</td><td>${printPhoto(it.photo)}</td></tr>`).join('')}
    </tbody></table>
  `).join('');

  const findingsRows = a.findings.length ? `
    <div class="section-title">Findings & CAPA</div>
    <table><thead><tr><th>Description</th><th>Department</th><th>Severity</th><th>Owner</th><th>Due</th><th>CAPA</th><th>Status</th><th>Photo</th></tr></thead>
    <tbody>
      ${a.findings.map(f=>`<tr><td>${esc(f.desc)}</td><td>${esc(f.clause)}</td><td>${printBadge(f.severity, sevTone[f.severity])}</td><td>${esc(f.owner)||'—'}</td><td>${f.dueDate||'—'}</td><td>${esc(f.actionText)||'—'}</td><td>${printBadge(f.status, statusTone[f.status])}</td><td>${printPhoto(f.photo)}</td></tr>`).join('')}
    </tbody></table>
  ` : `<div class="section-title">Findings & CAPA</div><p>No findings logged.</p>`;

  const c = state.companySettings || {};
  const logoHtml = c.logoDataUrl
    ? `<img src="${c.logoDataUrl}" style="max-height:44px;max-width:120px;" />`
    : `<div style="width:40px;height:40px;border-radius:9px;background:#1c2b4a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:sans-serif;">AQ</div>`;
  const brandName = c.name ? esc(c.name) : "AuditQMS Pro Suite";
  const brandAddress = c.address ? `<div class="meta">${esc(c.address)}${c.email?` &nbsp;·&nbsp; ${esc(c.email)}`:''}</div>` : (c.email ? `<div class="meta">${esc(c.email)}</div>` : '');

  document.getElementById('print-report').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      ${logoHtml}
      <div>
        <h1>${brandName}</h1>
        ${brandAddress}
        <div class="meta">Audit Report — Generated ${new Date().toLocaleString()}</div>
      </div>
    </div>
    <table>
      <tbody>
        <tr><th>Audit Number</th><td>${esc(a.auditNumber)||'—'}</td><th>Standard</th><td>${esc(a.standard)}</td></tr>
        <tr><th>Audit Title</th><td colspan="3">${esc(a.title)}</td></tr>
        <tr><th>Department / Area</th><td>${esc(a.area)||'—'}</td><th>Auditor</th><td>${esc(a.auditor)||'—'}</td></tr>
        <tr><th>Auditee</th><td colspan="3">${esc(a.auditee)||'—'}</td></tr>
        <tr><th>Date</th><td>${a.date}</td><th>Status</th><td>${a.status}</td></tr>
        <tr><th>Compliance Score</th><td colspan="3">${score!==null? score+'%' : 'Not yet scored'}</td></tr>
      </tbody>
    </table>
    ${auditPlanSection}
    ${checklistRows}
    ${findingsRows}
    <div class="sig-row">
      <div class="sig-line">${a.signOff && a.signOff.auditorSignedAt
        ? `Auditor Signature: <strong>${esc(a.signOff.auditorName)}</strong> — signed electronically ${new Date(a.signOff.auditorSignedAt).toLocaleString()}`
        : `Auditor Signature &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Date: ______________`}</div>
      <div class="sig-line">${a.signOff && a.signOff.approverSignedAt
        ? `Approval Signature: <strong>${esc(a.signOff.approverName)}</strong> — signed electronically ${new Date(a.signOff.approverSignedAt).toLocaleString()}`
        : `Approval Signature &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Date: ______________`}</div>
    </div>
    <div style="margin-top:24px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#777;text-align:center;">
      ${c.footerText ? esc(c.footerText) + ' &nbsp;·&nbsp; ' : ''}${a.auditNumber?esc(a.auditNumber)+' &nbsp;·&nbsp; ':''}Generated by AuditQMS Pro Suite ${APP_VERSION}
    </div>
  `;
}

/* ---------- event handling ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-quick-action]').forEach(el=>el.onclick=()=>{
    const action = el.dataset.quickAction;
    if(action==="new-audit"){ tab="audits"; showNewAudit=true; }
    else if(action==="raise-capa"){ tab="capa"; }
    else if(action==="report-incident"){ tab="foodsafe"; foodsafeSubTab="ncr"; showNewNcr=true; }
    else if(action==="add-risk"){ tab="risk"; showNewRisk=true; }
    else if(action==="upload-document"){ tab="documents"; showNewDocument=true; }
    navGroupOpen = null; navSubGroupOpen = null;
    render();
  });
  const toggleNavMenu = document.querySelector('[data-action="toggle-nav-menu"]');
  if(toggleNavMenu) toggleNavMenu.onclick=()=>{ navMenuOpen = !navMenuOpen; render(); };
  const breadcrumbBackBtn = document.querySelector('[data-action="breadcrumb-back"]');
  if(breadcrumbBackBtn) breadcrumbBackBtn.onclick=()=>{ clearOpenDetailViews(); render(); };
  document.querySelectorAll('[data-navid]').forEach(el=>el.onclick=()=>{
    navHandleClick(el.dataset.navid);
    clearOpenDetailViews();
    render();
  });

  /* Executive Summary — COPQ & CSAT quick log */
  const toggleCopq = document.querySelector('[data-action="toggle-copq-form"]');
  if(toggleCopq) toggleCopq.onclick=()=>{ dashShowCopqForm=!dashShowCopqForm; render(); };
  const createCopq = document.querySelector('[data-action="create-copq"]');
  if(createCopq) createCopq.onclick=()=>{
    const amount = parseFloat(document.getElementById('copq-amount').value);
    if(!amount || amount<=0) return;
    state.copqEntries.unshift({
      id: uid(),
      date: document.getElementById('copq-date').value || today(),
      category: document.getElementById('copq-category').value,
      description: document.getElementById('copq-desc').value,
      amount
    });
    dashShowCopqForm=false; persist(); render();
  };
  document.querySelectorAll('[data-delete-copq]').forEach(el=>el.onclick=()=>{
    state.copqEntries = state.copqEntries.filter(e=>e.id!==el.dataset.deleteCopq);
    persist(); render();
  });
  const toggleCsat = document.querySelector('[data-action="toggle-csat-form"]');
  if(toggleCsat) toggleCsat.onclick=()=>{ dashShowCsatForm=!dashShowCsatForm; render(); };
  const createCsat = document.querySelector('[data-action="create-csat"]');
  if(createCsat) createCsat.onclick=()=>{
    state.csatEntries.unshift({
      id: uid(),
      date: document.getElementById('csat-date').value || today(),
      customer: document.getElementById('csat-customer').value,
      score: parseInt(document.getElementById('csat-score').value, 10),
      comments: document.getElementById('csat-comments').value
    });
    dashShowCsatForm=false; persist(); render();
  };
  document.querySelectorAll('[data-delete-csat]').forEach(el=>el.onclick=()=>{
    state.csatEntries = state.csatEntries.filter(e=>e.id!==el.dataset.deleteCsat);
    persist(); render();
  });

  /* Generic CRUD log modules */
  document.querySelectorAll('[data-generic-new]').forEach(el=>el.onclick=()=>{
    genericShowNew[el.dataset.genericNew] = true; render();
  });
  document.querySelectorAll('[data-generic-cancel]').forEach(el=>el.onclick=()=>{
    genericShowNew[el.dataset.genericCancel] = false; render();
  });
  document.querySelectorAll('[data-generic-trends]').forEach(el=>el.onclick=()=>{
    const k = el.dataset.genericTrends;
    genericShowTrends[k] = !genericShowTrends[k];
    render();
  });
  document.querySelectorAll('[data-generic-create]').forEach(el=>el.onclick=()=>{
    const k = el.dataset.genericCreate;
    const cfg = GENERIC_MODULES.find(m=>m.key===k);
    if(!cfg) return;
    const record = { id: uid() };
    let valid = true;
    cfg.fields.filter(f=>!f.hidden).forEach(f=>{
      if(f.type==='checkboxes'){
        const checked = [...document.querySelectorAll(`input[name="cb-new::${k}::${f.id}"]:checked`)].map(c=>c.value);
        record[f.id] = checked.join(', ');
        return;
      }
      const inputEl = document.getElementById(`gn-${k}-${f.id}`);
      const v = inputEl ? inputEl.value : '';
      if(f.required && !v.trim()) valid = false;
      record[f.id] = v;
    });
    if(cfg.presetValues) Object.assign(record, cfg.presetValues);
    if(!valid) return;
    state[cfg.stateArr].unshift(record);
    genericShowNew[k] = false; genericOpenId[k] = record.id;
    persist(); render();
  });
  document.querySelectorAll('[data-generic-toggle]').forEach(el=>el.onclick=()=>{
    const [k,id] = el.dataset.genericToggle.split(':');
    genericOpenId[k] = genericOpenId[k]===id ? null : id;
    render();
  });
  document.querySelectorAll('[data-generic-field]').forEach(el=>{
    el.onchange = () => {
      const [k,id,field] = el.dataset.genericField.split(':');
      const cfg = GENERIC_MODULES.find(m=>m.key===k);
      if(!cfg) return;
      const rec = state[cfg.stateArr].find(x=>x.id===id);
      if(!rec) return;
      rec[field] = el.value;
      persist(); render();
    };
  });
  document.querySelectorAll('input[type="checkbox"][name^="cb-edit::"]').forEach(el=>{
    el.onchange = () => {
      const parts = el.name.split('::');
      const k = parts[1], recId = parts[2], fieldId = parts[3];
      const cfg = GENERIC_MODULES.find(m=>m.key===k);
      if(!cfg) return;
      const rec = state[cfg.stateArr].find(x=>x.id===recId);
      if(!rec) return;
      const checked = [...document.querySelectorAll(`input[name="${el.name}"]:checked`)].map(c=>c.value);
      rec[fieldId] = checked.join(', ');
      persist(); render();
    };
  });
  document.querySelectorAll('[data-generic-delete]').forEach(el=>el.onclick=()=>{
    const [k,id] = el.dataset.genericDelete.split(':');
    const cfg = GENERIC_MODULES.find(m=>m.key===k);
    if(!cfg) return;
    state[cfg.stateArr] = state[cfg.stateArr].filter(x=>x.id!==id);
    genericOpenId[k] = null;
    persist(); render();
  });
  document.querySelectorAll('[data-generic-csv]').forEach(el=>el.onclick=()=>{
    const k = el.dataset.genericCsv;
    const cfg = GENERIC_MODULES.find(m=>m.key===k);
    if(!cfg) return;
    const rawArr = state[cfg.stateArr] || [];
    const arr = cfg.filterFn ? rawArr.filter(cfg.filterFn) : rawArr;
    const rows = arr.map(r=>cfg.fields.map(f=>r[f.id]??''));
    downloadCsv(cfg.fields.map(f=>f.label), rows, `${cfg.key}.csv`);
  });

  /* Lot History */
  const lotSearchInput = document.getElementById('lot-history-search');
  if(lotSearchInput) lotSearchInput.oninput = () => { lotHistorySearch = lotSearchInput.value; render(); };
  document.querySelectorAll('[data-jump-batch]').forEach(el=>el.onclick=()=>{
    tab="traceability"; batchTypeFilter="All"; batchSearch=""; openBatchId = el.dataset.jumpBatch; render();
  });
  const exportLotHistory = document.querySelector('[data-action="export-lot-history-csv"]');
  if(exportLotHistory) exportLotHistory.onclick=()=>{
    const rows = state.batches.map(b=>[b.product,b.batchNo,b.type,b.status,b.received||'',b.expiry||'',b.supplier||'',b.qty??'',b.unit||'']);
    downloadCsv(["Product","Batch/Lot No","Type","Status","Received","Expiry","Supplier","Qty","Unit"], rows, "lot-history.csv");
  };

  document.querySelectorAll('[data-jump-audit]').forEach(el=>el.onclick=()=>{
    jumpTo = el.dataset.jumpAudit; openAuditId = jumpTo; tab="audits";
    auditSearch = ""; auditStandardFilter = "All"; auditStatusFilter = "All"; auditRiskFilter = "All";
    render();
  });
  const toggleNew = document.querySelector('[data-action="toggle-new-audit"]'); if(toggleNew) toggleNew.onclick=()=>{ showNewAudit=!showNewAudit; render(); };
  const cancelNew = document.querySelector('[data-action="cancel-new-audit"]'); if(cancelNew) cancelNew.onclick=()=>{ showNewAudit=false; render(); };
  const createAudit = document.querySelector('[data-action="create-audit"]');
  if(createAudit) createAudit.onclick=()=>{
    const title = document.getElementById('na-title').value.trim();
    if(!title) return;
    const standard = document.getElementById('na-standard').value;
    const area = document.getElementById('na-area').value;
    const auditType = document.getElementById('na-audit-type').value;
    const tmpl = TEMPLATES[standard];
    const sections = tmpl ? tmpl.map(s=>({name:s.name, items:[...s.items]})) : [{name:"General", items:[]}];
    state.auditSeq = (state.auditSeq||0) + 1;
    const auditNumber = formatAuditNumber(state.auditSeq, new Date().getFullYear());
    const a = seedAudit(title, standard, area, sections, auditNumber, auditType);
    state.audits.unshift(a);
    logActivity(`Audit "${title}" started`);
    openAuditId = a.id; showNewAudit=false; persist(); render();
  };

  document.querySelectorAll('[data-toggle-audit]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggleAudit; openAuditId = openAuditId===id ? null : id; render();
  });

  document.querySelectorAll('[data-audit-field]').forEach(el=>{
    el.onchange = () => {
      const [id, field] = el.dataset.auditField.split(':');
      const a = state.audits.find(x=>x.id===id);
      const oldValue = a[field];
      a[field] = el.value;
      if((field==="status" || field==="riskLevel") && oldValue !== el.value){
        logHistory(a, `${field==="status"?"Status":"Risk level"} changed: ${oldValue} → ${el.value}`);
      }
      persist(); render();
    };
  });

  document.querySelectorAll('[data-action="delete-audit"]').forEach(el=>el.onclick=()=>{
    pendingDeleteAuditId = el.dataset.audit; render();
  });
  document.querySelectorAll('[data-action="toggle-audit-plan"]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.audit; auditPlanOpenIds[id] = !auditPlanOpenIds[id]; render();
  });
  document.querySelectorAll('[data-audit-plan-field]').forEach(el=>{
    el.onchange = () => {
      const [id, field] = el.dataset.auditPlanField.split(':');
      const a = state.audits.find(x=>x.id===id);
      if(!a.auditPlan){ a.auditPlan = { organization:"", address:"", visitNumber:"", leadAuditor:"", teamMembers:"", standards:"", auditLanguage:"English", scope:"", objectives:"", itinerary: [] }; }
      a.auditPlan[field] = el.value;
      persist();
    };
  });
  document.querySelectorAll('[data-itinerary-field]').forEach(el=>{
    el.onchange = () => {
      const [auditId, idx, field] = el.dataset.itineraryField.split(':');
      const a = state.audits.find(x=>x.id===auditId);
      if(a.auditPlan && a.auditPlan.itinerary && a.auditPlan.itinerary[idx]){
        a.auditPlan.itinerary[idx][field] = el.value;
        persist();
      }
    };
  });
  document.querySelectorAll('[data-action="add-itinerary-row"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    if(!a.auditPlan) a.auditPlan = { organization:"", address:"", visitNumber:"", leadAuditor:"", teamMembers:"", standards:"", auditLanguage:"English", scope:"", objectives:"", itinerary: [] };
    if(!a.auditPlan.itinerary) a.auditPlan.itinerary = [];
    a.auditPlan.itinerary.push({ date:"", time:"", auditor:"", activity:"", keyContact:"" });
    persist(); render();
  });
  document.querySelectorAll('[data-action="remove-itinerary-row"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    const idx = parseInt(el.dataset.row, 10);
    if(a.auditPlan && a.auditPlan.itinerary){ a.auditPlan.itinerary.splice(idx, 1); persist(); render(); }
  });
  document.querySelectorAll('[data-action="sign-audit"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    if(!a) return;
    const role = el.dataset.role; // "auditor" | "approver"
    const input = document.getElementById(role==="auditor" ? `sign-auditor-${a.id}` : `sign-approver-${a.id}`);
    const name = (input && input.value || "").trim();
    if(!name){ alert("Please type your full name to sign."); return; }
    if(!a.signOff){ a.signOff = { auditorName:"", auditorSignedAt:null, approverName:"", approverSignedAt:null }; }
    if(role==="auditor"){
      a.signOff.auditorName = name; a.signOff.auditorSignedAt = new Date().toISOString();
      logHistory(a, `Signed off by auditor: ${name}`);
    } else {
      a.signOff.approverName = name; a.signOff.approverSignedAt = new Date().toISOString();
      logHistory(a, `Approved and signed off: ${name}`);
    }
    persist(); render();
  });
  document.querySelectorAll('[data-action="unsign-audit"]').forEach(el=>el.onclick=()=>{
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    if(!a || !a.signOff) return;
    const role = el.dataset.role;
    if(!confirm("Unsigning will re-open this audit for editing. Continue?")) return;
    if(role==="auditor"){
      logHistory(a, `Auditor sign-off revoked (was: ${a.signOff.auditorName})`);
      a.signOff.auditorName = ""; a.signOff.auditorSignedAt = null;
      // revoking the auditor signature also revokes approval, since approval depended on the locked record
      if(a.signOff.approverSignedAt){ a.signOff.approverName = ""; a.signOff.approverSignedAt = null; }
    } else {
      logHistory(a, `Approval sign-off revoked (was: ${a.signOff.approverName})`);
      a.signOff.approverName = ""; a.signOff.approverSignedAt = null;
    }
    persist(); render();
  });
  document.querySelectorAll('[data-action="cancel-delete-audit"]').forEach(el=>el.onclick=()=>{
    pendingDeleteAuditId = null; render();
  });
  const confirmDeleteBtn = document.querySelector('[data-action="confirm-delete-audit"]');
  if(confirmDeleteBtn) confirmDeleteBtn.onclick=()=>{
    state.audits = state.audits.filter(a=>a.id!==pendingDeleteAuditId);
    openAuditId=null; pendingDeleteAuditId=null; persist(); render();
  };

  const darkToggle = document.querySelector('[data-action="toggle-dark"]');
  if(darkToggle) darkToggle.onclick=()=>{
    darkMode = !darkMode; localStorage.setItem("aqms-dark", darkMode ? "true" : "false"); render();
  };

  document.querySelectorAll('[data-toggle-settings]').forEach(el=>el.onclick=()=>{
    const key = el.dataset.toggleSettings;
    settingsOpenSection = settingsOpenSection === key ? null : key;
    render();
  });

  document.querySelectorAll('[data-toggle-result]').forEach(el=>el.onclick=()=>{
    const [auditId, secId, itemId, val] = el.dataset.toggleResult.split(':');
    const a = state.audits.find(x=>x.id===auditId);
    const sec = a.sections.find(s=>s.id===secId);
    const item = sec.items.find(i=>i.id===itemId);
    item.result = item.result===val ? null : val;
    if(item.result==="Fail"){
      const existing = item.linkedFindingId && a.findings.find(f=>f.id===item.linkedFindingId);
      if(!existing){
        const finding = {
          id: uid(),
          clause: sec.name,
          category: a.standard || "",
          desc: item.text + (item.note ? ` — ${item.note}` : ""),
          severity: "Medium",
          owner: "",
          dueDate: "",
          actionText: "",
          status: "Open",
          autoGenerated: true,
          sourceItemId: item.id
        };
        a.findings.push(finding);
        item.linkedFindingId = finding.id;
        logHistory(a, `CAPA auto-generated from failed checklist item: "${item.text.slice(0,50)}${item.text.length>50?'…':''}"`);
        logActivity(`CAPA auto-generated from "${a.title}"`);
      }
    }
    persist(); render();
  });

  document.querySelectorAll('[data-item-note]').forEach(el=>el.onchange=()=>{
    const [auditId, secId, itemId] = el.dataset.itemNote.split(':');
    const a = state.audits.find(x=>x.id===auditId);
    const sec = a.sections.find(s=>s.id===secId);
    const item = sec.items.find(i=>i.id===itemId);
    item.note = el.value; persist();
  });

  document.querySelectorAll('[data-item-photo]').forEach(el=>el.onchange=()=>{
    const file = el.files[0]; if(!file) return;
    const [auditId, secId, itemId] = el.dataset.itemPhoto.split(':');
    compressImageToDataURL(file, 1000, 0.7, (dataUrl) => {
      const a = state.audits.find(x=>x.id===auditId);
      const sec = a.sections.find(s=>s.id===secId);
      const item = sec.items.find(i=>i.id===itemId);
      item.photo = dataUrl; persist(); render();
    });
  });
  document.querySelectorAll('[data-finding-photo]').forEach(el=>el.onchange=()=>{
    const file = el.files[0]; if(!file) return;
    const [auditId, findingId] = el.dataset.findingPhoto.split(':');

      if(!r) return;
      if(field==="likelihood" || field==="severity"){
        r[field] = Number(el.value);
        r.riskScore = r.likelihood * r.severity;
        r.riskLevel = riskLevelFromScore(r.riskScore);
      } else if(field==="residualLikelihood" || field==="residualSeverity"){
        r[field] = el.value === "" ? "" : Number(el.value);
        if(r.residualLikelihood && r.residualSeverity){
          r.residualRiskScore = r.residualLikelihood * r.residualSeverity;
          r.residualRiskLevel = riskLevelFromScore(r.residualRiskScore);
        } else {
          r.residualRiskScore = null; r.residualRiskLevel = null;
        }
      } else {
        r[field] = el.value;

    state.haccpChecklistLogs.unshift({ id: uid(), date: today(), checkedBy, results });
    haccpChecklistAnswers = {};
    persist(); render();
  };

  /* FoodSafe Non-Conformances */
  const toggleNewNcr = document.querySelector('[data-action="toggle-new-ncr"]'); if(toggleNewNcr) toggleNewNcr.onclick=()=>{ showNewNcr=!showNewNcr; render(); };
  const cancelNewNcr = document.querySelector('[data-action="cancel-new-ncr"]'); if(cancelNewNcr) cancelNewNcr.onclick=()=>{ showNewNcr=false; render(); };
  const createNcr = document.querySelector('[data-action="create-ncr"]');
  if(createNcr) createNcr.onclick=()=>{
    const description = document.getElementById('ncr-description').value.trim();
    if(!description) return;
    const ncr = {
      id: uid(),
      date: document.getElementById('ncr-date').value || today(),
      product: document.getElementById('ncr-product').value,
      description,
      severity: document.getElementById('ncr-severity').value,
      status: document.getElementById('ncr-status').value
    };
    state.foodsafeNcrs.unshift(ncr);
    showNewNcr=false; persist(); render();
  };
  document.querySelectorAll('[data-toggle-ncr]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggleNcr; openNcrId = openNcrId===id ? null : id; render();
  });
  document.querySelectorAll('[data-ncr-field]').forEach(el=>{
    el.onchange = () => {
      const [id, field] = el.dataset.ncrField.split(':');
      const n = state.foodsafeNcrs.find(x=>x.id===id);
      if(!n) return;
      n[field] = el.value;
      persist(); render();
    };
  });
  document.querySelectorAll('[data-action="delete-ncr"]').forEach(el=>el.onclick=()=>{
    if(!confirm("Delete this non-conformance record?")) return;
    state.foodsafeNcrs = state.foodsafeNcrs.filter(n=>n.id!==el.dataset.ncr);
    openNcrId = null; persist(); render();
  });

  /* KPI metrics */
  const toggleNewMetric = document.querySelector('[data-action="toggle-new-metric"]'); if(toggleNewMetric) toggleNewMetric.onclick=()=>{ showNewMetric=!showNewMetric; metricSourceChoice="manual"; metricAutoTypeChoice=AUTO_METRIC_OPTIONS[0].id; render(); };
  const cancelNewMetric = document.querySelector('[data-action="cancel-new-metric"]'); if(cancelNewMetric) cancelNewMetric.onclick=()=>{ showNewMetric=false; render(); };
  document.querySelectorAll('[data-metric-source]').forEach(el=>el.onclick=()=>{ metricSourceChoice = el.dataset.metricSource; render(); });
  const autoTypeSelect = document.getElementById('nm-auto-type');
  if(autoTypeSelect) autoTypeSelect.onchange = () => { metricAutoTypeChoice = autoTypeSelect.value; render(); };
  const createMetric = document.querySelector('[data-action="create-metric"]');
  if(createMetric) createMetric.onclick=()=>{
    const target = Number(document.getElementById('nm-target').value);
    if(Number.isNaN(target)) return;
    let name, autoType = null, source = metricSourceChoice, unit, direction;
    if(source==="auto"){
      const selectedAuto = AUTO_METRIC_OPTIONS.find(o=>o.id===metricAutoTypeChoice) || AUTO_METRIC_OPTIONS[0];
      autoType = selectedAuto.id;
      name = selectedAuto.label;
      unit = selectedAuto.unit;
      direction = selectedAuto.direction;
    } else {
      name = document.getElementById('nm-name').value.trim();
      if(!name) return;
      unit = document.getElementById('nm-unit').value;
      direction = document.getElementById('nm-direction').value;
    }
    const existingNames = new Set(state.metrics.map(m=>m.name));
    if(existingNames.has(name)){ alert(`A metric named "${name}" already exists. Edit the existing one instead of creating a duplicate.`); return; }
    const metric = {
      id: uid(), name, category: document.getElementById('nm-category').value,
      unit, target,
      direction,
      critical: document.getElementById('nm-critical').checked,
      source, autoType, history: []
    };
    state.metrics.unshift(metric);
    openMetricId = metric.id; showNewMetric=false; persist(); render();
  };
  document.querySelectorAll('[data-toggle-metric]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggleMetric; openMetricId = openMetricId===id ? null : id; render();
  });
  document.querySelectorAll('[data-metric-field]').forEach(el=>{
    el.onchange = () => {
      const [id, field] = el.dataset.metricField.split(':');
      const m = state.metrics.find(x=>x.id===id);
      if(!m) return;
      m[field] = field==="target" ? Number(el.value) : el.value;
      persist(); render();
    };
  });
  document.querySelectorAll('[data-action="add-reading"]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.metric;
    const m = state.metrics.find(x=>x.id===id);
    if(!m) return;
    const date = document.getElementById(`reading-date-${id}`).value || today();
    const value = Number(document.getElementById(`reading-value-${id}`).value);
    if(Number.isNaN(value)) return;
    m.history.push({ id: uid(), date, value });
    persist(); render();
  });
  document.querySelectorAll('[data-action="delete-reading"]').forEach(el=>el.onclick=()=>{
    const m = state.metrics.find(x=>x.id===el.dataset.metric);
    if(!m) return;
    m.history = m.history.filter(h=>h.id!==el.dataset.reading);
    persist(); render();
  });
  document.querySelectorAll('[data-action="delete-metric"]').forEach(el=>el.onclick=()=>{
    if(!confirm("Delete this metric? This cannot be undone.")) return;
    state.metrics = state.metrics.filter(m=>m.id!==el.dataset.metric);
    openMetricId = null; persist(); render();
  });
  const seedMetricsBtn = document.querySelector('[data-action="seed-sample-metrics"]');
  if(seedMetricsBtn) seedMetricsBtn.onclick=()=>{
    const added = seedSampleMetrics();
    if(added>0){
      persist(); render();
      alert(`${added} new sample metric${added===1?'':'s'} added.`);
      return;
    }
    // Nothing new to add — every sample metric already exists. Offer to reset just the samples.
    if(!confirm(`All sample metrics are already loaded. Reset them to their default values?\n\nThis only affects the 23 sample metrics — any custom metrics you've added, and everything else in the app (audits, checklists, documents, training, HACCP, recalls), are untouched.`)) return;
    const sampleNames = new Set(SAMPLE_KPI_METRICS.map(sm=>sm.name));
    state.metrics = state.metrics.filter(m=>!sampleNames.has(m.name));
    seedSampleMetrics();
    persist(); render();
    alert("Sample metrics reset to defaults.");
  };
  const metricsPdfBtn = document.querySelector('[data-action="export-metrics-pdf"]');
  if(metricsPdfBtn) metricsPdfBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    buildMetricsPrintReport();
    window.print();
  };
  const metricsCsvBtn = document.querySelector('[data-action="export-metrics-csv"]');
  if(metricsCsvBtn) metricsCsvBtn.onclick=()=>{
    const headers = ["Name","Category","Source","Unit","Target","Direction","Critical","Current Value","Status"];
    const rows = state.metrics.map(m=>{
      const value = metricCurrentValue(m);
      return [m.name, m.category||'', m.source, m.unit||'', m.target, m.direction, m.critical?"Yes":"No", value===null?'':value, metricStatus(m,value)||''];
    });
    const csvEscape = (v) => `"${String(v).replace(/"/g,'""')}"`;
    const csv = [headers.map(csvEscape).join(','), ...rows.map(row=>row.map(csvEscape).join(','))].join('\n');
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `aqms-kpi-metrics-${today()}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  /* standalone checklists */
  const toggleNewChecklist = document.querySelector('[data-action="toggle-new-checklist"]'); if(toggleNewChecklist) toggleNewChecklist.onclick=()=>{ showNewChecklist=!showNewChecklist; render(); };
  const cancelNewChecklist = document.querySelector('[data-action="cancel-new-checklist"]'); if(cancelNewChecklist) cancelNewChecklist.onclick=()=>{ showNewChecklist=false; render(); };
  const createChecklist = document.querySelector('[data-action="create-checklist"]');
  if(createChecklist) createChecklist.onclick=()=>{
    const template = document.getElementById('nc-template').value;
    const tmpl = TEMPLATES[template];
    const sections = (tmpl || [{name:"General", items:[]}]).map(s=>({ id: uid(), name: s.name, items: s.items.map(text=>({id:uid(), text, result:null, note:""})) }));
    const c = {
      id: uid(), template,
      location: document.getElementById('nc-location').value,
      inspector: document.getElementById('nc-inspector').value,
      date: document.getElementById('nc-date').value || today(),
      sections
    };
    state.checklists.unshift(c);
    openChecklistId = c.id; showNewChecklist=false; persist(); render();
  };
  const checklistTemplateFilterEl = document.getElementById('checklist-filter-template');
  if(checklistTemplateFilterEl) checklistTemplateFilterEl.onchange = ()=>{ checklistTemplateFilter = checklistTemplateFilterEl.value; render(); };
  document.querySelectorAll('[data-toggle-checklist]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggleChecklist; openChecklistId = openChecklistId===id ? null : id; render();
  });
  document.querySelectorAll('[data-checklist-field]').forEach(el=>{
    el.onchange = () => {
      const [id, field] = el.dataset.checklistField.split(':');
      const c = state.checklists.find(x=>x.id===id);
      if(!c) return;
      c[field] = el.value; persist(); render();
    };
  });
  document.querySelectorAll('[data-toggle-checklist-result]').forEach(el=>el.onclick=()=>{
    const [checklistId, secId, itemId, val] = el.dataset.toggleChecklistResult.split(':');
    const c = state.checklists.find(x=>x.id===checklistId);
    const sec = c.sections.find(s=>s.id===secId);
    const item = sec.items.find(i=>i.id===itemId);
    item.result = item.result===val ? null : val;
    persist(); render();
  });
  document.querySelectorAll('[data-checklist-item-note]').forEach(el=>el.onchange=()=>{
    const [checklistId, secId, itemId] = el.dataset.checklistItemNote.split(':');
    const c = state.checklists.find(x=>x.id===checklistId);
    const sec = c.sections.find(s=>s.id===secId);
    const item = sec.items.find(i=>i.id===itemId);
    item.note = el.value; persist();
  });
  document.querySelectorAll('[data-checklist-item-photo]').forEach(el=>el.onchange=()=>{
    const file = el.files[0]; if(!file) return;
    const [checklistId, secId, itemId] = el.dataset.checklistItemPhoto.split(':');
    compressImageToDataURL(file, 1000, 0.7, (dataUrl) => {
      const c = state.checklists.find(x=>x.id===checklistId);
      const sec = c.sections.find(s=>s.id===secId);
      const item = sec.items.find(i=>i.id===itemId);
      item.photo = dataUrl; persist(); render();
    });
  });
  document.querySelectorAll('[data-action="remove-checklist-item-photo"]').forEach(el=>el.onclick=()=>{
    const c = state.checklists.find(x=>x.id===el.dataset.checklist);
    const sec = c.sections.find(s=>s.id===el.dataset.section);
    const item = sec.items.find(i=>i.id===el.dataset.item);
    item.photo = null; persist(); render();
  });
  document.querySelectorAll('[data-action="delete-checklist"]').forEach(el=>el.onclick=()=>{
    if(!confirm("Delete this checklist? This cannot be undone.")) return;
    state.checklists = state.checklists.filter(c=>c.id!==el.dataset.checklist);
    openChecklistId = null; persist(); render();
  });
  document.querySelectorAll('[data-action="export-checklist-csv"]').forEach(el=>el.onclick=()=>{
    const c = state.checklists.find(x=>x.id===el.dataset.checklist);
    if(!c) return;
    const headers = ["Section","Item","Result","Note"];
    const rows = c.sections.flatMap(sec => sec.items.map(it => [sec.name, it.text, it.result||'', it.note||'']));
    const csvEscape = (v) => `"${String(v).replace(/"/g,'""')}"`;
    const metaLines = [
      `"Checklist Template","${String(c.template).replace(/"/g,'""')}"`,
      `"Location","${String(c.location||'').replace(/"/g,'""')}"`,
      `"Inspector","${String(c.inspector||'').replace(/"/g,'""')}"`,
      `"Date","${c.date}"`, ""
    ];
    const csv = [...metaLines, headers.map(csvEscape).join(','), ...rows.map(row=>row.map(csvEscape).join(','))].join('\n');
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `checklist-${c.template.replace(/[^a-z0-9]+/gi,'-')}-${c.date}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
  });
  const checklistsOverviewCsvBtn = document.querySelector('[data-action="export-checklists-overview-csv"]');
  if(checklistsOverviewCsvBtn) checklistsOverviewCsvBtn.onclick=()=>{
    const headers = ["Template","Location","Inspector","Date","Score %"];
    const rows = state.checklists.map(c=>[c.template, c.location||'', c.inspector||'', c.date, checklistScore(c)===null?'':checklistScore(c)]);
    const csvEscape = (v) => `"${String(v).replace(/"/g,'""')}"`;
    const csv = [headers.map(csvEscape).join(','), ...rows.map(row=>row.map(csvEscape).join(','))].join('\n');
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `aqms-checklists-overview-${today()}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  /* search & filter */
  const searchInput = document.getElementById('audit-search');
  if(searchInput){
    searchInput.oninput = () => {
      auditSearch = searchInput.value;
      render();
      const newInput = document.getElementById('audit-search');
      if(newInput){ newInput.focus(); newInput.setSelectionRange(auditSearch.length, auditSearch.length); }
    };
  }
  const stdFilter = document.getElementById('audit-filter-standard');
  if(stdFilter) stdFilter.onchange = ()=>{ auditStandardFilter = stdFilter.value; render(); };
  const statusFilter = document.getElementById('audit-filter-status');
  if(statusFilter) statusFilter.onchange = ()=>{ auditStatusFilter = statusFilter.value; render(); };
  const riskFilter = document.getElementById('audit-filter-risk');
  if(riskFilter) riskFilter.onchange = ()=>{ auditRiskFilter = riskFilter.value; render(); };

  /* pro modal */
  const openProBtn = document.querySelector('[data-action="open-pro-modal"]'); if(openProBtn) openProBtn.onclick=()=>{ showProModal=true; render(); };
  document.querySelectorAll('[data-action="close-pro-modal"]').forEach(el=>el.onclick=()=>{ showProModal=false; render(); });
  const submitProBtn = document.querySelector('[data-action="submit-pro-code"]');
  if(submitProBtn) submitProBtn.onclick=()=>{
    const code = document.getElementById('pro-code-input').value;
    if(unlockPro(code)){ showProModal=false; render(); }
    else { document.getElementById('pro-error').style.display='block'; }
  };

  /* company settings modal */
  const openCompanyBtn = document.querySelector('[data-action="open-company-modal"]');
  if(openCompanyBtn) openCompanyBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    showCompanyModal=true; render();
  };
  document.querySelectorAll('[data-action="close-company-modal"]').forEach(el=>el.onclick=()=>{ showCompanyModal=false; render(); });
  const saveCompanyBtn = document.querySelector('[data-action="save-company-settings"]');
  if(saveCompanyBtn) saveCompanyBtn.onclick=()=>{
    state.companySettings.name = document.getElementById('cs-name').value;
    state.companySettings.address = document.getElementById('cs-address').value;
    state.companySettings.email = document.getElementById('cs-email').value;
    state.companySettings.nextManagementReviewDate = document.getElementById('cs-mgmt-review').value;
    state.companySettings.footerText = document.getElementById('cs-footer').value;
    const logoFile = document.getElementById('cs-logo').files[0];
    if(logoFile){
      const reader = new FileReader();
      reader.onload = () => { state.companySettings.logoDataUrl = reader.result; persist(); showCompanyModal=false; render(); };
      reader.readAsDataURL(logoFile);
    } else {
      persist(); showCompanyModal=false; render();
    }
  };

  /* client workspace switcher */
  const openWorkspaceBtn = document.querySelector('[data-action="open-workspace-modal"]');
  if(openWorkspaceBtn) openWorkspaceBtn.onclick=()=>{ showWorkspaceModal=true; render(); };
  document.querySelectorAll('[data-action="close-workspace-modal"]').forEach(el=>el.onclick=()=>{ showWorkspaceModal=false; render(); });
  document.querySelectorAll('[data-action="switch-workspace"]').forEach(el=>el.onclick=()=>{ switchWorkspace(el.getAttribute('data-workspace')); });
  const createWorkspaceBtn = document.querySelector('[data-action="create-workspace"]');
  if(createWorkspaceBtn) createWorkspaceBtn.onclick=()=>{
    const val = document.getElementById('new-workspace-name').value;
    if(!val || !val.trim()){ return; }
    createWorkspace(val);
  };
  const createDemoBtn = document.querySelector('[data-action="create-demo-workspace"]');
  if(createDemoBtn) createDemoBtn.onclick=()=>{ createDemoWorkspace(); };
  document.querySelectorAll('[data-workspace-rename]').forEach(el=>{
    el.onchange=()=>{ renameWorkspace(el.getAttribute('data-workspace-rename'), el.value); };
    el.onkeydown=(e)=>{ if(e.key==="Enter"){ el.blur(); } };
  });
  document.querySelectorAll('[data-action="open-delete-workspace"]').forEach(el=>el.onclick=()=>{ pendingDeleteWorkspaceId = el.getAttribute('data-workspace'); render(); });
  document.querySelectorAll('[data-action="cancel-delete-workspace"]').forEach(el=>el.onclick=()=>{ pendingDeleteWorkspaceId = null; render(); });
  document.querySelectorAll('[data-action="confirm-delete-workspace"]').forEach(el=>el.onclick=()=>{ deleteWorkspace(el.getAttribute('data-workspace')); });

  /* cloud backup */
  const openCloudBtn = document.querySelector('[data-action="open-cloud-modal"]');
  if(openCloudBtn) openCloudBtn.onclick=()=>{ cloudStatus=""; showCloudModal=true; render(); };
  document.querySelectorAll('[data-action="close-cloud-modal"]').forEach(el=>el.onclick=()=>{ showCloudModal=false; render(); });
  const cloudModeSignin = document.querySelector('[data-action="cloud-mode-signin"]');
  if(cloudModeSignin) cloudModeSignin.onclick=()=>{ cloudAuthMode="signin"; render(); };
  const cloudModeSignup = document.querySelector('[data-action="cloud-mode-signup"]');
  if(cloudModeSignup) cloudModeSignup.onclick=()=>{ cloudAuthMode="signup"; render(); };
  const cloudSubmitBtn = document.querySelector('[data-action="cloud-submit-auth"]');
  if(cloudSubmitBtn) cloudSubmitBtn.onclick=()=>{
    const email = document.getElementById('cloud-email').value.trim();
    const password = document.getElementById('cloud-password').value;
    if(!email || !password){ cloudStatus = "⚠ Enter an email and password."; render(); return; }
    if(cloudAuthMode==="signup") cloudSignUp(email, password); else cloudSignIn(email, password);
  };
  const cloudSignOutBtn = document.querySelector('[data-action="cloud-sign-out"]');
  if(cloudSignOutBtn) cloudSignOutBtn.onclick=()=>{ cloudSignOut(); };
  const cloudBackupBtn = document.querySelector('[data-action="cloud-backup-now"]');
  if(cloudBackupBtn) cloudBackupBtn.onclick=()=>{ cloudBackupNow(); };
  const cloudRestoreBtn = document.querySelector('[data-action="cloud-restore-now"]');
  if(cloudRestoreBtn) cloudRestoreBtn.onclick=()=>{
    if(confirm("This replaces everything in the current workspace with the last cloud backup. Continue?")) cloudRestoreNow();
  };
  const excelBtn = document.querySelector('[data-action="export-excel"]');
  if(excelBtn) excelBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    if(typeof XLSX === 'undefined'){ alert('Excel library failed to load — check your internet connection and try again.'); return; }
    const auditRows = state.audits.map(a=>({
      "Audit Number": a.auditNumber||'', "Title": a.title, "Standard": a.standard, "Area": a.area,
      "Auditor": a.auditor, "Auditee": a.auditee, "Date": a.date, "Status": a.status, "Compliance %": scoreOf(a)
    }));
    const findingRows = state.audits.flatMap(a=>a.findings.map(f=>({
      "Audit Number": a.auditNumber||'', "Audit Title": a.title, "Department": f.clause, "Description": f.desc,
      "Severity": f.severity, "Owner": f.owner, "Due Date": f.dueDate, "CAPA": f.actionText, "Status": f.status
    })));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(auditRows), "Audits");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(findingRows), "Findings & CAPA");
    XLSX.writeFile(wb, `aqms-export-${today()}.xlsx`);
  };

  /* CSV export (Pro gated) — findings/CAPA, most useful for external analysis */
  const csvBtn = document.querySelector('[data-action="export-csv"]');
  if(csvBtn) csvBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    const headers = ["Audit Number","Audit Title","Department","Description","Severity","Owner","Due Date","CAPA","Status"];
    const rows = state.audits.flatMap(a=>a.findings.map(f=>[
      a.auditNumber||'', a.title, f.clause, f.desc, f.severity, f.owner||'', f.dueDate||'', f.actionText||'', f.status
    ]));
    const csvEscape = (v) => `"${String(v).replace(/"/g,'""')}"`;
    const csv = [headers.map(csvEscape).join(','), ...rows.map(r=>r.map(csvEscape).join(','))].join('\n');
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `aqms-findings-${today()}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };


  const backupBtn = document.querySelector('[data-action="open-backup"]');
  if(backupBtn) backupBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `aqms-backup-${today()}.json`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
    localStorage.setItem('aqms-last-backup', new Date().toLocaleString());
    render();
  };
  const restoreBtn = document.querySelector('[data-action="open-restore"]');
  const restoreFileInput = document.getElementById('restore-file-input');
  if(restoreBtn) restoreBtn.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    restoreFileInput.click();
  };
  if(restoreFileInput) restoreFileInput.onchange=()=>{
    const file = restoreFileInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data.audits) throw new Error("Invalid backup file");
        if(!confirm("Restoring will replace all current audits with the backup file. Continue?")) { restoreFileInput.value = ""; return; }
        state = data; openAuditId=null; persist(); render();
      }catch(e){ alert("Could not read this file — please check it's a valid AuditQMS backup."); }
      restoreFileInput.value = "";
    };
    reader.readAsText(file);
  };

  /* PDF export (Pro gated) */
  document.querySelectorAll('[data-print-micro-cert]').forEach(el=>el.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    buildMicroCertificatePrintReport(el.dataset.printMicroCert);
    window.print();
  });
  document.querySelectorAll('[data-action="export-audit-pdf"]').forEach(el=>el.onclick=()=>{
    if(!isPro()){ showProModal=true; render(); return; }
    const a = state.audits.find(x=>x.id===el.dataset.audit);
    buildAuditPrintReport(a);
    window.print();
  });
}

render();
initCloudSession();

/* auto-save safety net — quietly persists every 5s in case a change slipped through */
setInterval(() => { saveStore(state); }, 5000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', function(){
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      });
    });
  });
}

function showUpdateBanner(){
  if(document.getElementById('update-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1c2b4a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:200;font-family:sans-serif;font-size:13px;gap:10px;';
  banner.innerHTML = '<span>A new version of AuditQMS Pro Suite is available.</span><button id="reload-app-btn" style="background:#fff;color:#1c2b4a;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;">Reload</button>';
  document.body.appendChild(banner);
  document.getElementById('reload-app-btn').onclick = () => window.location.reload();
}
</script>
</body>
</html>
