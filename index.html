let scoreCache = new Map();
function scoreOf(audit){
  if(scoreCache.has(audit.id)) return scoreCache.get(audit.id);
  const items = audit.sections.flatMap(s=>s.items).filter(i=>i.result==="Pass"||i.result==="Fail");
  const score = items.length===0 ? null : Math.round((items.filter(i=>i.result==="Pass").length/items.length)*100);
  scoreCache.set(audit.id, score);
  return score;
}

function complianceGrade(score){
  if(score===null) return {label:"No Data Yet", tone:"neutral"};
  if(score>=90) return {label:"Excellent", tone:"green"};
  if(score>=80) return {label:"Good", tone:"navy"};
  if(score>=60) return {label:"Needs Attention", tone:"amber"};
  return {label:"Critical", tone:"rust"};
}

const GRADE_EMOJI = {green:"🟢", amber:"🟡", rust:"🔴", navy:"🔵", neutral:"⚪"};

function recordComplianceSnapshot(overallScore, metricsObj){
  if(overallScore===null && !metricsObj) return;
  const month = today().slice(0,7);
  let existing = state.complianceScoreHistory.find(h=>h.month===month);
  if(!existing){ existing = {month, score:null, metrics:{}}; state.complianceScoreHistory.push(existing); }
  if(overallScore!==null) existing.score = overallScore;
  if(metricsObj){ existing.metrics = existing.metrics || {}; Object.assign(existing.metrics, metricsObj); }
  saveStore(state);
}
function complianceTrend(){
  const sorted = [...state.complianceScoreHistory].sort((a,b)=>a.month.localeCompare(b.month));
  if(sorted.length<2) return null;
  const thisMonth = today().slice(0,7);
  const priorEntries = sorted.filter(h=>h.month!==thisMonth && h.score!=null);
  if(priorEntries.length===0) return null;
  const prev = priorEntries[priorEntries.length-1];
  const curr = sorted[sorted.length-1];
  if(curr.score==null) return null;
  return Math.round((curr.score - prev.score)*10)/10;
}
function metricTrend(key, currentValue){
  if(currentValue===null) return null;
  const sorted = [...state.complianceScoreHistory].sort((a,b)=>a.month.localeCompare(b.month));
  const thisMonth = today().slice(0,7);
  const priorEntries = sorted.filter(h=>h.month!==thisMonth && h.metrics && h.metrics[key]!=null);
  if(priorEntries.length===0) return null;
  const prev = priorEntries[priorEntries.length-1];
  return Math.round((currentValue - prev.metrics[key])*10)/10;
}

function renderDashboard(){
  const audits = state.audits;
  const allFindings = audits.flatMap(a=>a.findings.map(f=>({...f, auditTitle:a.title, auditId:a.id})));
  const openFindings = allFindings.filter(f=>f.status!=="Closed");
  const overdue = openFindings.filter(f=>f.dueDate && daysUntil(f.dueDate)<0);
  const critical = openFindings.filter(f=>f.severity==="Critical"||f.severity==="Major");
  const scored = audits.map(scoreOf).filter(s=>s!==null);
  const avgScore = scored.length ? Math.round(scored.reduce((a,b)=>a+b,0)/scored.length) : null;
  const highRisks = state.riskAssessments.filter(r=>(r.riskLevel==="High"||r.riskLevel==="Critical") && RISK_NEEDS_ATTENTION_STATUSES.includes(r.status));

  /* Overall Compliance Score — built from every module that exists in this app today. */
  const capaScore = computeAutoMetricValue("capa_closure_rate");
  const totalRisks = state.riskAssessments.length;
  const riskScore = totalRisks>0 ? Math.round(((totalRisks-highRisks.length)/totalRisks)*1000)/10 : null;
  const metricsWithData = state.metrics.map(m=>({m,value:metricCurrentValue(m)})).filter(x=>x.value!==null);
  const onTargetMetrics = metricsWithData.filter(x=>metricStatus(x.m,x.value)==="On Target").length;
  const metricsScore = metricsWithData.length>0 ? Math.round((onTargetMetrics/metricsWithData.length)*1000)/10 : null;
  const totalDocs = state.documents.length;
  const docsInGoodStanding = state.documents.filter(d=>(d.status==="Approved"||d.status==="Published") && documentReviewStatus(d)!=="Overdue").length;
  const documentScore = totalDocs>0 ? Math.round((docsInGoodStanding/totalDocs)*1000)/10 : null;
  const totalTraining = state.trainingRecords.length;
  const trainingInGoodStanding = state.trainingRecords.filter(t=>{ const s=trainingStatus(t); return s==="Valid"||s==="No Expiry"; }).length;
  const trainingScore = totalTraining>0 ? Math.round((trainingInGoodStanding/totalTraining)*1000)/10 : null;
  const activeHaccp = state.haccpPoints.filter(p=>p.status!=="Inactive");
  const haccpScore = activeHaccp.length>0 ? Math.round((activeHaccp.filter(p=>haccpStatus(p)==="Compliant").length/activeHaccp.length)*1000)/10 : null;
  const totalRecalls = state.productRecalls.length;
  const recallScore = totalRecalls>0 ? Math.round((state.productRecalls.reduce((sum,r)=>sum+recallCompletionPct(r),0)/totalRecalls)*10)/10 : null;
  const totalSuppliers = state.suppliers.length;
  const supplierScore = totalSuppliers>0 ? Math.round((state.suppliers.filter(s=>s.approvalStatus==="Approved").length/totalSuppliers)*1000)/10 : null;
  const totalAllergenIncidents = state.allergenIncidents.length;
  const allergenScore = totalAllergenIncidents>0 ? Math.round((state.allergenIncidents.filter(i=>i.capaStatus==="Closed").length/totalAllergenIncidents)*1000)/10 : null;
  const activeCip = state.cipSchedules.filter(c=>c.status!=="Inactive");
  const cipScore = activeCip.length>0 ? Math.round((activeCip.filter(c=>cipStatus(c)!=="Overdue").length/activeCip.length)*1000)/10 : null;
  const totalSensory = state.sensoryEvaluations.length;
  const sensoryScore = totalSensory>0 ? Math.round((state.sensoryEvaluations.filter(e=>sensoryResult(e)==="Pass").length/totalSensory)*1000)/10 : null;
  const foodSafetyComponents = [haccpScore, cipScore, allergenScore].filter(s=>s!==null);
  const foodSafetyScore = foodSafetyComponents.length ? Math.round((foodSafetyComponents.reduce((a,b)=>a+b,0)/foodSafetyComponents.length)*10)/10 : null;
  const labTests = [
    ...state.labResults.filter(r=>r.status),
    ...state.empSwabs.filter(r=>r.status),
    ...state.proficiencyTests.filter(r=>r.status)
  ];
  const labScore = labTests.length ? Math.round((labTests.filter(r=>r.status==="Pass").length/labTests.length)*1000)/10 : null;

  /* Management summary counts */
  const openAudits = audits.filter(a=>a.status!=="Closed").length;
  const pendingDocuments = state.documents.filter(d=>d.status==="Draft"||d.status==="Under Review").length;
  const approvedSuppliers = state.suppliers.filter(s=>s.approvalStatus==="Approved").length;
  const employeeNames = new Set();
  state.trainingRecords.forEach(r=>{ if(r.employeeName) employeeNames.add(r.employeeName.trim().toLowerCase()); });
  [...state.competencyRecords, ...state.medicalSurveillanceRecords, ...state.medicalCertRecords, ...state.foodHandlerDeclarations, ...state.ppeIssueLogs].forEach(r=>{ if(r.employee) employeeNames.add(r.employee.trim().toLowerCase()); });
  const activeEmployees = employeeNames.size;

  /* Alerts */
  const supplierExpiring = state.suppliers.filter(s=>{
    if(!s.lastAssessmentDate) return false;
    const nextDue = new Date(s.lastAssessmentDate); nextDue.setDate(nextDue.getDate()+365);
    const days = Math.round((nextDue-new Date())/86400000);
    return days>=0 && days<=7;
  });
  const haccpVerificationOverdue = state.verificationLogs.filter(v=>v.activityType==="HACCP Plan Review" && v.nextDueDate && daysUntil(v.nextDueDate)<0);
  const trainingExpiring = state.trainingRecords.filter(t=>trainingStatus(t)==="Expiring Soon");
  const alerts = [];
  if(overdue.length) alerts.push(`⚠️ ${overdue.length} CAPA${overdue.length===1?'':'s'} overdue`);
  if(supplierExpiring.length) alerts.push(`⚠️ ${supplierExpiring.length} supplier approval${supplierExpiring.length===1?'':'s'} expire this week`);
  if(haccpVerificationOverdue.length) alerts.push(`⚠️ HACCP verification overdue (${haccpVerificationOverdue.length})`);
  if(trainingExpiring.length) alerts.push(`⚠️ ${trainingExpiring.length} training certificate${trainingExpiring.length===1?'':'s'} expiring soon`);

  const moduleScores = [
    {label:"Audit Compliance", score:avgScore},
    {label:"CAPA Management", score:capaScore},
    {label:"Risk Management", score:riskScore},
    {label:"KPI Metrics On-Target", score:metricsScore},
    {label:"Document Control", score:documentScore},
    {label:"Training Compliance", score:trainingScore},
    {label:"HACCP Compliance", score:haccpScore},
    {label:"Product Recall Progress", score:recallScore},
    {label:"Supplier Approval Rate", score:supplierScore},
    {label:"Allergen Incident Closure", score:allergenScore},
    {label:"CIP Cleaning Compliance", score:cipScore},
    {label:"Sensory Evaluation Pass Rate", score:sensoryScore}
  ];
  const availableScores = moduleScores.filter(x=>x.score!==null);
  const overallScore = availableScores.length ? Math.round(availableScores.reduce((a,b)=>a+b.score,0)/availableScores.length) : null;
  const overallGrade = complianceGrade(overallScore);
  const metricSnapshot = {
    overall:overallScore, audit:avgScore, capa:capaScore, risk:riskScore,
    training:trainingScore, documents:documentScore, kpiMetrics:metricsScore, supplier:supplierScore,
    haccp:haccpScore, recall:recallScore, allergen:allergenScore, cip:cipScore, sensory:sensoryScore,
    lab:labScore
  };
  recordComplianceSnapshot(overallScore, metricSnapshot);
  const trend = complianceTrend();

  const KPI_NAV_TARGETS = {
    audit:"nav-audit-register", capa:"nav-capa", risk:"nav-risk", training:"nav-people-training",
    documents:"nav-documents", kpiMetrics:"nav-metrics", supplier:"nav-suppliers-list",
    haccp:"nav-fs-haccp", recall:"nav-trace-recall", allergen:"nav-fs-allergens", cip:"nav-fs-cip",
    sensory:"nav-sensory-0", lab:"nav-lab-trend"
  };
  function kpiRow(label, score, key){
    const g = complianceGrade(score);
    const t = metricTrend(key, score);
    const trendHtml = t===null ? '' : `<span style="font-size:11px;color:${t>=0?'var(--green)':'var(--rust)'};margin-left:6px;">${t>=0?'↑ +':'↓ '}${t}%</span>`;
    const navId = KPI_NAV_TARGETS[key];
    const inner = `
      <span>${GRADE_EMOJI[g.tone]} ${label}</span>
      <span>${score===null?'<span class="muted-italic">no data yet</span>':`<strong>${score}%</strong>`}${trendHtml}</span>
    `;
    if(navId){
      return `<button data-navid="${navId}" style="display:flex;width:100%;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);border-top:none;border-left:none;border-right:none;background:none;font-size:13px;text-align:left;cursor:pointer;color:inherit;">${inner}</button>`;
    }
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;">${inner}</div>`;
  }
  function kpiGroup(title, rows){
    return `
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px;">${title}</div>
      ${rows.map(r=>kpiRow(r.label, r.score, r.key)).join('')}
    `;
  }

  /* Today's Priorities — a ranked, clickable action list.
     Primary sort: severity tier (red > yellow > green).
     Secondary sort: urgency within the tier (more overdue days / higher risk level first),
     so the single worst item in each tier always surfaces first instead of insertion order. */
  const priorities = [];
  overdue.forEach(f=>priorities.push({dot:"🔴", text:`Close overdue CAPA: ${f.desc}`, jumpAudit:f.auditId, urgency:-daysUntil(f.dueDate)}));
  highRisks.forEach(r=>priorities.push({dot:"🔴", text:`Review high risk: ${r.hazard||'Untitled risk'}`, navId:"nav-risk", urgency:r.riskLevel==="Critical"?1000:500}));
  haccpVerificationOverdue.forEach(v=>priorities.push({dot:"🔴", text:`Verify HACCP: ${v.activityType||'Verification overdue'}`, navId:"nav-fs-verification", urgency:v.nextDueDate?-daysUntil(v.nextDueDate):0}));
  audits.filter(a=>a.status==="In Progress").forEach(a=>priorities.push({dot:"🟡", text:`Complete audit: ${a.title}`, jumpAudit:a.id, urgency:a.dueDate?-daysUntil(a.dueDate):0}));
  state.documents.filter(d=>d.status==="Under Review").forEach(d=>priorities.push({dot:"🟡", text:`Approve document: ${d.title}`, navId:"nav-documents", urgency:0}));
  state.suppliers.filter(s=>s.approvalStatus==="Pending").forEach(s=>priorities.push({dot:"🟡", text:`Review supplier: ${s.name}`, navId:"nav-suppliers-list", urgency:0}));
  activeHaccp.filter(p=>haccpStatus(p)!=="Compliant").forEach(p=>priorities.push({dot:"🟢", text:`Verify CCP: ${p.ccpNumber||'CCP'} — ${p.processStep||''}`, navId:"nav-fs-haccp", urgency:0}));
  const priorityOrder = {"🔴":0,"🟡":1,"🟢":2};
  priorities.sort((a,b)=>priorityOrder[a.dot]-priorityOrder[b.dot] || b.urgency-a.urgency);
  const topPriorities = priorities.slice(0,8);

  /* Recent Activity feed */
  const recentActivity = [...state.activityLog].sort((a,b)=>b.ts.localeCompare(a.ts)).slice(0,10);
  function activityDayLabel(ts){
    const d = ts.slice(0,10);
    const today0 = today();
    const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(d===today0) return "Today";
    if(d===yest) return "Yesterday";
    return d;
  }

  return `
  ${isWorkspaceEmpty() ? `
    <div class="card p4" style="margin-bottom:16px;background:var(--navy-bg);border-color:#c3cee2;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <div>
          <strong style="color:var(--navy);">Your workspace is empty</strong>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">Load realistic sample data — audits, CAPAs, risks, suppliers, KPIs, and a product recall example — to explore the platform or run a demo.</div>
        </div>
        <button class="btn btn-primary" data-action="load-demo-data" style="white-space:nowrap;">✨ Load Demo Data</button>
      </div>
    </div>
  ` : hasDemoData() ? `
    <div class="card p4" style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <div style="font-size:12px;color:var(--muted);">✨ This workspace contains sample demo data.</div>
        <button class="btn btn-ghost" data-action="clear-demo-data" style="white-space:nowrap;">🗑 Clear Demo Data</button>
      </div>
    </div>
  ` : ''}
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;">
      <button class="btn btn-primary" data-quick-action="new-audit" style="justify-content:center;">+ New Audit</button>
      <button class="btn btn-ghost" data-quick-action="raise-capa" style="justify-content:center;">+ Raise CAPA</button>
      <button class="btn btn-ghost" data-quick-action="upload-document" style="justify-content:center;">+ Upload Doc</button>
      <button class="btn btn-ghost" data-quick-action="report-incident" style="justify-content:center;">+ Report Incident</button>
      <button class="btn btn-ghost" data-quick-action="add-risk" style="justify-content:center;">+ Add Risk</button>
    </div>
    ${topPriorities.length ? `
    <div class="card p4" style="margin-bottom:16px;">
      <h3 class="serif" style="font-size:15px;margin:0 0 8px;">Today's Priorities</h3>
      ${topPriorities.map(p=>{
        const accent = p.dot==="🔴" ? "var(--rust)" : p.dot==="🟡" ? "var(--amber)" : "var(--green)";
        return `
        <button ${p.jumpAudit?`data-jump-audit="${p.jumpAudit}"`:`data-navid="${p.navId}"`} class="audit-row" style="border-radius:8px;border-left:3px solid ${accent};margin-bottom:4px;">
          <span style="font-size:13px;">${p.dot} ${esc(p.text)}</span>
        </button>
      `;}).join('')}
    </div>` : ''}
    <div class="card p4" style="margin-bottom:16px;">
      <h3 class="serif" style="font-size:15px;margin:0 0 8px;">Recent Activity</h3>
      ${recentActivity.length===0 ? `<p class="muted-italic" style="font-size:13px;">No activity logged yet — actions like creating audits, CAPAs, risks, documents, and supplier approvals will appear here.</p>` : (() => {
        let lastDay = null;
        return recentActivity.map(a=>{
          const day = activityDayLabel(a.ts);
          const dayHeader = day!==lastDay ? `<div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 0 4px;">${esc(day)}</div>` : '';
          lastDay = day;
          const time = new Date(a.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
          return `${dayHeader}<div style="font-size:13px;padding:4px 0;"><span style="color:var(--muted);">${day==="Today"?time:''}</span> ${esc(a.text)}</div>`;
        }).join('');
      })()}
    </div>
    <div class="stats" style="margin-bottom:16px;">
      ${statCard("📋", "Open Audits", openAudits, "nav-audit-register")}
      ${statCard("⏳", "Overdue CAPAs", overdue.length, "nav-capa")}
      ${statCard("🚨", "High Risks", highRisks.length, "nav-risk")}
      ${statCard("📄", "Pending Documents", pendingDocuments, "nav-documents")}
      ${statCard("🚚", "Approved Suppliers", approvedSuppliers, "nav-suppliers-list")}
      ${statCard("👥", "Active Employees", activeEmployees, "nav-people-training")}
    </div>
    ${alerts.length ? `
      <div class="card p4" style="margin-bottom:16px;border-color:var(--rustBg);">
        <h3 class="serif" style="font-size:15px;margin:0 0 8px;">Alerts</h3>
        ${alerts.map(a=>`<div style="padding:5px 0;font-size:13px;">${a}</div>`).join('')}
      </div>
    ` : ''}
    <div class="card p4" style="margin-bottom:16px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px;">
        <h3 class="serif" style="font-size:16px;margin:0;">Enterprise KPI Snapshot</h3>
      </div>
      ${kpiGroup("Compliance Overview", [
        {label:"Overall Compliance Score", score:overallScore, key:"overall"},
        {label:"Audit Compliance", score:avgScore, key:"audit"},
        {label:"CAPA Completion", score:capaScore, key:"capa"},
        {label:"Risk Management", score:riskScore, key:"risk"}
      ])}
      ${kpiGroup("Operational Performance", [
        {label:"Training Compliance", score:trainingScore, key:"training"},
        {label:"Document Control", score:documentScore, key:"documents"},
        {label:"KPI Metrics On-Target", score:metricsScore, key:"kpiMetrics"},
        {label:"Supplier Approval Rate", score:supplierScore, key:"supplier"}
      ])}
      ${kpiGroup("Food Safety", [
        {label:"HACCP Compliance", score:haccpScore, key:"haccp"},
        {label:"Product Recall Progress", score:recallScore, key:"recall"},
        {label:"Allergen Incident Closure", score:allergenScore, key:"allergen"},
        {label:"CIP Cleaning Compliance", score:cipScore, key:"cip"},
        {label:"Sensory Evaluation Pass Rate", score:sensoryScore, key:"sensory"}
      ])}
      ${kpiGroup("Laboratory", [
        {label:"Laboratory Performance", score:labScore, key:"lab"}
      ])}
      <p class="muted-italic" style="font-size:11px;margin:10px 0 0;">Metrics with no records yet show "no data yet" and aren't averaged into the overall score. Trend arrows compare to your last visit in a previous month.</p>
    </div>
    <div class="card p4" style="margin-bottom:16px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        <h3 class="serif" style="font-size:16px;margin:0;">Compliance Trend</h3>
        <span class="tag tag-${overallGrade.tone}" style="font-size:13px;">${overallScore===null?'No data yet':overallScore+'% — '+overallGrade.label}${trend!==null?` (${trend>=0?'↑ +':'↓ '}${trend}%)`:''}</span>
      </div>
      ${state.complianceScoreHistory.filter(h=>h.score!=null).length>=2 ? `<canvas id="compliance-trend-chart" height="100"></canvas>` : `<p class="muted-italic" style="font-size:12px;">Come back next month to start seeing your compliance trend over time.</p>`}
    </div>
    <div class="stats">
      ${statCard("📋", "Total Audits", audits.length, "nav-audit-register")}
      ${statCard("⚠", "Open Findings", openFindings.length, "nav-capa")}
      ${statCard("📄", "Docs Review Overdue", state.documents.filter(d=>documentReviewStatus(d)==="Overdue").length, "nav-documents")}
      ${statCard("🎓", "Training Overdue", state.trainingRecords.filter(t=>trainingStatus(t)==="Overdue").length, "nav-people-training")}
      ${statCard("🚨", "Active Recalls", state.productRecalls.filter(r=>r.status!=="Closed").length, "nav-trace-recall")}
      ${statCard("🔍", "Batches Expired/Quarantine", state.batches.filter(b=>batchExpiryStatus(b)==="Expired" || b.status==="Quarantine").length, "nav-trace-batch")}
      ${statCard("🌡️", "Critical Temp Readings", state.tempLogs.filter(l=>tempLogIsCritical(l)).length, "nav-fs-temperature")}
    </div>
    <div class="card p4" style="margin-bottom:16px;">
      <h3 class="serif" style="font-size:16px;margin:0 0 10px;">Priority Findings</h3>
      ${critical.filter(f=>f.status!=="Closed").length===0 ? `<p class="muted-italic">No major or critical findings open right now.</p>` :
        critical.filter(f=>f.status!=="Closed").slice(0,6).map(f=>`
          <button data-jump-audit="${f.auditId}" class="audit-row" style="background:#faf8f2;border:1px solid #e8e1cd;border-radius:8px;margin-bottom:6px;">
            <div style="min-width:0;">
              <div style="font-size:14px;">${esc(f.desc)}</div>
              <div class="audit-sub">${esc(f.auditTitle)} · ${esc(f.clause)}</div>
            </div>
            <div class="flex-wrap">
              ${f.dueDate && daysUntil(f.dueDate)<0 ? `<span class="tag tag-rust">overdue</span>`:''}
              <span class="tag tag-${sevTone[f.severity]}">${f.severity}</span>
            </div>
          </button>`).join('')}
    </div>
    <div class="card p4">
      <h3 class="serif" style="font-size:16px;margin:0 0 10px;">Audit Overview</h3>
      ${audits.map(a=>{
        const s = scoreOf(a);
        return `<button data-jump-audit="${a.id}" class="audit-row" style="border-radius:8px;">
          <div style="display:flex;align-items:center;gap:8px;min-width:0;">
            <span style="color:#c9c0a8;">›</span><span style="font-size:14px;">${esc(a.title)}</span>
          </div>
          <div class="flex-wrap">
            ${s!==null?`<span style="font-size:12px;color:var(--muted);">${s}%</span>`:''}
            <span class="tag tag-${statusTone[a.status]}">${a.status}</span>
          </div>
        </button>`;
      }).join('')}
    </div>
    <div class="card p4" style="margin-top:16px;">
      <h3 class="serif" style="font-size:16px;margin:0 0 4px;">📌 Executive Summary</h3>
      <p class="muted-italic" style="font-size:11px;margin:0 0 10px;">Quick glance only — see Management Review for the full report.</p>
      ${(() => {
        const c = state.companySettings || {};
        const mgmtDue = c.nextManagementReviewDate ? daysUntil(c.nextManagementReviewDate) : null;
        const internalAudits = audits.filter(a=>(a.auditType||"Internal")==="Internal");
        const externalAudits = audits.filter(a=>a.auditType==="External");
        const internalClosed = internalAudits.filter(a=>a.status==="Closed").length;
        const externalClosed = externalAudits.filter(a=>a.status==="Closed").length;
        const latestExternal = [...externalAudits].sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
        const custComplaints = state.sensoryEvaluations.filter(e=>(e.category||"Product Quality")==="Customer Complaint");
        const custComplaintsOpen = custComplaints.filter(e=>e.actionRequired).length;
        const supplierApproved = state.suppliers.filter(s=>s.approvalStatus==="Approved").length;
        const copqTotal = state.copqEntries.reduce((sum,e)=>sum+(Number(e.amount)||0),0);
        const csatAvg = state.csatEntries.length ? (state.csatEntries.reduce((sum,e)=>sum+(Number(e.score)||0),0)/state.csatEntries.length) : null;

        // Objectives Achievement — % of tracked KPI metrics currently On Target
        const metricsWithValues = state.metrics.map(m=>({ m, value: metricCurrentValue(m) })).filter(x=>x.value!==null);
        const metricsOnTarget = metricsWithValues.filter(x=>metricStatus(x.m, x.value)==="On Target").length;
        const objectivesAchievement = metricsWithValues.length ? Math.round((metricsOnTarget/metricsWithValues.length)*100) : null;

        // Process Performance — % of "Process" category metrics currently On Target, shown as a status bucket
        const processMetrics = metricsWithValues.filter(x=>(x.m.category||"")==="Process");
        const processOnTarget = processMetrics.filter(x=>metricStatus(x.m, x.value)==="On Target").length;
        const processPct = processMetrics.length ? Math.round((processOnTarget/processMetrics.length)*100) : null;
        const processBucket = processPct===null ? null : (processPct>=90 ? {emoji:"🟢",label:"On Target",tone:"green"} : processPct>=70 ? {emoji:"🟡",label:"Needs Attention",tone:"amber"} : {emoji:"🔴",label:"Off Target",tone:"rust"});

        // Business Risks — High/Critical risks in the Business category that still need attention
        const businessHighRisks = state.riskAssessments.filter(r=>r.category==="Business" && (r.riskLevel==="High"||r.riskLevel==="Critical") && RISK_NEEDS_ATTENTION_STATUSES.includes(r.status));

        // Regulatory Compliance — based on open Critical/Major findings from External audits and open Critical risks
        const externalOpenCriticalFindings = externalAudits.flatMap(ea=>ea.findings).filter(f=>f.status!=="Closed" && (f.severity==="Critical"||f.severity==="Major"));
        const openCriticalRisks = state.riskAssessments.filter(r=>r.riskLevel==="Critical" && RISK_NEEDS_ATTENTION_STATUSES.includes(r.status));
        const regulatoryBucket = (externalOpenCriticalFindings.some(f=>f.severity==="Critical") || openCriticalRisks.length>0)
          ? {emoji:"🔴", label:"Non-Compliant", tone:"rust"}
          : externalOpenCriticalFindings.length>0
            ? {emoji:"🟡", label:"At Risk", tone:"amber"}
            : {emoji:"🟢", label:"Compliant", tone:"green"};

        const staticRows = [
          { label:"Management Review Due", value: mgmtDue===null ? null : (mgmtDue<0 ? `Overdue by ${Math.abs(mgmtDue)} day(s)` : `Due in ${mgmtDue} day(s)`), tone: mgmtDue===null?null:(mgmtDue<0?'rust':mgmtDue<=14?'amber':'green'), hint:"Set in ⚙ Company settings" },
          { label:"Overall Compliance Trend (12 Months)", value: overallScore===null?null:`${overallScore}%${trend!==null?` (${trend>=0?'↑ +':'↓ '}${trend}%)`:''}`, tone: overallGrade.tone, hint:null },
          { label:"Business Risks Needing Attention", value: `${businessHighRisks.length} High/Critical Risk(s)`, tone: businessHighRisks.length>0?'rust':'green', hint:null }
        ];
        const staticHtml = staticRows.map(r=>`
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px;">
            <div>
              <div>${r.label}</div>
              ${r.hint ? `<div class="muted-italic" style="font-size:11px;">${esc(r.hint)}</div>` : ''}
            </div>
            <span class="tag tag-${r.tone||'neutral'}">${r.value===null ? 'not tracked yet' : esc(r.value)}</span>
          </div>
        `).join('') + `
          <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:10px;" data-action="goto-mgmt-review">📋 Open full Management Review report →</button>
        `;

        const recentCopq = [...state.copqEntries].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,3);
        const copqHtml = `
          <div style="padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
              <div>Cost of Poor Quality (COPQ)</div>
              <div class="flex-wrap">
                <span class="tag tag-${state.copqEntries.length?'rust':'neutral'}">${state.copqEntries.length ? `R ${copqTotal.toLocaleString()} · ${state.copqEntries.length} entries` : 'not tracked yet'}</span>
                <button class="btn btn-ghost" style="padding:2px 8px;font-size:12px;" data-action="toggle-copq-form">${dashShowCopqForm?'Cancel':'+ Log Cost'}</button>
              </div>
            </div>
            ${dashShowCopqForm ? `
              <div class="grid3" style="margin-top:8px;">
                <label class="field">Date<input type="date" id="copq-date" value="${today()}" /></label>
                <label class="field">Category<select id="copq-category">${COPQ_CATEGORIES.map(cat=>`<option>${cat}</option>`).join('')}</select></label>
                <label class="field">Cost (R)<input type="number" id="copq-amount" min="0" step="0.01" placeholder="0.00" /></label>
                <label class="field" style="grid-column:1/-1;">Description<input id="copq-desc" placeholder="e.g. Rework of Batch B2207 — sealing defect" /></label>
                <div style="grid-column:1/-1;display:flex;justify-content:flex-end;">
                  <button class="btn btn-primary" data-action="create-copq">Save Entry</button>
                </div>
              </div>
            ` : ''}
            ${recentCopq.length ? `
              <div style="margin-top:8px;">
                ${recentCopq.map(e=>`
                  <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:3px 0;">
                    <span>${e.date} · ${esc(e.category)} · ${esc(e.description)||'—'}</span>
                    <span class="flex-wrap"><strong style="color:var(--text);">R ${Number(e.amount||0).toLocaleString()}</strong><button class="btn btn-ghost" style="padding:1px 6px;font-size:11px;" data-delete-copq="${e.id}">✕</button></span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;

        const recentCsat = [...state.csatEntries].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,3);
        const csatBucket = csatStatus(csatAvg);
        const csatHtml = `
          <div style="padding:8px 0;font-size:13px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
              <div>Customer Satisfaction</div>
              <div class="flex-wrap">
                <span class="tag tag-${csatBucket?csatBucket.tone:'neutral'}">${csatAvg===null ? 'not tracked yet' : `${csatBucket.emoji} ${csatAvg.toFixed(1)} / 5 · ${csatBucket.label} · ${state.csatEntries.length} response(s)`}</span>
                <button class="btn btn-ghost" style="padding:2px 8px;font-size:12px;" data-action="toggle-csat-form">${dashShowCsatForm?'Cancel':'+ Log Score'}</button>
              </div>
            </div>
            ${dashShowCsatForm ? `
              <div class="grid3" style="margin-top:8px;">
                <label class="field">Date<input type="date" id="csat-date" value="${today()}" /></label>
                <label class="field">Customer / Account<input id="csat-customer" placeholder="e.g. Woolworths DC" /></label>
                <label class="field">Score (1–5)<select id="csat-score">${[5,4,3,2,1].map(v=>`<option>${v}</option>`).join('')}</select></label>
                <label class="field" style="grid-column:1/-1;">Comments<input id="csat-comments" placeholder="Optional" /></label>
                <div style="grid-column:1/-1;display:flex;justify-content:flex-end;">
                  <button class="btn btn-primary" data-action="create-csat">Save Score</button>
                </div>
              </div>
            ` : ''}
            ${recentCsat.length ? `
              <div style="margin-top:8px;">
                ${recentCsat.map(e=>`
                  <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:3px 0;">
                    <span>${e.date} · ${esc(e.customer)||'—'} ${e.comments?`· ${esc(e.comments)}`:''}</span>

                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;

        return staticHtml + copqHtml + csatHtml;
      })()}
    </div>
  `;
}

/* Shared aggregates used across Management Review sub-tabs */
function qualityObjectivesSummary(){
  const objs = state.qualityObjectives || [];
  const active = objs.filter(o => o.status !== "Archived");
  const achieved = active.filter(o => o.status === "Achieved").length;
  const atRisk = active.filter(o => o.status === "At Risk" || o.status === "Missed").length;
  const onTrack = active.filter(o => o.status === "On Track").length;
  const pct = active.length ? Math.round((achieved / active.length) * 100) : null;
  return { total: active.length, achieved, atRisk, onTrack, pct, list: active };
}
function mgmtReviewCore(){
  const audits = state.audits;
  const allFindings = audits.flatMap(a=>a.findings.map(f=>({...f, auditTitle:a.title, auditId:a.id, auditType:a.auditType||"Internal"})));
  const openFindings = allFindings.filter(f=>f.status!=="Closed");
  const overdueFindings = openFindings.filter(f=>f.dueDate && daysUntil(f.dueDate)<0);
  const scored = audits.map(scoreOf).filter(s=>s!==null);
  const overallScore = scored.length ? Math.round(scored.reduce((a,b)=>a+b,0)/scored.length) : null;
  const internalAudits = audits.filter(a=>(a.auditType||"Internal")==="Internal");
  const externalAudits = audits.filter(a=>a.auditType==="External");
  const capaTotal = allFindings.length;
  const capaClosed = allFindings.filter(f=>f.status==="Closed").length;
  const capaCompletionPct = capaTotal ? Math.round((capaClosed/capaTotal)*100) : null;
  const businessHighRisks = state.riskAssessments.filter(r=>r.category==="Business" && (r.riskLevel==="High"||r.riskLevel==="Critical") && RISK_NEEDS_ATTENTION_STATUSES.includes(r.status));
  const openRisks = state.riskAssessments.filter(r=>RISK_NEEDS_ATTENTION_STATUSES.includes(r.status));
  const criticalOpenRisks = openRisks.filter(r=>r.riskLevel==="Critical");
  const custComplaints = state.sensoryEvaluations.filter(e=>(e.category||"Product Quality")==="Customer Complaint");
  const custComplaintsOpen = custComplaints.filter(e=>e.actionRequired).length;
  const csatAvg = state.csatEntries.length ? (state.csatEntries.reduce((sum,e)=>sum+(Number(e.score)||0),0)/state.csatEntries.length) : null;
  const copqTotal = state.copqEntries.reduce((sum,e)=>sum+(Number(e.amount)||0),0);
  const totalSuppliers = state.suppliers.length;
  const supplierApproved = state.suppliers.filter(s=>s.approvalStatus==="Approved").length;
  const externalOpenCriticalFindings = externalAudits.flatMap(ea=>ea.findings).filter(f=>f.status!=="Closed" && (f.severity==="Critical"||f.severity==="Major"));
  const regulatoryBucket = (externalOpenCriticalFindings.some(f=>f.severity==="Critical") || criticalOpenRisks.length>0)
    ? {emoji:"🔴", label:"Non-Compliant", tone:"rust"}
    : externalOpenCriticalFindings.length>0 ? {emoji:"🟡", label:"At Risk", tone:"amber"}
    : {emoji:"🟢", label:"Compliant", tone:"green"};
  const metricsWithValues = state.metrics.map(m=>({ m, value: metricCurrentValue(m) })).filter(x=>x.value!==null);
  const metricsOnTarget = metricsWithValues.filter(x=>metricStatus(x.m, x.value)==="On Target").length;
  const objectivesAchievement = metricsWithValues.length ? Math.round((metricsOnTarget/metricsWithValues.length)*100) : null;
  return {
    audits, allFindings, openFindings, overdueFindings, overallScore, internalAudits, externalAudits,
    capaTotal, capaClosed, capaCompletionPct, businessHighRisks, openRisks, criticalOpenRisks,
    custComplaints, custComplaintsOpen, csatAvg, copqTotal, totalSuppliers, supplierApproved,
    regulatoryBucket, metricsWithValues, metricsOnTarget, objectivesAchievement
  };
}

      <span class="tag tag-${tone||'neutral'}">${value===null||value===undefined ? 'not tracked yet' : esc(String(value))}</span>

}

let complianceChartInstance = null;
let foodsafeTempChartInstance = null;
function renderFoodSafeTempTrendChart(){
  if(typeof Chart === 'undefined') return;
  if(foodsafeTempChartInstance){ foodsafeTempChartInstance.destroy(); foodsafeTempChartInstance = null; }
  const canvas = document.getElementById('foodsafe-temp-trend-chart');
  if(!canvas) return;
  const sorted = [...state.tempLogs].sort((a,b)=>a.time.localeCompare(b.time)).slice(-20);
  foodsafeTempChartInstance = new Chart(canvas, {
    type: 'line',
    data: { labels: sorted.map(l=>l.time.slice(5,16).replace('T',' ')), datasets: [{ label:'Temperature (°C)', data: sorted.map(l=>l.temp), borderColor:'#1c2b4a', backgroundColor:'rgba(28,43,74,.12)', fill:true, tension:.25, pointRadius:2 }] },
    options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:false }, x:{ grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:6} } } }
  });
}
function renderComplianceChart(){
  if(typeof Chart === 'undefined') return;
  if(complianceChartInstance){ complianceChartInstance.destroy(); complianceChartInstance = null; }
  const canvas = document.getElementById('compliance-trend-chart');
  if(!canvas) return;
  const sorted = [...state.complianceScoreHistory].filter(h=>h.score!=null).sort((a,b)=>a.month.localeCompare(b.month));
  complianceChartInstance = new Chart(canvas, {
    type: 'line',
    data: { labels: sorted.map(h=>h.month), datasets: [{ label:'Overall Compliance %', data: sorted.map(h=>h.score), borderColor:'#1c2b4a', backgroundColor:'rgba(28,43,74,.12)', fill:true, tension:.25, pointRadius:3 }] },
    options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:false, max:100 }, x:{ grid:{display:false} } } }
  });
}

function statCard(icon,label,value,navId){

  return `<div class="card p4"><div class="stat-label">${icon} ${label}</div><div class="stat-value">${value}</div></div>`;
}

function filteredAudits(){
  return state.audits.filter(a=>{
    const findingsText = a.findings.map(f=>f.desc+" "+f.clause).join(" ");
    const haystack = (a.title+" "+a.area+" "+a.auditor+" "+(a.auditNumber||"")+" "+findingsText).toLowerCase();
    const matchesSearch = !auditSearch || haystack.includes(auditSearch.toLowerCase());
    const matchesStandard = auditStandardFilter==="All" || a.standard===auditStandardFilter;
    const matchesStatus = auditStatusFilter==="All" || a.status===auditStatusFilter || (auditStatusFilter==="Open" && a.status!=="Closed");
    const matchesRisk = auditRiskFilter==="All" || a.riskLevel===auditRiskFilter;
    return matchesSearch && matchesStandard && matchesStatus && matchesRisk;
  });
}

            <button class="btn btn-primary" style="font-size:12px;" data-action="sign-audit" data-audit="${a.id}" data-role="auditor">Sign as Auditor</button>
          `}
        </div>
        <div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">APPROVAL SIGN-OFF</div>
          ${signOff.approverSignedAt ? `
            <div style="font-size:13px;">✓ Signed by <strong>${esc(signOff.approverName)}</strong></div>
            <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">${new Date(signOff.approverSignedAt).toLocaleString()}</div>

          `}
        </div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:10px;">Signing locks the checklist and findings against further edits. Unsign to make corrections.</div>
    </div>
  `;
}

function renderCapa(){
  const all = state.audits.flatMap(a=>a.findings.map(f=>({...f, auditTitle:a.title, auditId:a.id, isShellAudit:!!a.isCloudShellAudit})));
  const filtered = all.filter(f => capaFilter==="All" || f.status===capaFilter || (capaFilter==="Overdue" && f.dueDate && daysUntil(f.dueDate)<0 && f.status!=="Closed"));
  const sorted = [...filtered].sort((a,b)=>(a.dueDate||"9999").localeCompare(b.dueDate||"9999"));
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">CAPA Tracker ${cloudReady() ? `<span class="tag tag-green" style="font-size:10px;vertical-align:middle;">🔄 Live — shared with your team</span>` : ''}</h2>
      <div class="flex-wrap">
        ${["All","Open","In Progress","Closed","Overdue"].map(f=>`<button class="status-pill ${capaFilter===f?'active':''}" data-capa-filter="${f}">${f}</button>`).join('')}
      </div>
    </div>
    ${capaSyncError ? `<div class="card p4" style="background:#fdecea;border-color:var(--rust);margin-bottom:14px;"><p style="color:var(--rust);font-size:13px;margin:0;">⚠ Sync issue: ${esc(capaSyncError)}</p><p class="muted-italic" style="font-size:11px;margin-top:6px;">Your change is saved locally, but may not have reached the shared cloud copy yet.</p></div>` : ''}
    <div>
      ${sorted.length===0 ? `<p class="muted-italic">No CAPAs match this filter.</p>` : sorted.map(f=>{
        const overdue = f.dueDate && daysUntil(f.dueDate)<0 && f.status!=="Closed";
        return `<button data-jump-audit="${f.auditId}" class="card p4" style="display:flex;width:100%;text-align:left;gap:12px;flex-wrap:wrap;margin-bottom:8px;cursor:pointer;${overdue?'border-color:#e8c3b5;':''}">
          <div style="flex:1;min-width:200px;">
            <div style="font-size:14px;">${esc(f.desc)}</div>
            <div class="audit-sub">${esc(f.auditTitle)} · ${esc(f.clause)}${f.isShellAudit?' · <span class="muted-italic">from a teammate — full audit record not loaded here</span>':''}</div>
          </div>
          <div class="flex-wrap" style="font-size:12px;color:var(--muted);">
            ${f.owner?`<span>👤 ${esc(f.owner)}</span>`:''}
            ${f.dueDate?`<span style="${overdue?'color:var(--rust);font-weight:600;':''}">📅 ${f.dueDate}</span>`:''}
            ${f.autoGenerated?`<span class="tag tag-navy">⚡ Auto-CAPA</span>`:''}
            <span class="tag tag-${sevTone[f.severity]}">${f.severity}</span>
            <span class="tag tag-${statusTone[f.status]}">${f.status}</span>
          </div>
        </button>`;
      }).join('')}
    </div>
  `;
}

/* ---------- Document Control ---------- */
function documentReviewStatus(d){
  if(d.status==="Obsolete") return null;
  if(!d.reviewDate) return null;
  const days = daysUntil(d.reviewDate);
  if(days<0) return "Overdue";
  if(days<=30) return "Due Soon";
  return null;
}

function renderDocuments(){
  const all = state.documents;
  const filtered = all.filter(d => documentStatusFilter==="All" || d.status===documentStatusFilter);
  const overdueCount = all.filter(d=>documentReviewStatus(d)==="Overdue").length;
  return `

      <h2 class="serif" style="font-size:18px;margin:0;">Document Control ${cloudReady() ? `<span class="tag tag-green" style="font-size:10px;vertical-align:middle;">🔄 Live — shared with your team</span>` : ''}</h2>

    <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">

/* ---------- Training Matrix ---------- */
function trainingStatus(t){
  if(!t.expiryDate) return "No Expiry";
  const days = daysUntil(t.expiryDate);
  if(days<0) return "Overdue";
  if(days<=30) return "Expiring Soon";
  return "Valid";
}

function renderTraining(){
  const all = state.trainingRecords;
  const filtered = all.filter(t => trainingStatusFilter==="All" || trainingStatus(t)===trainingStatusFilter);

  const validCount = all.filter(t=>{ const s=trainingStatus(t); return s==="Valid"||s==="No Expiry"; }).length;
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">

/* ---------- HACCP ---------- */
function haccpStatus(p){
  if(p.status==="Inactive") return "Inactive";
  if(!p.readings || p.readings.length===0) return "No Readings";
  const latest = [...p.readings].sort((a,b)=>b.date.localeCompare(a.date))[0];
  return latest.result==="Deviation" ? "Deviation" : "Compliant";
}

function renderHaccp(){
  const all = state.haccpPoints;
  const filtered = all.filter(p => haccpStatusFilter==="All" || haccpStatus(p)===haccpStatusFilter);
  const deviationCount = all.filter(p=>haccpStatus(p)==="Deviation").length;
  const compliantCount = all.filter(p=>haccpStatus(p)==="Compliant").length;
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">HACCP — Critical Control Points</h2>

/* ---------- Product Recall ---------- */
function recallCompletionPct(r){
  const steps = r.actionSteps || [];
  if(steps.length===0) return 0;
  return Math.round((steps.filter(s=>s.done).length/steps.length)*100);
}

function recallMassBalance(r){
  const produced = Number(r.qtyProduced)||0;
  const parts = [Number(r.qtyWarehouse)||0, Number(r.qtyCustomers)||0, Number(r.qtyDestroyed)||0];
  const total = parts.reduce((a,b)=>a+b,0);
  const hasAnyPart = r.qtyWarehouse!=null || r.qtyCustomers!=null || r.qtyDestroyed!=null;
  const variance = total - produced;
  return { produced, total, variance, balanced: hasAnyPart && produced>0 && variance===0, hasAnyPart };
}

function recallDurationMs(r){
  if(!r.recallStartedAt) return null;
  const end = r.recallCompletedAt ? new Date(r.recallCompletedAt) : new Date();
  return end - new Date(r.recallStartedAt);
}

function formatDuration(ms){
  if(ms==null || ms<0) return "—";
  const totalMin = Math.round(ms/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  return h>0 ? `${h} hour${h===1?'':'s'} ${m} minute${m===1?'':'s'}` : `${m} minute${m===1?'':'s'}`;
}

function recallExceededTarget(r){
  if(!r.recallStartedAt || !r.targetHours) return false;
  const ms = recallDurationMs(r);
  return ms!==null && ms > (Number(r.targetHours)*3600000);
}

function nextRecallNumber(){
  return `REC-${new Date().getFullYear()}-${String(state.productRecalls.length+1).padStart(3,'0')}`;
}

  const all = state.productRecalls;

  return `

  if(c.status==="Inactive") return "Inactive";

  if(days<0) return "Overdue";
  if(days<=1) return "Due Soon";
  return "On Track";
}

/* ---------- Sensory Evaluation ---------- */
function sensoryOverallScore(e){
  const scores = SENSORY_ATTRIBUTES.map(attr => Number(e.scores?.[attr])).filter(v=>!Number.isNaN(v));
  if(scores.length===0) return null;
  return Math.round((scores.reduce((a,b)=>a+b,0)/scores.length)*10)/10;
}
function sensoryResult(e){
  const scores = SENSORY_ATTRIBUTES.map(attr => Number(e.scores?.[attr])).filter(v=>!Number.isNaN(v));
  if(scores.length===0) return "Fail";
  if(scores.some(v=>v<=2)) return "Fail";
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  if(avg>=4) return "Pass";
  if(avg>=3) return "Borderline";
  return "Fail";
}

/* ---------- Traceability ---------- */
function batchExpiryStatus(b){
  if(!b.expiry) return null;
  const days = daysUntil(b.expiry);
  if(days<0) return "Expired";
  if(days<=14) return "Expiring Soon";
  return null;
}
function batchForwardTrace(b){
  return state.batches.filter(x=>x.type==="Finished Product" && (x.components||[]).includes(b.id));
}
function batchBackwardTrace(b){
  return (b.components||[]).map(id=>state.batches.find(x=>x.id===id)).filter(Boolean);
}

function renderTraceability(){
  const all = state.batches;
  const q = batchSearch.trim().toLowerCase();
  const filtered = all.filter(b=>{
    const matchesType = batchTypeFilter==="All" || b.type===batchTypeFilter;
    const matchesSearch = !q || [b.product,b.batchNo,b.supplier].some(v=>(v||'').toLowerCase().includes(q));
    return matchesType && matchesSearch;
  });
  const rawCount = all.filter(b=>b.type==="Raw Material").length;
  const finishedCount = all.filter(b=>b.type==="Finished Product").length;
  const quarantineCount = all.filter(b=>b.status==="Quarantine").length;
  const expired = all.filter(b=>batchExpiryStatus(b)==="Expired");
  const expiringSoon = all.filter(b=>batchExpiryStatus(b)==="Expiring Soon");
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 class="serif" style="font-size:18px;margin:0;">🔍 Traceability — Batch Register</h2>
      <div class="flex-wrap">
        <button class="btn btn-ghost" data-action="export-batches-csv">⬇ CSV</button>
        <button class="btn btn-primary" data-action="toggle-new-batch">+ Log Batch</button>
      </div>
    </div>
    <div class="stats" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
      ${statCard("📦", "Total Batches", all.length)}
      ${statCard("🌾", "Raw Materials", rawCount)}
      ${statCard("🏭", "Finished Goods", finishedCount)}
      ${statCard("🧊", "In Quarantine", quarantineCount)}
    </div>
    ${expired.length>0 ? `
      <div class="card p4" style="margin-bottom:16px;border:1px solid var(--rust);">
        <strong style="color:var(--rust);">⚠ Expired — Action Required</strong>
        ${expired.map(b=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span>${esc(b.product)} · <strong>${esc(b.batchNo)}</strong></span><span class="tag tag-rust">${Math.abs(daysUntil(b.expiry))}d expired</span></div>`).join('')}
      </div>` : ''}
    ${expiringSoon.length>0 ? `
      <div class="card p4" style="margin-bottom:16px;">
        <strong>Expiring Within 14 Days</strong>
        ${expiringSoon.map(b=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span>${esc(b.product)} · <strong>${esc(b.batchNo)}</strong></span><span class="tag tag-amber">${daysUntil(b.expiry)}d left</span></div>`).join('')}
      </div>` : ''}
    ${quarantineCount>0 ? `
      <div class="card p4" style="margin-bottom:16px;">
        <strong>⚠ Quarantine Hold</strong>
        ${all.filter(b=>b.status==="Quarantine").map(b=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span>${esc(b.product)} · <strong>${esc(b.batchNo)}</strong></span><span class="tag tag-amber">Quarantine</span></div>`).join('')}
      </div>` : ''}
    <div class="card p4" style="margin-bottom:16px;">
      <input id="batch-search-input" placeholder="Search product, batch no, supplier…" value="${esc(batchSearch)}" style="margin-bottom:10px;" />
      <div class="flex-wrap">
        <span style="font-size:12px;color:var(--muted);">Filter by Type:</span>

      </div>
    </div>
    ${showNewBatch ? renderNewBatchForm() : ''}
    <div>
      ${filtered.length===0 ? `<p class="muted-italic">No batches logged yet.</p>` : filtered.map(b=>renderBatchRow(b)).join('')}

  `;
}

/* ---------- Temperature Monitoring ---------- */
function tempLogIsCritical(log){
  const p = state.tempProducts.find(x=>x.id===log.productId);
  if(!p) return false;
  return log.temp < p.tempMin || log.temp > p.tempMax;
}

function renderFoodSafeDashboard(){
  const products = state.tempProducts;
  const expiringSoon = products.filter(p=>{ if(!p.expiry) return false; const d = daysUntil(p.expiry); return d>=0 && d<=7; });
  const openNcrs = state.foodsafeNcrs.filter(n=>n.status==="Open");
  const criticalAlerts = state.tempLogs.filter(l=>tempLogIsCritical(l));
  const todayLog = state.haccpChecklistLogs.find(l=>l.date===today());
  const recentLogs = [...state.tempLogs].sort((a,b)=>b.time.localeCompare(a.time)).slice(0,20);
  return `
    <div class="stats" style="grid-template-columns:repeat(2,1fr);margin-bottom:16px;">
      ${statCard("📦", "Total Products", products.length)}
      ${statCard("⏰", "Expiring Soon (7d)", expiringSoon.length)}
      ${statCard("⚠️", "Open Issues", openNcrs.length)}
      ${statCard("✅", "HACCP Today", todayLog ? `${todayLog.results.filter(r=>r.result==='Pass').length}/${todayLog.results.length}` : "—")}
    </div>
    <div class="grid2" style="margin-bottom:16px;">
      <div class="card p4">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">🌡️ Critical Temperature Alerts</div>

      </div>
      <div class="card p4">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">⚠️ Open Non-Conformances</div>
        ${openNcrs.length===0 ? `<p class="muted-italic" style="margin:0;">✅ No open issues</p>` : openNcrs.slice(0,5).map(n=>`<div style="font-size:13px;padding:4px 0;">${esc(n.description)} <span class="tag tag-${ncrSeverityTone[n.severity]}">${n.severity}</span></div>`).join('')}
      </div>
    </div>
    <div class="card p4">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">📈 Temperature Trend (Last 20 Readings)</div>
      ${recentLogs.length===0 ? `<p class="muted-italic" style="margin:0;">No logs yet.</p>` : `<canvas id="foodsafe-temp-trend-chart" height="90"></canvas>`}
    </div>
  `;
}

function renderFoodSafeTemperature(){
  const products = state.tempProducts;
  const logs = state.tempLogs;
  const recentLogs = [...logs].sort((a,b)=>b.time.localeCompare(a.time)).slice(0,20);
  const criticalCount = logs.filter(l=>tempLogIsCritical(l)).length;
  return `
    <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
      ${statCard("📦", "Products Tracked", products.length)}
      ${statCard("📈", "Readings Logged", logs.length)}
      ${statCard("🚨", "Critical Readings", criticalCount)}

/* ---------- standalone checklists ---------- */
let showNewChecklist = false;
let openChecklistId = null;
let checklistTemplateFilter = "All";

let metricChartInstances = {};
function renderMetricCharts(){
  if(typeof Chart === 'undefined') return;
  state.metrics.forEach(m=>{
    if(metricChartInstances[m.id]){ metricChartInstances[m.id].destroy(); delete metricChartInstances[m.id]; }
    const canvas = document.getElementById(`metric-chart-${m.id}`);
    if(!canvas) return;
    const sorted = [...(m.history||[])].sort((a,b)=>a.date.localeCompare(b.date));
    const onTargetColor = "#3f6b2e";
    metricChartInstances[m.id] = new Chart(canvas, {
      type: 'line',
      data: {
        labels: sorted.map(h=>h.date),
        datasets: [
          { label: m.name, data: sorted.map(h=>h.value), borderColor:'#1c2b4a', backgroundColor:'rgba(28,43,74,.12)', fill:true, tension:.25 },
          { label: 'Target', data: sorted.map(()=>m.target), borderColor: onTargetColor, borderDash:[6,4], pointRadius:0, fill:false }
        ]
      },
      options: { plugins:{ legend:{ display:true, labels:{ boxWidth:12, font:{size:10} } } }, scales:{ y:{ beginAtZero:false }, x:{ grid:{display:false} } } }
    });
  });
}

function checklistScore(c){
  const items = (c.sections||[]).flatMap(s => s.items||[]).filter(i=>i.result==="Pass"||i.result==="Fail");
  return items.length===0 ? null : Math.round((items.filter(i=>i.result==="Pass").length/items.length)*100);
}

function destroyChart(key){
  if(chartInstances[key]){ chartInstances[key].destroy(); delete chartInstances[key]; }
}

function renderCharts(){
  if(typeof Chart === 'undefined'){ return; }
  const gridColor = darkMode ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
  const textColor = darkMode ? '#d8d3c6' : '#5c5540';
  Chart.defaults.color = textColor;
  Chart.defaults.borderColor = gridColor;

  /* Findings by severity (open only) */
  const openFindings = state.audits.flatMap(a=>a.findings).filter(f=>f.status!=="Closed");
  const sevCounts = ["Minor","Major","Critical"].map(s=>openFindings.filter(f=>f.severity===s).length);
  destroyChart('severity');
  const sevCtx = document.getElementById('chart-severity');
  if(sevCtx){
    chartInstances.severity = new Chart(sevCtx, {
      type: 'doughnut',
      data: { labels:["Minor","Major","Critical"], datasets:[{ data: sevCounts, backgroundColor:['#8a5a10','#9b3f28','#7a2c1a'] }] },
      options: { plugins:{ legend:{ position:'bottom' } }, maintainAspectRatio:true }
    });
  }

  /* CAPA ageing buckets (open findings with a due date) */
  const openWithDue = openFindings.filter(f=>f.dueDate);
  const buckets = { "Not overdue":0, "1–7 days":0, "8–30 days":0, "30+ days":0 };
  openWithDue.forEach(f=>{
    const overdueDays = -daysUntil(f.dueDate);
    if(overdueDays <= 0) buckets["Not overdue"]++;
    else if(overdueDays <= 7) buckets["1–7 days"]++;
    else if(overdueDays <= 30) buckets["8–30 days"]++;
    else buckets["30+ days"]++;
  });
  destroyChart('ageing');
  const ageingCtx = document.getElementById('chart-ageing');
  if(ageingCtx){
    chartInstances.ageing = new Chart(ageingCtx, {
      type: 'bar',
      data: { labels: Object.keys(buckets), datasets:[{ label:"Open CAPAs", data: Object.values(buckets), backgroundColor:'#9b3f28' }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 }, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Compliance trend across audits, ordered by date */
  const scoredAudits = state.audits
    .map(a=>({ label: a.auditNumber || a.title, date:a.date, score: scoreOf(a) }))
    .filter(a=>a.score!==null)
    .sort((x,y)=>x.date.localeCompare(y.date));
  destroyChart('trend');
  const trendCtx = document.getElementById('chart-trend');
  if(trendCtx){
    chartInstances.trend = new Chart(trendCtx, {
      type: 'line',
      data: { labels: scoredAudits.map(a=>a.label), datasets:[{ label:"Compliance %", data: scoredAudits.map(a=>a.score), borderColor:'#1c2b4a', backgroundColor:'rgba(28,43,74,.15)', fill:true, tension:.25 }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Audits by standard */
  const byStandard = {};
  state.audits.forEach(a=>{ byStandard[a.standard] = (byStandard[a.standard]||0)+1; });
  destroyChart('standards');
  const stdCtx = document.getElementById('chart-standards');
  if(stdCtx){
    chartInstances.standards = new Chart(stdCtx, {
      type: 'bar',
      data: { labels: Object.keys(byStandard), datasets:[{ label:"Audits", data: Object.values(byStandard), backgroundColor:'#3f6b2e' }] },
      options: { indexAxis:'y', plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, ticks:{ precision:0 }, grid:{color:gridColor} }, y:{ grid:{display:false} } } }
    });
  }

  /* CAPA Status pie (Open / In Progress / Closed / Overdue) */
  const allFindings = state.audits.flatMap(a=>a.findings);
  const capaOverdueCount = allFindings.filter(f=>f.status!=="Closed" && f.dueDate && daysUntil(f.dueDate)<0).length;
  const capaStatusCounts = {
    "Open": allFindings.filter(f=>f.status==="Open").length,
    "In Progress": allFindings.filter(f=>f.status==="In Progress").length,
    "Closed": allFindings.filter(f=>f.status==="Closed").length,
    "Overdue": capaOverdueCount
  };
  destroyChart('capaStatus');
  const capaStatusCtx = document.getElementById('chart-capa-status');
  if(capaStatusCtx){
    chartInstances.capaStatus = new Chart(capaStatusCtx, {
      type: 'pie',
      data: { labels: Object.keys(capaStatusCounts), datasets:[{ data: Object.values(capaStatusCounts), backgroundColor:['#c98a2b','#1c2b4a','#3f6b2e','#9b3f28'] }] },
      options: { plugins:{ legend:{ position:'bottom' } } }
    });
  }

  /* Audit results by department/area */
  const byArea = {};
  state.audits.forEach(a=>{
    const s = scoreOf(a);
    if(s===null) return;
    const area = a.area || "Unspecified";
    if(!byArea[area]) byArea[area] = [];
    byArea[area].push(s);
  });
  const areaLabels = Object.keys(byArea);
  const areaAverages = areaLabels.map(k=>Math.round(byArea[k].reduce((a,b)=>a+b,0)/byArea[k].length));
  destroyChart('auditDept');
  const auditDeptCtx = document.getElementById('chart-audit-dept');
  if(auditDeptCtx){
    chartInstances.auditDept = new Chart(auditDeptCtx, {
      type: 'bar',
      data: { labels: areaLabels, datasets:[{ label:"Avg. Audit Score %", data: areaAverages, backgroundColor:'#1c2b4a' }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Training compliance by department (role field) */
  const byDept = {};
  state.trainingRecords.forEach(t=>{
    const dept = t.role || "Unspecified";
    if(!byDept[dept]) byDept[dept] = {valid:0,total:0};
    byDept[dept].total++;
    const s = trainingStatus(t);
    if(s==="Valid"||s==="No Expiry") byDept[dept].valid++;
  });
  const deptLabels = Object.keys(byDept);
  const deptPct = deptLabels.map(k=>Math.round((byDept[k].valid/byDept[k].total)*100));
  destroyChart('trainingDept');
  const trainingDeptCtx = document.getElementById('chart-training-dept');
  if(trainingDeptCtx){
    chartInstances.trainingDept = new Chart(trainingDeptCtx, {
      type: 'bar',
      data: { labels: deptLabels, datasets:[{ label:"% Compliant", data: deptPct, backgroundColor:'#3f6b2e' }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* Laboratory test pass rate over time (by month) */
  const labAll = [...state.labResults, ...state.empSwabs, ...state.proficiencyTests].filter(r=>r.status && r.date);
  const byMonth = {};
  labAll.forEach(r=>{
    const m = r.date.slice(0,7);
    if(!byMonth[m]) byMonth[m] = {pass:0,total:0};
    byMonth[m].total++;
    if(r.status==="Pass") byMonth[m].pass++;
  });
  const monthLabels = Object.keys(byMonth).sort();
  const monthPassRate = monthLabels.map(m=>Math.round((byMonth[m].pass/byMonth[m].total)*100));
  destroyChart('labPassRate');
  const labPassCtx = document.getElementById('chart-lab-pass-rate');
  if(labPassCtx){
    chartInstances.labPassRate = new Chart(labPassCtx, {
      type: 'line',
      data: { labels: monthLabels, datasets:[{ label:"Pass Rate %", data: monthPassRate, borderColor:'#3f6b2e', backgroundColor:'rgba(63,107,46,.15)', fill:true, tension:.25 }] },
      options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, max:100, grid:{color:gridColor} }, x:{ grid:{display:false} } } }
    });
  }

  /* HACCP CCP compliance */
  const ccpLabels = state.haccpPoints.map(p=>p.ccpNumber||"CCP");
  const ccpValues = state.haccpPoints.map(p=>haccpStatus(p)==="Compliant"?100:haccpStatus(p)==="Deviation"?0:50);
  destroyChart('haccpCcp');
  const haccpCcpCtx = document.getElementById('chart-haccp-ccp');
  if(haccpCcpCtx){
    chartInstances.haccpCcp = new Chart(haccpCcpCtx, {
      type: 'bar',
      data: { labels: ccpLabels, datasets:[{ label:"Compliance", data: ccpValues, backgroundColor: ccpValues.map(v=>v===100?'#3f6b2e':v===0?'#9b3f28':'#c98a2b') }] },
      options: { indexAxis:'y', plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, max:100, grid:{color:gridColor} }, y:{ grid:{display:false} } } }
    });
  }

  /* Supplier performance (quality score) */
  const supplierLabels = state.suppliers.filter(s=>s.qualityScore).map(s=>s.name);
  const supplierValues = state.suppliers.filter(s=>s.qualityScore).map(s=>Number(s.qualityScore));
  destroyChart('supplierPerf');
  const supplierPerfCtx = document.getElementById('chart-supplier-perf');
  if(supplierPerfCtx){
    chartInstances.supplierPerf = new Chart(supplierPerfCtx, {
      type: 'bar',
      data: { labels: supplierLabels, datasets:[{ label:"Quality Score", data: supplierValues, backgroundColor:'#1c2b4a' }] },
      options: { indexAxis:'y', plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, max:100, grid:{color:gridColor} }, y:{ grid:{display:false} } } }
    });
  }
}

/* Rough localStorage usage estimate. Browsers differ (5-10MB is typical), so this is shown
   as an estimate against a conservative 5MB baseline rather than a precise number. */
function estimateStorageUsage(){
  let totalChars = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      const v = localStorage.getItem(k) || "";
      totalChars += k.length + v.length;
    }
  }catch(e){ /* ignore */ }
  const bytes = totalChars * 2; // JS strings are UTF-16
  const CONSERVATIVE_QUOTA_BYTES = 5 * 1024 * 1024;
  const pct = Math.min(100, Math.round((bytes / CONSERVATIVE_QUOTA_BYTES) * 100));
  let photoBytes = 0, photoCount = 0;
  const countPhoto = (p)=>{ if(p){ photoBytes += p.length*2; photoCount++; } };
  (state.audits||[]).forEach(a=>{
    (a.findings||[]).forEach(f=>countPhoto(f.photo));
    (a.sections||[]).forEach(sec=>(sec.items||[]).forEach(it=>countPhoto(it.photo)));
  });
  (state.checklists||[]).forEach(c=>{
    (c.sections||[]).forEach(sec=>(sec.items||[]).forEach(it=>countPhoto(it.photo)));
  });
  return { bytes, pct, photoBytes, photoCount };
}
function formatBytes(b){
  if(b < 1024) return b + " B";
  if(b < 1024*1024) return Math.round(b/1024) + " KB";
  return (b/(1024*1024)).toFixed(1) + " MB";
}

function renderSettings(){
  const usage = estimateStorageUsage();
  const barColor = usage.pct >= 85 ? "var(--rust)" : usage.pct >= 60 ? "var(--amber)" : "var(--green)";
  return `
    <h2 class="serif" style="font-size:18px;margin:0 0 16px;">Settings</h2>
    <div class="card p4" style="margin-bottom:16px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
        <h3 class="serif" style="font-size:15px;margin:0;">Device Storage</h3>
        <span style="font-size:12px;color:${barColor};font-weight:600;">${usage.pct}% used (estimate)</span>
      </div>
      <div style="background:var(--line2);border-radius:6px;height:8px;overflow:hidden;margin-bottom:8px;">
        <div style="width:${usage.pct}%;background:${barColor};height:100%;"></div>
      </div>
      <p class="muted-italic" style="font-size:12px;margin:0 0 6px;">
        ${formatBytes(usage.bytes)} used, estimated against a conservative 5MB browser baseline — actual limits vary by browser and device.
        ${usage.photoCount ? ` Photos account for ~${formatBytes(usage.photoBytes)} across ${usage.photoCount} attachment${usage.photoCount===1?'':'s'}.` : ''}
      </p>
      ${usage.pct >= 60 ? `<p style="font-size:12px;color:${barColor};margin:0;font-weight:500;">${usage.pct >= 85 ? '⚠ Storage is nearly full — export a backup soon and consider removing older photos, or new entries may fail to save.' : 'Getting full — worth exporting a backup from the Audit Register toolbar (⬇ Backup) as a precaution.'}</p>` : ''}
    </div>
    <div class="card" style="overflow:hidden;">
      ${SETTINGS_SECTIONS.map(sec => `

          <button class="audit-row" data-toggle-settings="${sec.key}">

        </div>
      `).join('')}
    </div>
  `;
}
